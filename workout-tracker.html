function buildPlanKey(length, goal, subgoal) {
  let key = length + '_' + goal;
  if (subgoal) key += '_' + subgoal;
  return key;
}
function isProgramAvailable(length, goal, subgoal) {
  return !!programLibrary[buildPlanKey(length, goal, subgoal)];
}
function getProgram(length, goal, subgoal) {
  return programLibrary[buildPlanKey(length, goal, subgoal)];
}

function getFocusOptionsForGoal(goalKey) {
  return focusLibrary[goalKey] || [];
}

function getFocusLabelForGoal(goalKey, focusValue) {
  const options = getFocusOptionsForGoal(goalKey);
  const found = options.filter(function(o) { return o.value === focusValue; })[0];
  return found ? found.label : focusValue;
}

const DAY_ORDER = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

function getOrderedDayKeys() {
  const keys = Object.keys(state.activePlan);
  return DAY_ORDER.filter(function(d) { return keys.indexOf(d) !== -1; });
}

function weekOverrideKey(cycle, week) {
  return 'c' + cycle + '-w' + week;
}

function dayOrderIndex(dayKey) {
  const idx = DAY_ORDER.indexOf(dayKey);
  return idx === -1 ? 99 : idx;
}

function getEffectiveDay(dayKey, cycle, week) {
  const c = cycle !== undefined ? cycle : state.viewingCycle;
  const w = week !== undefined ? week : state.week;
  const ovKey = weekOverrideKey(c, w);
  if (state.weeklyOverrides && state.weeklyOverrides[ovKey] && state.weeklyOverrides[ovKey][dayKey]) {
    return state.weeklyOverrides[ovKey][dayKey];
  }
  return state.activePlan[dayKey];
}

let stateVersion = 0;

let state = {
  screen: 'select_goal',
  disclaimerAccepted: false,
  disclaimerAcceptedDate: null,
  selectedLength: null,
  selectedGoal: null,
  selectedSubgoal: null,

  activePlan: null,

  week: 1,

  viewingCycle: 1,
  day: 'mon',
  weights: {},

  programPriority: null,

};

const GRAPH_PREFS_KEY = 'workout-graph-prefs-v1';
let graphPrefs = {
  range: 'all',
  view: 'compact',
  trendLines: {}
};

function loadGraphPrefs() {
  try {
    const raw = localStorage.getItem(GRAPH_PREFS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        graphPrefs = Object.assign({}, graphPrefs, parsed);
        if (!graphPrefs.trendLines) graphPrefs.trendLines = {};
      }
    }
  } catch (e) {}
}

function saveGraphPrefs() {
  try {
    localStorage.setItem(GRAPH_PREFS_KEY, JSON.stringify(graphPrefs));
  } catch (e) {}
}

function setGraphRange(range) {
  if (graphPrefs.range === range) return;
  graphPrefs.range = range;
  saveGraphPrefs();
  render();
}

function filterPointsByRange(points, range) {
  if (!range || range === 'all') return points;
  if (!points || points.length === 0) return points;
  const hasWeekCycle = points.every(function(p) { return typeof p.week === 'number' && typeof p.cycle === 'number'; });
  if (!hasWeekCycle) return points;

  if (range === 'program') {
    return points.filter(function(p) { return p.cycle === state.viewingCycle; });
  }
  if (range === '30d') {
    const weeksBack = 4;
    const sameCycle = points.filter(function(p) { return p.cycle === state.viewingCycle; });
    if (sameCycle.length === 0) return points;
    const maxWeek = Math.max.apply(null, sameCycle.map(function(p) { return p.week; }));
    return sameCycle.filter(function(p) { return p.week > maxWeek - weeksBack; });
  }
  return points;
}

function renderGraphControls(container, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'graph-controls';

  const rangeGroup = document.createElement('div');
  rangeGroup.className = 'graph-control-group';
  [
    { key: '30d', label: '30 Days' },
    { key: 'program', label: 'This Program' },
    { key: 'all', label: 'All Time' }
  ].forEach(function(opt) {
    const btn = document.createElement('button');
    btn.className = 'graph-control-btn' + (graphPrefs.range === opt.key ? ' active' : '');
    btn.textContent = opt.label;
    btn.onclick = function() { setGraphRange(opt.key); if (onChange) onChange(); };
    rangeGroup.appendChild(btn);
  });
  wrap.appendChild(rangeGroup);
  container.appendChild(wrap);
}

    const raw = localStorage.getItem(ACHIEVEMENTS_KEY);

    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}

function saveUnlockedAchievements(list) {
  try {
    localStorage.setItem(ACHIEVEMENTS_KEY, JSON.stringify(list));
  } catch (e) {}
}

function computeLifetimeCompletedWorkouts() {
  let count = 0;
  const orderedDays = getOrderedDayKeys();
  for (let c = 1; c <= state.cycle; c++) {
    const totalWeeksForCycle = (c === state.cycle) ? (state.programLength || 8) : 8;
    for (let w = 1; w <= totalWeeksForCycle; w++) {
      orderedDays.forEach(function(dayKey) {
        if (state.activePlan[dayKey].rest) return;
        if (c < state.cycle || w < state.week || (c === state.cycle && w === state.week)) {
          if (isDayComplete(dayKey, w)) count++;
        }
      });
    }
  }
  return count;
}

function computeLifetimePRCount() {
  let prCount = 0;
  Object.keys(exerciseLibrary).forEach(function(exId) {
    const ex = exerciseLibrary[exId];
    if (!ex || ex.noWeight) return;
    const entries = getAllEntriesForExercise(exId).slice().sort(function(a, b) { return (a.cycle - b.cycle) || (a.week - b.week); });
    let runningMax = -Infinity;
    entries.forEach(function(e) {
      if (e.weight > runningMax) { prCount++; runningMax = e.weight; }
    });
  });
  computeAllCustomExerciseIds().forEach(function(exId) {
    const entries = getOptionalEntriesForExercise(exId);
    let runningMax = -Infinity;
    entries.forEach(function(e) {
      if (e.weight > runningMax) { prCount++; runningMax = e.weight; }
    });
  });
  return prCount;
}

function computeLifetimeVolume() {
  let total = 0;
  Object.keys(state.activePlan).forEach(function(dayKey) {
    for (let c = 1; c <= state.cycle; c++) {
      for (let w = 1; w <= (state.programLength || 8); w++) {
        const day = state.activePlan[dayKey];
        (day.exerciseIds || []).forEach(function(exId) {
          const ex = exerciseLibrary[exId];
          if (!ex || ex.noWeight) return;
          const entry = getEntry(dayKey, exId, w, c);
          if (entry && entry.weight) {
            const parsed = parseSchemeForVolume(ex.scheme);
            if (parsed) total += parseFloat(entry.weight) * parsed.sets * parsed.reps;
          }
        });
      }
    }
  });
  return Math.round(total);
}

function computeCurrentWorkoutStreak() {
  const completions = getRecentWorkoutCompletions(200);
  let streak = 0;
  for (let i = completions.length - 1; i >= 0; i--) {
    if (completions[i]) streak++;
    else break;
  }
  return streak;
}

  { id: 'streak_30', label: '30-Workout Streak', desc: 'Completed 30 scheduled workouts in a row without a miss', check: function(stats) { return stats.currentStreak >= 30; } },
  { id: 'first_pr', label: 'First Personal Record', desc: 'Set your first logged personal record', check: function(stats) { return stats.lifetimePRs >= 1; } },

];

let achievementsCache = null;
let achievementsCacheVersion = -1;
let achievementsNewlyUnlockedConsumed = true;

function computeAndSyncAchievements() {
  if (achievementsCache && achievementsCacheVersion === stateVersion) {
    return {
      unlockedIds: achievementsCache.unlockedIds,
      stats: achievementsCache.stats,
      newlyUnlocked: achievementsNewlyUnlockedConsumed ? [] : achievementsCache.newlyUnlocked
    };
  }

  const stats = {
    lifetimeWorkouts: computeLifetimeCompletedWorkouts(),
    programsCompleted: (state.celebratedCycles || []).length,
    currentStreak: computeCurrentWorkoutStreak(),
    lifetimePRs: computeLifetimePRCount(),
    lifetimeVolume: computeLifetimeVolume()
  };

  const unlocked = loadUnlockedAchievements();
  const unlockedSet = {};
  unlocked.forEach(function(id) { unlockedSet[id] = true; });

  let newlyUnlocked = [];
  achievementDefinitions.forEach(function(def) {
    if (!unlockedSet[def.id] && def.check(stats)) {
      unlockedSet[def.id] = true;
      newlyUnlocked.push(def.id);
    }
  });

  if (newlyUnlocked.length > 0) {
    saveUnlockedAchievements(Object.keys(unlockedSet));
  }

  const result = { unlockedIds: Object.keys(unlockedSet), newlyUnlocked: newlyUnlocked, stats: stats };
  achievementsCache = result;
  achievementsCacheVersion = stateVersion;
  achievementsNewlyUnlockedConsumed = false;
  return result;
}

function markAchievementsNewlyUnlockedConsumed() {
  achievementsNewlyUnlockedConsumed = true;
}

function renderAchievementsCard(container) {
  const result = computeAndSyncAchievements();
  const unlockedSet = {};
  result.unlockedIds.forEach(function(id) { unlockedSet[id] = true; });

  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.innerHTML = '<p class="ex-name" style="margin-bottom:4px;">Achievements</p><p class="ex-scheme" style="margin-bottom:12px;">' + result.unlockedIds.length + ' of ' + achievementDefinitions.length + ' unlocked</p>';

  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:8px;';
  achievementDefinitions.forEach(function(def) {
    const isUnlocked = !!unlockedSet[def.id];
    const badge = document.createElement('div');
    badge.style.cssText = 'border-radius:10px;padding:10px;border:1px solid ' + (isUnlocked ? '#f0cba4' : '#e6e4dc') + ';background:' + (isUnlocked ? '#fdf0e6' : '#f7f6f2') + ';opacity:' + (isUnlocked ? '1' : '0.55') + ';';
    badge.innerHTML = '<div style="font-size:18px;margin-bottom:4px;">' + (isUnlocked ? '\ud83c\udfc6' : '\ud83d\udd12') + '</div>' +
      '<div style="font-size:12px;font-weight:700;color:#1c1c1a;">' + def.label + '</div>' +
      '<div style="font-size:10px;color:#999;margin-top:2px;">' + def.desc + '</div>';
    grid.appendChild(badge);
  });
  wrap.appendChild(grid);
  container.appendChild(wrap);

  if (result.newlyUnlocked.length > 0) {
    const labels = result.newlyUnlocked.map(function(id) {
      const def = achievementDefinitions.filter(function(d) { return d.id === id; })[0];
      return def ? def.label : id;
    });
    markAchievementsNewlyUnlockedConsumed();
    setTimeout(function() { showAchievementUnlockModal(labels); }, 300);
  }
}

const SHARE_PREFS_KEY = 'workout-share-prefs-v1';
const APP_DISPLAY_NAME = 'My Workout Planner';
const APP_SHARE_URL = 'https://woodrowlyell.github.io/my-workout-tracker/';

function loadSharePrefs() {
  try {
    const raw = localStorage.getItem(SHARE_PREFS_KEY);
    if (!raw) return { includeLink: true };
    const parsed = JSON.parse(raw);
    return (parsed && typeof parsed === 'object') ? Object.assign({ includeLink: true }, parsed) : { includeLink: true };
  } catch (e) {
    return { includeLink: true };
  }
}

function saveSharePrefs(prefs) {
  try { localStorage.setItem(SHARE_PREFS_KEY, JSON.stringify(prefs)); } catch (e) {}
}

function collectShareableStrengthGains() {
  const candidates = [];
  Object.keys(exerciseLibrary).forEach(function(exId) {
    const ex = exerciseLibrary[exId];
    if (!ex || ex.noWeight) return;
    const entries = getAllEntriesForExercise(exId).slice().sort(function(a, b) { return (a.cycle - b.cycle) || (a.week - b.week); });
    if (entries.length < 2) return;
    const first = entries[0];
    const best = entries.reduce(function(m, e) { return e.weight > m.weight ? e : m; }, entries[0]);
    if (best.weight <= first.weight) return;
    candidates.push({
      id: 'strength_' + exId,
      category: 'Strength Gains',
      label: ex.name,
      text: ex.name + ': ' + first.weight + ' \u2192 ' + best.weight + ' lbs'
    });
  });
  computeAllCustomExerciseIds().forEach(function(exId) {
    const def = getAnyExerciseDef(exId);
    if (!def) return;
    const entries = getOptionalEntriesForExercise(exId);
    if (entries.length < 2) return;
    const first = entries[0];
    const best = entries.reduce(function(m, e) { return e.weight > m.weight ? e : m; }, entries[0]);
    if (best.weight <= first.weight) return;
    candidates.push({
      id: 'strength_' + exId,
      category: 'Strength Gains',
      label: def.name,
      text: def.name + ': ' + first.weight + ' \u2192 ' + best.weight + ' lbs'
    });
  });
  return candidates;
}

function collectShareableMeasurements() {
  const candidates = [];
  const defs = [
    { key: 'weight', label: 'Weight', unit: 'lbs', lowerIsBetter: true },
    { key: 'waist', label: 'Waist', unit: 'in', lowerIsBetter: true },
    { key: 'hips', label: 'Hips', unit: 'in', lowerIsBetter: true }
  ];
  const allSets = (state.archivedCheckpoints || []).concat([{ cycle: state.cycle, start: state.checkpoints.start, week4: state.checkpoints.week4, week8: state.checkpoints.week8 }]);
  defs.forEach(function(def) {
    const points = [];
    allSets.forEach(function(set) {
      ['start', 'week4', 'week8', 'week12'].forEach(function(k) {
        if (set[k] && set[k][def.key]) points.push(parseFloat(set[k][def.key]));
      });
    });
    if (points.length < 2) return;
    const diff = points[points.length - 1] - points[0];
    const isImprovement = def.lowerIsBetter ? diff < 0 : diff > 0;
    if (!isImprovement) return;
    candidates.push({
      id: 'measurement_' + def.key,
      category: 'Body Measurements',
      label: def.label,
      text: def.label + ': ' + Math.abs(diff).toFixed(1) + ' ' + def.unit + ' ' + (def.lowerIsBetter ? 'lost' : 'gained')
    });
  });
  return candidates;
}

function collectShareableProgramStats() {
  const candidates = [];
  const streak = computeCurrentWorkoutStreak();
  if (streak >= 3) {
    candidates.push({ id: 'streak', category: 'Program Stats', label: 'Current Streak', text: streak + '-workout streak' });
  }
  const lifetimeWorkouts = computeLifetimeCompletedWorkouts();
  if (lifetimeWorkouts >= 1) {
    candidates.push({ id: 'total_workouts', category: 'Program Stats', label: 'Total Workouts', text: lifetimeWorkouts + ' workouts completed' });
  }
  const progress = computeProgramProgress();
  if (progress.percentComplete > 0) {
    candidates.push({ id: 'percent_complete', category: 'Program Stats', label: 'Program Progress', text: progress.percentComplete + '% through current program' });
  }
  return candidates;
}

function collectShareableAchievements() {
  const unlocked = loadUnlockedAchievements();
  const unlockedSet = {};
  unlocked.forEach(function(id) { unlockedSet[id] = true; });
  return achievementDefinitions
    .filter(function(def) { return unlockedSet[def.id]; })
    .map(function(def) { return { id: 'achievement_' + def.id, category: 'Achievements', label: def.label, text: '\ud83c\udfc6 ' + def.label }; });
}

function collectAllShareCandidates() {
  return [].concat(
    collectShareableStrengthGains(),
    collectShareableMeasurements(),
    collectShareableProgramStats(),
    collectShareableAchievements()
  );
}

function drawShareCard(canvas, selectedItems, includeLink) {
  const ctx = canvas.getContext('2d');
  const W = 600, H = 750;
  canvas.width = W;
  canvas.height = H;

  ctx.fillStyle = '#1c1c1a';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#e8722c';
  ctx.fillRect(0, 0, W, 8);

  ctx.fillStyle = '#fff';
  ctx.font = '700 30px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('My Progress', W / 2, 70);

  ctx.fillStyle = '#b8b7b0';
  ctx.font = '600 14px -apple-system, sans-serif';
  ctx.fillText(new Date().toLocaleDateString(undefined, { month: 'long', year: 'numeric' }), W / 2, 96);

  let y = 150;
  const grouped = {};
  selectedItems.forEach(function(item) {
    if (!grouped[item.category]) grouped[item.category] = [];
    grouped[item.category].push(item);
  });

  Object.keys(grouped).forEach(function(cat) {
    ctx.fillStyle = '#e8722c';
    ctx.font = '700 13px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(cat.toUpperCase(), 40, y);
    y += 30;
    grouped[cat].forEach(function(item) {
      ctx.fillStyle = '#fff';
      ctx.font = '600 20px -apple-system, sans-serif';
      ctx.fillText(item.text, 40, y);
      y += 36;
    });
    y += 14;
  });

  if (includeLink) {
    ctx.fillStyle = '#666';
    ctx.font = '600 13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(APP_DISPLAY_NAME, W / 2, H - 30);
  }
}

function buildShareText(selectedItems, includeLink) {
  let text = selectedItems.map(function(i) { return i.text; }).join('\n');
  if (includeLink) {
    text += '\n\n' + APP_DISPLAY_NAME + ': ' + APP_SHARE_URL;
  }
  return text;
}

function canvasToBlob(canvas) {
  return new Promise(function(resolve) {
    canvas.toBlob(function(blob) { resolve(blob); }, 'image/png');
  });
}

async function shareCard(canvas, selectedItems, includeLink) {
  const shareText = buildShareText(selectedItems, includeLink);
  try {
    const blob = await canvasToBlob(canvas);
    const file = new File([blob], 'my-progress.png', { type: 'image/png' });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text: shareText, title: 'My Progress' });
      return;
    }
  } catch (e) {}
  try {
    const blob = await canvasToBlob(canvas);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'my-progress.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    toast('Image downloaded \u2014 share it from your Photos/Downloads');
  } catch (e2) {
    toast('Could not generate image: ' + e2.message);
  }
}

function copyShareTextToClipboard(selectedItems, includeLink) {
  const text = buildShareText(selectedItems, includeLink);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() { toast('Copied to clipboard'); }, function() {
      showManualCopyBox(text);
    });
  } else {
    showManualCopyBox(text);
  }
}

function startGuidedOnboarding(goalKey, subgoalKey) {
  state.onboarding = { stepIndex: 0, answers: {}, goalKey: goalKey, subgoalKey: subgoalKey || null };
  state.screen = 'onboarding';
  saveState();
  render();
}

function onboardingSelectSingle(stepKey, value) {
  state.onboarding.answers[stepKey] = value;
  saveState();
}

function onboardingToggleMulti(stepKey, value, max) {
  const current = state.onboarding.answers[stepKey] || [];
  const idx = current.indexOf(value);
  if (idx !== -1) {
    current.splice(idx, 1);
  } else {
    if (current.length >= max) { toast('You can choose up to ' + max); return; }
    current.push(value);
  }
  state.onboarding.answers[stepKey] = current;
  saveState();
  render();
}

function onboardingNext() {
  const steps = getEffectiveOnboardingSteps(state.onboarding.goalKey);
  const step = steps[state.onboarding.stepIndex];
  const answer = state.onboarding.answers[step.key];
  const hasAnswer = step.multi ? (answer && answer.length > 0) : (answer !== undefined && answer !== null);
  if (!hasAnswer && step.key !== 'secondaryFocus' && step.key !== 'avoidExercises') {
    toast('Please make a selection to continue');
    return;
  }
  if (state.onboarding.stepIndex < steps.length - 1) {
    state.onboarding.stepIndex += 1;
    saveState();
    render();
  } else {
    state.screen = 'onboarding_summary';
    saveState();
    render();
  }
}

function onboardingBack() {
  if (state.onboarding.stepIndex > 0) {
    state.onboarding.stepIndex -= 1;
    saveState();
    render();
  } else {
    const goalKey = state.onboarding.goalKey;
    state.onboarding = null;
    if (goalKey && goalTemplates[goalKey] && goalTemplates[goalKey].subgoals) {
      state.screen = 'select_subgoal';
    } else {
      state.screen = 'select_goal';
    }
    saveState();
    render();
  }
}

function resolveEffectiveSplit(frequency, splitPref) {
  if (splitPref !== 'no_preference') {
    if (splitPref === 'upper_lower' && frequency < 2) return { split: 'full_body', note: 'Upper/Lower needs at least 2 days, so we used Full Body instead.' };
    if (splitPref === 'ppl' && frequency < 3) return { split: 'upper_lower', note: 'Push/Pull/Legs needs at least 3 days, so we used Upper/Lower instead.' };
    return { split: splitPref, note: null };
  }
  if (frequency <= 3) return { split: 'full_body', note: null };
  if (frequency <= 5) return { split: 'upper_lower', note: null };
  return { split: 'ppl', note: null };
}

const optionLabelLookups = {};
onboardingSteps.forEach(function(step) {
  const map = {};
  step.options.forEach(function(opt) { map[opt.value] = opt.label; });
  optionLabelLookups[step.key] = map;
});

function getEffectiveOnboardingSteps(goalKey) {
  const tmpl = goalTemplates[goalKey];
  if (!tmpl || !tmpl.usesFocusLibrary) return onboardingSteps;
  const focusOptions = getFocusOptionsForGoal(goalKey);
  const focusStep = {
    key: 'secondaryFocus',
    title: 'Choose Your Areas of Focus',
    sub: 'Choose as many as you\u2019d like. For best results, select the areas that matter most to you \u2014 if you choose several, the program will balance emphasis across them rather than maxing out every one.',
    multi: true,
    max: focusOptions.length,
    options: focusOptions.map(function(f) { return { value: f.value, label: f.label }; })
  };
  return [focusStep].concat(onboardingSteps.slice(1));
}

function getEffectiveOnboardingStep(stepIndex, goalKey) {
  return getEffectiveOnboardingSteps(goalKey)[stepIndex];
}

function renderOnboardingStep(container) {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const step = getEffectiveOnboardingStep(state.onboarding.stepIndex, state.onboarding.goalKey);
  const totalSteps = getEffectiveOnboardingSteps(state.onboarding.goalKey).length;
  const wrap = document.createElement('div');
  wrap.className = 'goal-screen';
  wrap.style.textAlign = 'left';

  const progress = document.createElement('div');
  progress.style.cssText = 'display:flex;gap:4px;margin-bottom:18px;';
  for (let i = 0; i < totalSteps; i++) {
    const dot = document.createElement('div');
    dot.style.cssText = 'flex:1;height:4px;border-radius:2px;background:' + (i <= state.onboarding.stepIndex ? '#e8722c' : '#e6e4dc') + ';';
    progress.appendChild(dot);
  }
  wrap.appendChild(progress);

  const stepCount = document.createElement('div');
  stepCount.style.cssText = 'font-size:12px;color:#999;font-weight:600;margin-bottom:6px;';
  stepCount.textContent = 'Step ' + (state.onboarding.stepIndex + 1) + ' of ' + totalSteps;
  wrap.appendChild(stepCount);

  const h = document.createElement('h2');
  h.style.cssText = 'text-align:left;font-size:19px;';
  h.textContent = step.title;
  wrap.appendChild(h);

  if (step.sub) {
    const sub = document.createElement('p');
    sub.style.cssText = 'text-align:left;';
    sub.textContent = step.sub;
    wrap.appendChild(sub);
  }

  const currentAnswer = state.onboarding.answers[step.key];
  step.options.forEach(function(opt) {
    const btn = document.createElement('button');
    btn.className = 'goal-btn';
    const isSelected = step.multi ? (currentAnswer && currentAnswer.indexOf(opt.value) !== -1) : (currentAnswer === opt.value);
    if (isSelected) { btn.style.cssText = 'border-color:#e8722c;background:#fdf0e6;'; }
    btn.textContent = opt.label + (isSelected ? '  \u2713' : '');
    btn.onclick = function() {
      if (step.multi) {
        onboardingToggleMulti(step.key, opt.value, step.max);
      } else {
        onboardingSelectSingle(step.key, opt.value);
        render();
      }
    };
    wrap.appendChild(btn);
  });

  const navRow = document.createElement('div');
  navRow.style.cssText = 'display:flex;gap:8px;margin-top:16px;';
  const backBtn = document.createElement('button');
  backBtn.className = 'modal-close';
  backBtn.style.cssText = 'flex:1;margin-top:0;';
  backBtn.textContent = 'Back';
  backBtn.onclick = onboardingBack;
  navRow.appendChild(backBtn);
  const nextBtn = document.createElement('button');
  nextBtn.style.cssText = 'flex:2;padding:12px;background:#1c1c1a;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;';
  nextBtn.textContent = (state.onboarding.stepIndex === totalSteps - 1) ? 'Review My Answers' : 'Next';
  nextBtn.onclick = onboardingNext;
  navRow.appendChild(nextBtn);
  wrap.appendChild(navRow);

  app.appendChild(wrap);
}

function exercisesPerDayForDuration(duration) {
  const workMinutes = duration - 10;
  const perExercise = 7;
  const count = Math.max(2, Math.round(workMinutes / perExercise));
  return Math.min(count, 8);
}

function equipmentAllowsExercise(exId, equipment) {
  const ex = exerciseLibrary[exId];
  if (!ex) return false;
  if (ex.equipment && equipmentTagAllowedFor[ex.equipment]) {
    return equipmentTagAllowedFor[ex.equipment].indexOf(equipment) !== -1;
  }
  const machineExercises = ['chest_press_machine', 'shoulder_press_machine', 'leg_press', 'lat_pulldown', 'chest_supported_row', 'seated_cable_row', 'cable_lateral_raise', 'cable_curl', 'triceps_pushdown', 'leg_extension', 'seated_leg_curl', 'calf_raise_machine', 'smith_rdl', 'smith_hip_thrust', 'hip_abductor', 'hip_adductor', 'rear_delt_pec_deck', 'torso_rotation', 'ab_crunch_machine', 'cable_woodchop', 'cable_chest_press', 'face_pull', 'straight_arm_pulldown'];
  const dumbbellExercises = ['incline_db_press', 'flat_db_press', 'db_shoulder_press', 'db_lateral_raise', 'hammer_curl', 'db_curl', 'goblet_squat', 'triceps_kickback', 'overhead_triceps_ext'];
  if (equipment === 'bodyweight_only') {
    return !!ex.noWeight && machineExercises.indexOf(exId) === -1 && dumbbellExercises.indexOf(exId) === -1;
  }
  if (equipment === 'dumbbells_only') {
    return ex.noWeight || dumbbellExercises.indexOf(exId) !== -1;
  }
  if (equipment === 'home_gym') {
    return machineExercises.indexOf(exId) === -1;
  }
  return true;
}

function getMusclePoolForTemplate(goalKey, subgoalKey) {
  const tmpl = goalTemplates[goalKey];
  if (tmpl && tmpl.usesFocusLibrary) {
    const muscles = {};
    Object.keys(exerciseLibrary).forEach(function(exId) {
      const m = exerciseLibrary[exId].muscle;
      if (m === 'yoga') return;
      if (goalKey === 'improve_mobility' && !exerciseLibrary[exId].isMobility) return;
      if (!muscles[m]) muscles[m] = [];
      muscles[m].push(exId);
    });
    return muscles;
  }
  const key = buildPlanKey(8, goalKey, subgoalKey) || buildPlanKey(8, goalKey, null);
  const template = programLibrary[key] || programLibrary[buildPlanKey(4, goalKey, subgoalKey)] || programLibrary[buildPlanKey(12, goalKey, subgoalKey)];
  const muscles = {};
  if (!template) {
    Object.keys(exerciseLibrary).forEach(function(exId) {
      const m = exerciseLibrary[exId].muscle;
      if (m === 'cardio' || m === 'yoga') return;
      if (!muscles[m]) muscles[m] = [];
      muscles[m].push(exId);
    });
    return muscles;
  }
  Object.keys(template.days).forEach(function(dk) {
    const day = template.days[dk];
    if (day.rest || !day.exerciseIds) return;
    day.exerciseIds.forEach(function(exId) {
      const m = exerciseLibrary[exId] ? exerciseLibrary[exId].muscle : null;
      if (!m) return;
      if (!muscles[m]) muscles[m] = [];
      if (muscles[m].indexOf(exId) === -1) muscles[m].push(exId);
    });
  });
  if (Object.keys(muscles).length === 0) {
    Object.keys(exerciseLibrary).forEach(function(exId) {
      const m = exerciseLibrary[exId].muscle;
      if (m === 'cardio' || m === 'yoga') return;
      if (!muscles[m]) muscles[m] = [];
      muscles[m].push(exId);
    });
  }
  return muscles;
}

const mobilityFocusToExerciseIds = {
  hips_mobility: ['hip_flexor_stretch', 'ninety_ninety_hip_stretch', 'worlds_greatest_stretch'],
  shoulders_mobility: ['shoulder_dislocates', 'thoracic_rotation'],
  back_mobility: ['thoracic_rotation', 'downward_dog_stretch'],
  hamstrings_mobility: ['downward_dog_stretch', 'worlds_greatest_stretch'],
  balance_mobility: ['single_leg_balance'],
  upper_body_mobility: ['shoulder_dislocates', 'thoracic_rotation'],
  lower_body_mobility: ['hip_flexor_stretch', 'ninety_ninety_hip_stretch', 'downward_dog_stretch', 'standing_calf_stretch', 'worlds_greatest_stretch'],
  full_body_mobility: ['hip_flexor_stretch', 'worlds_greatest_stretch', 'shoulder_dislocates', 'single_leg_balance', 'ninety_ninety_hip_stretch', 'thoracic_rotation', 'downward_dog_stretch', 'standing_calf_stretch']
};

function getMobilityFocusExerciseIds(secondaryFocusList, goalKey) {
  if (goalKey !== 'improve_mobility') return null;
  const groups = (secondaryFocusList || [])
    .map(function(f) { return mobilityFocusToExerciseIds[f] || []; })
    .filter(function(g) { return g.length > 0; });
  if (groups.length === 0) return null;
  const interleaved = [];
  const seen = {};
  let idx = 0;
  let anyRemaining = true;
  while (anyRemaining) {
    anyRemaining = false;
    for (let g = 0; g < groups.length; g++) {
      const candidate = groups[g][idx];
      if (candidate !== undefined && !seen[candidate]) {
        interleaved.push(candidate);
        seen[candidate] = true;
        anyRemaining = true;
      } else if (candidate !== undefined) {
        anyRemaining = anyRemaining || (groups[g][idx + 1] !== undefined);
      }
    }
    idx++;
  }
  return interleaved;
}

function substituteIfAvoided(exId, avoidList, equipment) {
  const nameKeyMap = { deadlifts: 'smith_rdl', squats: 'goblet_squat', bench_press: 'chest_press_machine', pull_ups: 'lat_pulldown', overhead_press: 'shoulder_press_machine', running: 'treadmill' };
  const avoidedIds = (avoidList || []).map(function(a) { return nameKeyMap[a]; }).filter(Boolean);
  if (avoidedIds.indexOf(exId) === -1 && equipmentAllowsExercise(exId, equipment)) return exId;
  const muscle = exerciseLibrary[exId] ? exerciseLibrary[exId].muscle : null;
  if (!muscle) return exId;
  const candidates = (substituteGroups[muscle] || []).filter(function(id) {
    return avoidedIds.indexOf(id) === -1 && equipmentAllowsExercise(id, equipment);
  });
  return candidates.length > 0 ? candidates[0] : exId;
}

const muscleToUpperLowerCategory = {
  chest: 'upper', shoulders: 'upper', triceps: 'upper', back: 'upper', biceps: 'upper', core: 'upper',
  legs_posterior: 'lower', legs_general: 'lower', legs_quad: 'lower', calves: 'lower'
};

const muscleToPplCategory = {
  chest: 'push', shoulders: 'push', triceps: 'push', core: 'push',
  back: 'pull', biceps: 'pull',
  legs_posterior: 'legs', legs_general: 'legs', legs_quad: 'legs', calves: 'legs'
};

const secondaryFocusToMuscleGroups = {
  bigger_arms: ['biceps', 'triceps'],
  bigger_chest: ['chest'],
  bigger_shoulders: ['shoulders'],
  stronger_legs: ['legs_quad', 'legs_posterior', 'legs_general'],
  stronger_core: ['core'],
  better_posture: ['back'],
  shoulder_health: ['shoulders']
};

/**
 * Which of the fixed Get Stronger / General Fitness style secondary focus
 * values (from onboardingSteps[0].options) carry a real cardio/conditioning
 * bias, mirroring the cardioBias flag that focusLibrary entries already use
 * for the newer goals. weight_loss_focus is the only current entry; grip_strength,
 * mobility, and cardio_endurance remain intentionally unmapped elsewhere since
 * they don't correspond to an honest muscle-group or bias effect in this
 * exercise pool. This is read by getFocusBiasFlags below - the existing single
 * source of truth for bias flags - so no second bias mechanism is created.
 */
const secondaryFocusCardioBias = {
  weight_loss_focus: true
};

function getFocusMuscleGroups(secondaryFocusList, goalKey) {
  const muscles = {};
  const tmpl = goalTemplates[goalKey];
  if (tmpl && tmpl.usesFocusLibrary) {
    const options = getFocusOptionsForGoal(goalKey);
    (secondaryFocusList || []).forEach(function(focusValue) {
      const found = options.filter(function(o) { return o.value === focusValue; })[0];
      if (found) { (found.muscles || []).forEach(function(m) { muscles[m] = true; }); }
    });
  } else {
    (secondaryFocusList || []).forEach(function(focusKey) {
      (secondaryFocusToMuscleGroups[focusKey] || []).forEach(function(m) { muscles[m] = true; });
    });
  }
  return Object.keys(muscles);
}

function getFocusBiasFlags(secondaryFocusList, goalKey) {
  const tmpl = goalTemplates[goalKey];
  const flags = { cardioBias: false, mobilityBias: false };
  if (!tmpl || !tmpl.usesFocusLibrary) {
    // FIX: this path (Get Stronger, General Fitness, etc.) previously always
    // returned no bias at all, meaning a secondary focus like Weight Loss could
    // never have a real conditioning effect on these goals - only cosmetic
    // labeling. This now checks the same kind of bias flag the newer
    // usesFocusLibrary goals already use, via secondaryFocusCardioBias, so
    // "Get Stronger + Weight Loss" actually biases exercise selection toward
    // appropriate conditioning without becoming a different program.
    (secondaryFocusList || []).forEach(function(focusKey) {
      if (secondaryFocusCardioBias[focusKey]) flags.cardioBias = true;
    });
    return flags;
  }
  const options = getFocusOptionsForGoal(goalKey);
  (secondaryFocusList || []).forEach(function(focusValue) {
    const found = options.filter(function(o) { return o.value === focusValue; })[0];
    if (found) {
      if (found.cardioBias) flags.cardioBias = true;
      if (found.mobilityBias) flags.mobilityBias = true;
    }
  });
  return flags;
}

function prioritizeByFocusMuscles(uniqueList, focusMuscles) {
  if (!focusMuscles || focusMuscles.length === 0) return uniqueList;
  const groups = focusMuscles.map(function(m) {
    return uniqueList.filter(function(exId) {
      const ex = exerciseLibrary[exId];
      return ex && ex.muscle === m;
    });
  });
  const focusSet = {};
  focusMuscles.forEach(function(m) { focusSet[m] = true; });
  const rest = uniqueList.filter(function(exId) {
    const ex = exerciseLibrary[exId];
    return !(ex && focusSet[ex.muscle]);
  });
  const interleaved = [];
  const seenInInterleave = {};
  let idx = 0;
  let anyRemaining = true;
  while (anyRemaining) {
    anyRemaining = false;
    for (let g = 0; g < groups.length; g++) {
      const candidate = groups[g][idx];
      if (candidate !== undefined && !seenInInterleave[candidate]) {
        interleaved.push(candidate);
        seenInInterleave[candidate] = true;
        anyRemaining = true;
      } else if (candidate !== undefined) {
        anyRemaining = anyRemaining || (groups[g][idx + 1] !== undefined);
      }
    }
    idx++;
  }
  return interleaved.concat(rest);
}

function filterPoolForDayType(musclePool, dayLabelType, effectiveSplit) {
  if (effectiveSplit === 'full_body') return musclePool;
  const categoryMap = effectiveSplit === 'ppl' ? muscleToPplCategory : muscleToUpperLowerCategory;
  const dayTypeLower = dayLabelType.toLowerCase();
  const filtered = {};
  Object.keys(musclePool).forEach(function(muscle) {
    const category = categoryMap[muscle];
    if (!category || category === dayTypeLower) filtered[muscle] = musclePool[muscle];
  });
  if (Object.keys(filtered).length === 0) return musclePool;
  return filtered;
}

function buildGeneratedDay(dayKey, dayLabelType, musclePool, exCount, avoidList, equipment, rotationOffset, effectiveSplit, focusMuscles, focusBias, mobilityFocusIds) {
  const filteredPool = filterPoolForDayType(musclePool, dayLabelType, effectiveSplit);
  const muscleKeys = Object.keys(filteredPool);
  const flatList = [];
  muscleKeys.forEach(function(m) { filteredPool[m].forEach(function(exId) { flatList.push(exId); }); });
  let uniqueList = flatList.filter(function(v, i) { return flatList.indexOf(v) === i; });

  if (focusBias && focusBias.cardioBias) {
    const cardioIds = uniqueList.filter(function(id) { return exerciseLibrary[id] && exerciseLibrary[id].muscle === 'cardio'; });
    const nonCardioIds = uniqueList.filter(function(id) { return !(exerciseLibrary[id] && exerciseLibrary[id].muscle === 'cardio'); });
    uniqueList = cardioIds.concat(nonCardioIds);
  }

  if (mobilityFocusIds && mobilityFocusIds.length > 0) {
    const presentMobilityIds = mobilityFocusIds.filter(function(id) { return uniqueList.indexOf(id) !== -1; });
    const restIds = uniqueList.filter(function(id) { return presentMobilityIds.indexOf(id) === -1; });
    uniqueList = presentMobilityIds.concat(restIds);
  }

  const prioritized = prioritizeByFocusMuscles(uniqueList, focusMuscles);
  const rotated = prioritized.slice(rotationOffset).concat(prioritized.slice(0, rotationOffset));

  let effectiveExCount = exCount;
  if (focusMuscles && focusMuscles.length > 0) {
    const presentFocusMuscles = focusMuscles.filter(function(m) { return filteredPool[m] && filteredPool[m].length > 0; });
    effectiveExCount = exCount + Math.min(presentFocusMuscles.length, 2);
  }
  if (focusBias && focusBias.mobilityBias) {
    effectiveExCount = Math.max(2, effectiveExCount - 1);
  }

  const chosen = [];
  for (let i = 0; i < rotated.length && chosen.length < effectiveExCount; i++) {
    const substituted = substituteIfAvoided(rotated[i], avoidList, equipment);
    if (chosen.indexOf(substituted) === -1) chosen.push(substituted);
  }
  const dayNameMap = { sun: 'Sun', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat' };
  return {
    label: dayNameMap[dayKey] + ' ' + dayLabelType,
    warmupId: equipment === 'bodyweight_only' ? 'bodyweight_squat' : 'treadmill',
    exerciseIds: chosen,
    finisherId: 'incline_walk'
  };
}

function assignWorkoutDayKeys(frequency, effectiveSplit) {
  const spreadPatterns = {
    2: ['mon', 'thu'],
    3: ['mon', 'wed', 'fri'],
    4: ['mon', 'tue', 'thu', 'fri'],
    5: ['mon', 'tue', 'wed', 'thu', 'fri'],
    6: ['mon', 'tue', 'wed', 'thu', 'fri', 'sat']
  };
  return spreadPatterns[frequency] || spreadPatterns[3];
}

/**
 * Returns the list of {value, label} focus options valid for the CURRENT
 * program's goal - reusing whichever mechanism that goal actually uses,
 * so the Admin UI always offers the same choices the person saw during
 * onboarding, never a mismatched or invented list.
 */
function getAvailableFocusOptionsForCurrentGoal() {
  const tmpl = goalTemplates[state.goal];
  if (!tmpl) return [];
  if (tmpl.usesFocusLibrary) {
    return getFocusOptionsForGoal(state.goal);
  }
  return onboardingSteps[0].options;
}

/**
 * True if dayKey has not been started for the given week/cycle - i.e. no
 * exercise in it has any logged entry yet, and it isn't already marked
 * complete. Rest days are never regenerated by focus changes (they have
 * no exerciseIds to rebuild), so they always return false here.
 */
function isDayUnstartedForFocusChange(dayKey, week, cycle) {
  const day = state.activePlan[dayKey];
  if (!day || day.rest) return false;
  if (isDayComplete(dayKey, week)) return false;
  const hasAnyEntry = (day.exerciseIds || []).some(function(exId) { return !!getEntry(dayKey, exId, week, cycle); });
  const mob = getEntry(dayKey, '__mobility_' + dayKey + '__', week, cycle);
  const cardio = getEntry(dayKey, '__cardio_' + dayKey + '__', week, cycle);
  if (hasAnyEntry || (mob && mob.done) || (cardio && cardio.done)) return false;
  return true;
}

/**
 * Rebuilds exerciseIds for every eligible (not-yet-started) day, using the
 * SAME buildGeneratedDay function used at initial program generation, with
 * the updated focus list. Only touches state.activePlan[dayKey] itself
 * (the ongoing template for all FUTURE weeks) when the CURRENT week's
 * occurrence of that day is unstarted; if the current week's day has
 * already been started, that one day's exercises are left exactly as they
 * are for the remainder of this program, while every week strictly after
 * the current one is always eligible, since those haven't been reached at
 * all yet. The overall program goal, split, duration, length, and
 * equipment answers are read from the ORIGINAL onboarding answers where
 * still available; if unavailable (e.g. older saved programs), falls
 * back to sensible current values already used elsewhere in the app.
 */
function regenerateUnstartedDaysForFocusChange(newFocusAreas) {
  const goalKey = state.goal;
  const subgoalKey = state.selectedSubgoal;
  const musclePool = getMusclePoolForTemplate(goalKey, subgoalKey);
  const focusMuscles = getFocusMuscleGroups(newFocusAreas, goalKey);
  const focusBias = getFocusBiasFlags(newFocusAreas, goalKey);
  const mobilityFocusIds = getMobilityFocusExerciseIds(newFocusAreas, goalKey);
  const equipment = (state.onboarding && state.onboarding.answers && state.onboarding.answers.equipment) || 'full_gym';
  const avoidExercises = (state.onboarding && state.onboarding.answers && state.onboarding.answers.avoidExercises) || [];
  const duration = (state.onboarding && state.onboarding.answers && state.onboarding.answers.duration) || 45;
  const exCount = exercisesPerDayForDuration(duration);

  const orderedDays = getOrderedDayKeys();
  let rebuiltCount = 0;

  orderedDays.forEach(function(dayKey, idxInWorkout) {
    const day = state.activePlan[dayKey];
    if (!day || day.rest) return;
    if (!isDayUnstartedForFocusChange(dayKey, state.week, state.viewingCycle)) return;

    const dayLabelType = splitDayLabel(day.label).typePart || 'Full Body';
    const rebuilt = buildGeneratedDay(dayKey, dayLabelType, musclePool, exCount, avoidExercises, equipment, idxInWorkout, 'full_body', focusMuscles, focusBias, mobilityFocusIds);
    state.activePlan[dayKey] = Object.assign({}, rebuilt, { label: day.label, priorityIds: day.priorityIds });
    rebuiltCount++;
  });

  state.currentFocusAreas = newFocusAreas.slice();
  saveState();
  return rebuiltCount;
}

function renderFocusManagementTool(container) {
  const tmpl = goalTemplates[state.goal];
  if (!tmpl) return;
  const options = getAvailableFocusOptionsForCurrentGoal();
  if (options.length === 0) return;

  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.innerHTML = '<p class="ex-name" style="margin-bottom:6px;">Areas of Focus</p>' +
    '<p class="ex-scheme" style="margin-bottom:10px;">Add, remove, or change your focus areas for ' + tmpl.label + ' at any time. Your overall program goal stays the same. Changes only affect workouts you haven\u2019t started yet \u2014 anything already completed or in progress today is left exactly as it is.</p>';

  const currentSelections = (state.currentFocusAreas || []).slice();
  const checkboxRefs = {};

  options.forEach(function(opt) {
    const row = document.createElement('div');

function dayTypeLabelsForSplit(effectiveSplit, frequency) {
  if (effectiveSplit === 'full_body') {
    const labels = [];
    for (let i = 0; i < frequency; i++) labels.push('Full Body');
    return labels;
  }
  if (effectiveSplit === 'upper_lower') {
    const labels = [];
    for (let i = 0; i < frequency; i++) labels.push(i % 2 === 0 ? 'Upper' : 'Lower');
    return labels;
  }
  const pplCycle = ['Push', 'Pull', 'Legs'];
  const labels = [];
  for (let i = 0; i < frequency; i++) labels.push(pplCycle[i % 3]);
  return labels;
}

function generatePersonalizedProgram() {
  const answers = state.onboarding.answers;
  const goalKey = state.onboarding.goalKey;
  const subgoalKey = state.onboarding.subgoalKey;
  const effective = resolveEffectiveSplit(answers.frequency, answers.split);
  const workoutDayKeys = assignWorkoutDayKeys(answers.frequency, effective.split);
  const dayTypeLabels = dayTypeLabelsForSplit(effective.split, answers.frequency);
  const musclePool = getMusclePoolForTemplate(goalKey, subgoalKey);
  const exCount = exercisesPerDayForDuration(answers.duration);
  const focusMuscles = getFocusMuscleGroups(answers.secondaryFocus, goalKey);
  const focusBias = getFocusBiasFlags(answers.secondaryFocus, goalKey);
  const mobilityFocusIds = getMobilityFocusExerciseIds(answers.secondaryFocus, goalKey);

  const newActivePlan = {};
  DAY_ORDER.forEach(function(dk) {
    const idxInWorkout = workoutDayKeys.indexOf(dk);
    if (idxInWorkout === -1) {
      const dayNameMap = { sun: 'Sun', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat' };
      newActivePlan[dk] = {
        label: dayNameMap[dk] + ' Rest',
        rest: true,
        items: ['Rest', 'Stretch', 'Walk if desired'],
        stepsGoal: '8,000+'
      };
    } else {
      newActivePlan[dk] = buildGeneratedDay(dk, dayTypeLabels[idxInWorkout], musclePool, exCount, answers.avoidExercises, answers.equipment, idxInWorkout, effective.split, focusMuscles, focusBias, mobilityFocusIds);
    }
  });

  state.goal = goalKey;
  state.selectedGoal = goalKey;
  state.selectedSubgoal = subgoalKey;
  state.activePlan = newActivePlan;
  state.programLength = answers.programLength;
  state.programRecoveryPref = answers.recovery;
  state.programPriority = answers.priority;
  state.cycleStartDate = todayStr();
  // BATCH 4b: persist the chosen focus areas as an ongoing, editable part of the
  // program (previously this only ever lived in the transient state.onboarding
  // object, which is discarded after generation - making later changes
  // impossible). This is purely additive state; nothing here changes how the
  // initial generation itself works.
  state.currentFocusAreas = (answers.secondaryFocus || []).slice();
  state.screen = 'day';
  state.week = 1;
  state.day = workoutDayKeys[0] || 'mon';
  saveState();
  showFireworksCelebration('Your personalized program is ready! Time to get started.');
  render();
}

function estimateWorkoutCount(frequency, weeks) {
  return frequency * weeks;
}

function estimateCompletionDate(weeks) {
  const d = new Date();
  d.setDate(d.getDate() + weeks * 7);
  return d.toISOString().split('T')[0];
}

function buildProgramHighlights(answers) {
  const highlights = [];
  const goalKey = state.onboarding.goalKey;
  const tmpl = goalTemplates[goalKey];
  const goalLabel = tmpl ? tmpl.label : '';
  highlights.push('Built around ' + goalLabel);
  if (answers.secondaryFocus && answers.secondaryFocus.length > 0) {
    if (tmpl && tmpl.usesFocusLibrary) {
      const fociLabels = answers.secondaryFocus.map(function(v) { return getFocusLabelForGoal(goalKey, v); }).join(', ');
      highlights.push('Areas of focus: ' + fociLabels + '. Your program will balance emphasis across these areas while keeping ' + goalLabel + ' as the primary goal.');
    } else {
      const biasedFoci = answers.secondaryFocus.filter(function(v) { return secondaryFocusToMuscleGroups[v] || secondaryFocusCardioBias[v]; });
      const infoOnlyFoci = answers.secondaryFocus.filter(function(v) { return !secondaryFocusToMuscleGroups[v] && !secondaryFocusCardioBias[v]; });
      if (biasedFoci.length > 0) {
        const fociLabels = biasedFoci.map(function(v) { return optionLabelLookups.secondaryFocus[v]; }).join(' and ');
        highlights.push('Extra exercises and appropriate conditioning prioritized for ' + fociLabels);
      }
      if (infoOnlyFoci.length > 0) {
        const infoLabels = infoOnlyFoci.map(function(v) { return optionLabelLookups.secondaryFocus[v]; }).join(' and ');
        highlights.push(infoLabels + ' noted as a goal, though exercise selection isn\u2019t adjusted for it specifically');
      }
    }
  }
  const effective = resolveEffectiveSplit(answers.frequency, answers.split);
  const splitLabels = { full_body: 'Full Body', upper_lower: 'Upper/Lower', ppl: 'Push/Pull/Legs' };
  highlights.push(splitLabels[effective.split] + ' split, ' + answers.frequency + ' days a week');
  highlights.push(answers.duration + '-minute sessions');
  if (answers.avoidExercises && answers.avoidExercises.length > 0) {
    highlights.push('Avoiding: ' + answers.avoidExercises.map(function(v) { return optionLabelLookups.avoidExercises[v]; }).join(', '));

  return highlights;
}

function todayStr() { return new Date().toISOString().split('T')[0]; }

function formatDateMDY(isoDateStr) {
  if (!isoDateStr) return '';
  const parts = isoDateStr.split('-');
  if (parts.length !== 3) return isoDateStr;
  return parts[1] + '-' + parts[2] + '-' + parts[0];
}

function getTargetDateForWeek(startDateStr, weekNumber) {
  const startDate = new Date(startDateStr + 'T00:00:00');
  const targetDate = new Date(startDate);
  targetDate.setDate(startDate.getDate() + (weekNumber - 1) * 7);
  return targetDate.toISOString().split('T')[0];
}

function migrateToPerDayKeys() {
  if (state.migratedToPerDay) return;
  if (!state.activePlan) return;
  const oldKeyPattern = /^([a-zA-Z0-9_]+)::c(\d+)::w(\d+)$/;
  const newWeights = {};
  let migratedCount = 0;
  Object.keys(state.weights).forEach(function(oldKey) {
    const alreadyNewFormat = oldKey.split('::').length === 4;
    if (alreadyNewFormat) { newWeights[oldKey] = state.weights[oldKey]; return; }
    const match = oldKey.match(oldKeyPattern);
    if (!match) { newWeights[oldKey] = state.weights[oldKey]; return; }
    const exId = match[1]; const cycle = match[2]; const week = match[3];
    let ownerDay = null;
    Object.keys(state.activePlan).forEach(function(dayKey) {
      const day = state.activePlan[dayKey];
      if (day.rest) return;
      if (day.exerciseIds && day.exerciseIds.indexOf(exId) !== -1) { if (!ownerDay) ownerDay = dayKey; }
    });
    if (ownerDay) {
      const newKey = ownerDay + '::' + exId + '::c' + cycle + '::w' + week;
      newWeights[newKey] = state.weights[oldKey];
      migratedCount++;
    } else { newWeights[oldKey] = state.weights[oldKey]; }
  });
  state.weights = newWeights;
  state.migratedToPerDay = true;
  saveState();
  if (migratedCount > 0) { toast('Data updated: ' + migratedCount + ' entries migrated'); }
}

function daysSince(isoDateStr) {
  if (!isoDateStr) return Infinity;
  const then = new Date(isoDateStr + 'T00:00:00');
  const now = new Date(todayStr() + 'T00:00:00');
  return Math.round((now - then) / (1000 * 60 * 60 * 24));
}

const AUTO_BACKUP_MAX = 5;

function takeAutoBackupIfDue() {
  if (!state.autoBackupHistory) state.autoBackupHistory = [];
  const lastAuto = state.autoBackupHistory.length > 0 ? state.autoBackupHistory[state.autoBackupHistory.length - 1].date : null;
  if (daysSince(lastAuto) < 1) return;
  const stateForSnapshot = Object.assign({}, state);
  stateForSnapshot.autoBackupHistory = [];
  const snapshot = {
    date: todayStr(),
    data: JSON.stringify(stateForSnapshot)
  };
  state.autoBackupHistory.push(snapshot);
  if (state.autoBackupHistory.length > AUTO_BACKUP_MAX) {
    state.autoBackupHistory = state.autoBackupHistory.slice(state.autoBackupHistory.length - AUTO_BACKUP_MAX);
  }
}

async function loadProgramData() {
  const bannerContainer = document.getElementById('app');
  try {
    const response = await fetch('programData.json');
    if (!response.ok) { throw new Error('status ' + response.status); }
    const data = await response.json();
    exerciseLibrary = data.exerciseLibrary;
    programLibrary = data.programLibrary;
    Object.assign(exerciseLibrary, version11NewExercises);
    // BATCH 2: merge in the new curl/press exercises that close real gaps in the
    // substitution pool (see movementPatternMap comment above). Never touches
    // programData.json; purely additive, same mechanism as version11NewExercises.
    Object.assign(exerciseLibrary, batch2NewExercises);
    Object.keys(exerciseLibrary).forEach(function(id) {
      const m = exerciseLibrary[id].muscle;
      if (!substituteGroups[m]) substituteGroups[m] = [];
      substituteGroups[m].push(id);
    });
    rebuildMovementPatternGroups();
    return true;
  } catch (e) {
    bannerContainer.innerHTML = '<div style="padding:30px 20px;text-align:center;">' +
      '<h2 style="color:#b31942;">Could not load program data</h2>' +
      '<p style="font-size:14px;color:#666;">Failed to load programData.json (' + e.message + ')</p>' +

function showTutorial(onFinish) {
  let step = 0;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.alignItems = 'center';
  const sheet = document.createElement('div');
  sheet.className = 'modal-sheet';
  sheet.style.cssText = 'border-radius:20px;max-height:85vh;width:92%;max-width:420px;margin:0 auto;';
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);

  function renderSlide() {
    const slide = tutorialSlides[step];
    sheet.innerHTML = '';

    const dots = document.createElement('div');
    dots.style.cssText = 'display:flex;justify-content:center;gap:6px;margin-bottom:14px;';
    tutorialSlides.forEach(function(s, i) {
      const dot = document.createElement('div');
      dot.style.cssText = 'width:6px;height:6px;border-radius:50%;background:' + (i === step ? '#e8722c' : '#e6e4dc') + ';';
      dots.appendChild(dot);
    });
    sheet.appendChild(dots);

    const h = document.createElement('h3');
    h.style.cssText = 'text-align:center;margin-bottom:8px;';
    h.textContent = slide.title;
    sheet.appendChild(h);

    const body = document.createElement('div');
    body.className = 'modal-sub';
    body.style.textAlign = 'center';
    body.textContent = slide.body;
    sheet.appendChild(body);

    if (slide.mock) {
      const mockWrap = document.createElement('div');
      mockWrap.style.cssText = 'background:#f4f3ef;border-radius:14px;overflow:hidden;margin:14px 0;border:1px solid #e6e4dc;';
      mockWrap.innerHTML = slide.mock;
      sheet.appendChild(mockWrap);
    }

    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;gap:8px;margin-top:16px;';
    if (step > 0) {
      const backBtn = document.createElement('button');
      backBtn.className = 'modal-close';
      backBtn.style.cssText = 'flex:1;margin-top:0;';
      backBtn.textContent = 'Back';
      backBtn.onclick = function() {
        step = step - 1;
        renderSlide();
      };
      btnRow.appendChild(backBtn);
    }
    const nextBtn = document.createElement('button');
    nextBtn.style.cssText = 'flex:2;padding:12px;background:#1c1c1a;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;';
    nextBtn.textContent = (step === tutorialSlides.length - 1) ? 'Done' : 'Next';
    nextBtn.onclick = function() {
      if (step === tutorialSlides.length - 1) {
        document.body.removeChild(overlay);
        if (onFinish) { onFinish(); }
      } else {
        step = step + 1;
        renderSlide();
      }
    };
    btnRow.appendChild(nextBtn);
    sheet.appendChild(btnRow);

    if (step === 0) {
      const skipBtn = document.createElement('button');
      skipBtn.style.cssText = 'width:100%;padding:10px;background:none;border:none;color:#999;font-size:13px;text-decoration:underline;margin-top:10px;';
      skipBtn.textContent = 'Skip tutorial';
      skipBtn.onclick = function() {
        document.body.removeChild(overlay);
        if (onFinish) { onFinish(); }
      };
      sheet.appendChild(skipBtn);
    }
  }

  renderSlide();
}

function computeAllCustomExerciseIds() {
  const customLib = loadCustomExercises();
  return Object.keys(customLib).filter(function(id) { return !customLib[id].archived; });
}

function getAllOptionallyLoggedExerciseIds() {
  const history = loadOptionalHistory();
  const ids = {};
  Object.keys(history).forEach(function(bucketKey) {
    (history[bucketKey] || []).forEach(function(entry) {
      if (entry && entry.exId) ids[entry.exId] = true;
    });
  });
  return Object.keys(ids);
}

function finalizeProgram(goalKey, subgoalKey) {

  const program = getProgram(state.selectedLength, goalKey, subgoalKey);
  const isNewCycleTransition = state.cycle > 1 && state.activePlan;
  state.goal = goalKey;

function getEntry(dayKey, exId, week, cycle) {
  const c = cycle !== undefined ? cycle : state.viewingCycle;
  const k = dayKey + '::' + exId + '::c' + c + '::w' + week;
  return state.weights[k] || null;
}
function setEntry(dayKey, exId, week, field, val) {
  const k = dayKey + '::' + exId + '::c' + state.viewingCycle + '::w' + week;
  if (!state.weights[k]) state.weights[k] = {};
  state.weights[k][field] = val;
  saveState();
}
function clearEntry(dayKey, exId, week) {
  const k = dayKey + '::' + exId + '::c' + state.viewingCycle + '::w' + week;
  delete state.weights[k];
  saveState();
}
function getPrevEntry(dayKey, exId, week) {
  for (let w = week - 1; w >= 1; w--) {
    const e = getEntry(dayKey, exId, w);
    if (e && (e.weight || e.done)) return { week: w, entry: e };
  }
  if (state.viewingCycle > 1) {
    for (let c = state.viewingCycle - 1; c >= 1; c--) {
      for (let w = 8; w >= 1; w--) {
        const e = getEntry(dayKey, exId, w, c);
        if (e && (e.weight || e.done)) return { week: w, entry: e, cycle: c };
      }
    }
  }
  return null;
}

/* =========================================================
   FINAL CORRECTION (History bug fix, Batch 1):
   Root cause of the "stale historical weight" bug: this function
   previously picked the "most recent" cross-day entry by comparing
   week-number, with an alphabetical dayKey string as the tiebreak
   (`w > best.week || (w === best.week && dayKey > best.dayKey)`).
   That is a POSITION comparison, not a chronological one - it could
   let an older week's logged entry outrank a genuinely more recent
   date, and the dayKey tiebreak carries no real-world meaning at all.

   Fix: every entry already stores its own entry.date (an ISO
   yyyy-mm-dd string, set at the moment it was logged - see setEntry).
   ISO date strings sort correctly with plain string comparison, so
   this now compares actual logged dates directly. Only when BOTH
   candidates lack a stored date (legacy entries from before dates
   were tracked) does it fall back to the original week/dayKey
   ordering, so old data is never treated as broken.

   This does NOT touch the fillable "This week" input anywhere - it
   only changes which historical entry is treated as "most recent"
   for reference/suggestion display, per the requested fix.
   ========================================================= */
function getLastKnownWeightAnyDay(exId, excludeDayKey, week, cycle) {
  const c = cycle !== undefined ? cycle : state.viewingCycle;
  let best = null;
  Object.keys(state.activePlan).forEach(function(dayKey) {
    const day = state.activePlan[dayKey];
    if (day.rest && exId !== '__steps__') return;
    if (exId !== '__steps__' && (!day.exerciseIds || day.exerciseIds.indexOf(exId) === -1)) return;
    for (let w = week; w >= 1; w--) {
      if (dayKey === excludeDayKey && w === week) continue;
      const e = getEntry(dayKey, exId, w, c);
      if (e && e.weight) {
        const candidate = { week: w, entry: e, dayKey: dayKey };
        if (!best) { best = candidate; continue; }
        if (candidate.entry.date && best.entry.date) {
          if (candidate.entry.date > best.entry.date) best = candidate;
        } else if (!candidate.entry.date && !best.entry.date) {
          if (w > best.week || (w === best.week && dayKey > best.dayKey)) best = candidate;
        } else if (candidate.entry.date && !best.entry.date) {
          best = candidate;
        }
      }
    }
  });
  return best;
}

/* =========================================================
   NEW (Batch 1): recognizes the most recent historical weight
   for an exercise when starting/switching to a NEW program, even
   though the old dayKey that logged it no longer exists in the
   current state.activePlan (getLastKnownWeightAnyDay above only
   searches dayKeys present in the CURRENT plan by design, so it
   cannot see history from a since-replaced program on its own).

   This scans every stored weight entry for the given exId across
   ALL dayKeys/cycles/weeks ever logged, using the same date-based
   recency rule as above. It is strictly read-only: it does not
   copy, duplicate, or alter any historical record, and it never
   touches the fillable "This week" field - the user still enters
   today's weight manually, same as always.
   ========================================================= */
function getMostRecentHistoricalWeightAcrossPrograms(exId) {
  let best = null;
  Object.keys(state.weights).forEach(function(key) {
    const parts = key.split('::');
    if (parts.length !== 4) return;
    const keyExId = parts[1];
    if (keyExId !== exId) return;
    const e = state.weights[key];
    if (!e || !e.weight) return;
    const cycle = parseInt(parts[2].replace('c', ''), 10);
    const week = parseInt(parts[3].replace('w', ''), 10);
    const candidate = { dayKey: parts[0], cycle: cycle, week: week, entry: e };
    if (!best) { best = candidate; return; }
    if (candidate.entry.date && best.entry.date) {
      if (candidate.entry.date > best.entry.date) best = candidate;
    } else if (!candidate.entry.date && !best.entry.date) {
      if (cycle > best.cycle || (cycle === best.cycle && week > best.week)) best = candidate;
    } else if (candidate.entry.date && !best.entry.date) {
      best = candidate;
    }
  });
  return best;
}

let entriesCacheVersion = -1;
let entriesCacheByExercise = {};

function getAllEntriesForExercise(exId) {
  if (entriesCacheVersion === stateVersion && entriesCacheByExercise[exId]) {
    return entriesCacheByExercise[exId];
  }
  if (entriesCacheVersion !== stateVersion) {
    entriesCacheByExercise = {};
    entriesCacheVersion = stateVersion;
  }
  const results = [];
  Object.keys(state.activePlan).forEach(function(dayKey) {
    for (let c = 1; c <= state.cycle; c++) {
      for (let w = 1; w <= (state.programLength || 8); w++) {
        const e = getEntry(dayKey, exId, w, c);
        if (e && e.weight) results.push({ week: w, cycle: c, dayKey: dayKey, weight: parseFloat(e.weight), date: e.date });
      }
    }
  });
  entriesCacheByExercise[exId] = results;
  return results;
}

function proteinDayKey(dayKey, cycle, week) {
  return dayKey + '::c' + cycle + '::w' + week;
}

function getProteinEntries(dayKey, cycle, week) {
  const c = cycle !== undefined ? cycle : state.viewingCycle;
  const w = week !== undefined ? week : state.week;
  const key = proteinDayKey(dayKey, c, w);
  return state.proteinEntries[key] || [];
}

function addProteinEntry(dayKey, name, grams) {
  const key = proteinDayKey(dayKey, state.viewingCycle, state.week);
  if (!state.proteinEntries[key]) state.proteinEntries[key] = [];
  state.proteinEntries[key].push({ name: name, grams: grams, time: todayStr() });

}

function removeProteinEntry(dayKey, index) {

  if (state.proteinEntries[key]) {
    state.proteinEntries[key].splice(index, 1);
    saveState();
  }
}

function getDailyProteinTotal(dayKey, cycle, week) {
  const entries = getProteinEntries(dayKey, cycle, week);
  let total = 0;
  entries.forEach(function(e) { total += (parseFloat(e.grams) || 0); });
  return total;
}

function getAllProteinTotals() {
  const results = [];
  Object.keys(state.activePlan).forEach(function(dayKey) {
    for (let c = 1; c <= state.cycle; c++) {
      for (let w = 1; w <= (state.programLength || 8); w++) {
        const total = getDailyProteinTotal(dayKey, c, w);
        if (total > 0) results.push({ week: w, cycle: c, dayKey: dayKey, total: total });
      }
    }
  });
  return results;
}

function isDayComplete(dayKey, week) {
  const day = getEffectiveDay(dayKey, undefined, week);
  if (!day) return false;
  if (day.rest) {
    const e = getEntry(dayKey, '__rest_' + dayKey + '__', week);
    const restDone = !!(e && e.done);
    if (day.stepsGoal) {
      const stepsE = getEntry(dayKey, '__steps__', week);
      return restDone && !!(stepsE && stepsE.weight);
    }
    return restDone;
  }
  const mob = getEntry(dayKey, '__mobility_' + dayKey + '__', week);
  if (!mob || !mob.done) return false;
  const cardio = getEntry(dayKey, '__cardio_' + dayKey + '__', week);
  if (!cardio || !cardio.done) return false;
  let exerciseIdsForCompletion = day.exerciseIds;
  const isTodayOccurrence = (week === state.week) && (state.viewingCycle === state.cycle);
  if (isTodayOccurrence) {
    const choice = getTodaysAdaptChoice(dayKey);
    if (choice && ADAPT_TIME_BUDGETS[choice] && day.exerciseIds && day.exerciseIds.length > 0) {
      const adaptResult = adaptWorkoutToTime(day, ADAPT_TIME_BUDGETS[choice]);
      exerciseIdsForCompletion = adaptResult.includedIds;
    }
  }
  if (!exerciseIdsForCompletion || exerciseIdsForCompletion.length === 0) return true;
  for (let i = 0; i < exerciseIdsForCompletion.length; i++) {
    const exId = exerciseIdsForCompletion[i];
    const ex = exerciseLibrary[exId];
    const e = getEntry(dayKey, exId, week);
    if (ex.noWeight) { if (!e || !e.done) return false; }
    else { if (!e || !e.weight) return false; }
  }
  if (day.finisherId) {
    const fin = getEntry(dayKey, '__finisher_' + dayKey + '__', week);
    if (!fin || !fin.done) return false;
  }
  return true;
}

function isWeekComplete(week) {
  const keys = Object.keys(state.activePlan);
  for (let i = 0; i < keys.length; i++) { if (!isDayComplete(keys[i], week)) return false; }
  return true;
}

/* =========================================================
   BATCH 2: Global Swap Exercise Audit and Rebuild
   Three confirmed root causes fixed here:
   1. Muscle-group-only matching let isolation moves (lateral raises,
      rear delt work) get offered as "equivalent" to compound presses
      that share the same muscle tag but not the same movement pattern
      or training purpose.
   2. Some muscle groups (biceps, shoulders-vertical-press) had too few
      real exercises in the library to ever produce a meaningful
      alternative - fixed by adding real new exercises below, not by
      loosening the matching logic to accept poor substitutes.
   3. openSwapModal read exerciseLibrary[currentExId].muscle with no
      guard, so a stale/missing exercise id threw and silently did
      nothing when tapped - fixed with a defensive check.

   This entire system is goal-agnostic and day-agnostic: it works the
   same way for Get Stronger, Build Muscle, Lose Fat, Improve Fitness,
   Glute & Strength, Strengthen Core, and General Fitness. Yoga is
   untouched, since yoga exercises are never run through this function
   (they use muscle: 'yoga', which carries no movementPattern tag and
   is excluded from the pattern map entirely on purpose).
   ========================================================= */

/**
 * New exercises added specifically to close real substitution gaps found
 * during the audit - not filler, each is a genuinely distinct, valid gym
 * exercise for its movement pattern. Merged at runtime exactly like the
 * Version 1.1 exercises, never touching programData.json.
 */
const batch2NewExercises = {
  barbell_curl: { name: 'Barbell curl', muscle: 'biceps', scheme: '3 x 10', link: YT('barbell curl proper form'), movementPattern: 'curl' },
  ez_bar_curl: { name: 'EZ-bar curl', muscle: 'biceps', scheme: '3 x 10', link: YT('ez bar curl proper form'), movementPattern: 'curl' },
  seated_barbell_press: { name: 'Seated barbell shoulder press', muscle: 'shoulders', scheme: '3 x 10', link: YT('seated barbell shoulder press proper form'), movementPattern: 'vertical_press' },
  arnold_press: { name: 'Arnold press', muscle: 'shoulders', scheme: '3 x 10', link: YT('arnold press proper form'), movementPattern: 'vertical_press' }
};

/**
 * Movement pattern classification for every exercise in the library. This is
 * the missing layer that muscle-group matching alone can't provide: two
 * exercises can share a muscle tag (e.g. "shoulders") while being completely
 * different training movements (a compound vertical press vs. an isolation
 * lateral raise). Alternatives are found by pattern first, muscle group
 * second - never the reverse - so a compound lift is never replaced with an
 * isolation move just because they happen to hit the same muscle.
 * Cardio and yoga exercises intentionally have no pattern entry; they are
 * never swap targets or swap candidates through this system.
 */
const movementPatternMap = {
  chest_press_machine: 'horizontal_press', incline_db_press: 'horizontal_press', flat_db_press: 'horizontal_press',
  pushup: 'horizontal_press', cable_chest_press: 'horizontal_press',
  shoulder_press_machine: 'vertical_press', db_shoulder_press: 'vertical_press',
  seated_barbell_press: 'vertical_press', arnold_press: 'vertical_press',
  cable_lateral_raise: 'lateral_raise', db_lateral_raise: 'lateral_raise',
  rear_delt_pec_deck: 'rear_delt', face_pull: 'rear_delt',
  triceps_pushdown: 'triceps_isolation', triceps_kickback: 'triceps_isolation', overhead_triceps_ext: 'triceps_isolation',
  lat_pulldown: 'vertical_pull', straight_arm_pulldown: 'vertical_pull',
  chest_supported_row: 'horizontal_pull', seated_cable_row: 'horizontal_pull',
  hammer_curl: 'curl', cable_curl: 'curl', db_curl: 'curl', barbell_curl: 'curl', ez_bar_curl: 'curl',
  smith_rdl: 'hip_hinge', smith_hip_thrust: 'hip_hinge',
  leg_press: 'squat_pattern', bodyweight_squat: 'squat_pattern', goblet_squat: 'squat_pattern',
  walking_lunge: 'lunge_pattern',
  seated_leg_curl: 'leg_curl_isolation',
  leg_extension: 'leg_extension_isolation',
  calf_raise_machine: 'calf_raise', bodyweight_calf_raise: 'calf_raise',
  hip_abductor: 'hip_isolation', hip_adductor: 'hip_isolation',
  plank: 'core_stability',
  cable_woodchop: 'core_rotation', torso_rotation: 'core_rotation',
  ab_crunch_machine: 'core_flexion',
  farmer_carry: 'loaded_carry',
  kettlebell_swing: 'hip_hinge'
};

/**
 * Which exercise ids belong to each movement pattern, built once from
 * movementPatternMap plus the merged-in exercise library, so lookups don't
 * re-scan the whole library on every swap.
 */
let movementPatternGroups = {};
function rebuildMovementPatternGroups() {
  movementPatternGroups = {};
  Object.keys(movementPatternMap).forEach(function(exId) {
    if (!exerciseLibrary[exId]) return; // defensive: id might not exist if library changes
    const pattern = movementPatternMap[exId];
    if (!movementPatternGroups[pattern]) movementPatternGroups[pattern] = [];
    movementPatternGroups[pattern].push(exId);
  });
}

/**
 * Returns up to 5 ranked, genuinely appropriate alternatives for exId, given
 * the ids already present in todaysExerciseIds (which are always excluded,
 * along with exId itself). Ranking order, per spec:
 *   1. Same movement pattern (hard requirement - see below)
 *   2. Same primary muscle group, as a tiebreaker among pattern matches
 *   3. Equipment reasonably available (hard filter via equipmentAllowsExercise)
 * If exId has no known movement pattern (e.g. a custom exercise, or a
 * cardio/yoga exercise), falls back to muscle-group matching only, which
 * matches the pre-existing behavior for those cases rather than returning
 * nothing.
 * Returns [] when no legitimate alternative exists - callers must show
 * Remove for Today / Remove for This Program in that case, never pad the
 * list with a poor substitute.
 */
function getSwapAlternatives(exId, dayKey, excludeIds) {
  const ex = exerciseLibrary[exId];
  if (!ex) return [];
  const pattern = movementPatternMap[exId];
  const excludeSet = {};
  (excludeIds || []).forEach(function(id) { excludeSet[id] = true; });
  excludeSet[exId] = true;

  const equipment = (state.onboarding && state.onboarding.answers && state.onboarding.answers.equipment) || null;

  function passesHardFilters(candidateId) {
    if (excludeSet[candidateId]) return false;
    if (equipment && !equipmentAllowsExercise(candidateId, equipment)) return false;
    return true;
  }

  let candidates = [];
  if (pattern && movementPatternGroups[pattern]) {
    candidates = movementPatternGroups[pattern].filter(passesHardFilters);
  }
  if (candidates.length === 0) {
    // Fallback for exercises with no known movement pattern (custom exercises,
    // or any built-in exercise not yet classified): same muscle group only,
    // matching the original pre-Batch-2 behavior so nothing regresses.
    candidates = (substituteGroups[ex.muscle] || []).filter(passesHardFilters);
  }

  // Rank: exact muscle match first (within the same pattern group, this mostly
  // ties, but matters for the muscle-group fallback path and mixed cases).
  candidates.sort(function(a, b) {
    const aMuscleMatch = exerciseLibrary[a] && exerciseLibrary[a].muscle === ex.muscle ? 1 : 0;
    const bMuscleMatch = exerciseLibrary[b] && exerciseLibrary[b].muscle === ex.muscle ? 1 : 0;
    return bMuscleMatch - aMuscleMatch;
  });

  return candidates.slice(0, 5);
}

/**
 * "Remove for Today": removes exId from today's occurrence of dayKey only.
 * Implemented as a weekly override (the same mechanism already used by day
 * swaps), so future weeks and the program template are completely untouched,
 * no history is deleted, and the exercise remains fully intact in the global
 * library and in every other week/cycle.
 */
function removeExerciseForToday(dayKey, exIndex) {
  const baseDay = getEffectiveDay(dayKey);
  const newExerciseIds = baseDay.exerciseIds.filter(function(id, idx) { return idx !== exIndex; });
  const newDayContent = Object.assign({}, baseDay, { exerciseIds: newExerciseIds });
  const ovKey = weekOverrideKey(state.viewingCycle, state.week);
  if (!state.weeklyOverrides) state.weeklyOverrides = {};
  if (!state.weeklyOverrides[ovKey]) state.weeklyOverrides[ovKey] = {};
  state.weeklyOverrides[ovKey][dayKey] = newDayContent;
  saveState();
  render();
  toast('Removed for today only');
}

/**
 * "Remove for This Program": removes exId from state.activePlan[dayKey] itself,
 * so it no longer appears in any future, unstarted week of the current
 * program. This does NOT touch state.weeklyOverrides for past weeks (so a
 * week that already has a weekly override showing this exercise keeps showing
 * it, since that override was already a snapshot of a specific week), does
 * NOT rewrite completed workouts (those are read from getEntry/state.weights,
 * entirely separate from the plan template), and does NOT touch history,
 * other cycles, other programs, custom exercises, or Yoga.
 */
function removeExerciseForProgram(dayKey, exIndex) {
  const newExerciseIds = state.activePlan[dayKey].exerciseIds.filter(function(id, idx) { return idx !== exIndex; });
  state.activePlan[dayKey] = Object.assign({}, state.activePlan[dayKey], { exerciseIds: newExerciseIds });
  saveState();
  render();
  toast('Removed for the rest of this program');
}

function splitDayLabel(label) {
  const dayPrefixes = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  for (let i = 0; i < dayPrefixes.length; i++) {
    const prefix = dayPrefixes[i];
    if (label.indexOf(prefix + ' ') === 0) {
      return { dayPart: prefix, typePart: label.substring(prefix.length + 1) };
    }
  }
  return { dayPart: '', typePart: label };
}

function swapWeekDataBetweenDays(sourceDayKey, otherDayKey, cycle, week) {
  const suffix = '::c' + cycle + '::w' + week;
  function remapExId(exId, fromDay, toDay) {
    return exId.split(fromDay).join(toDay);
  }
  const toMove = [];
  Object.keys(state.weights).forEach(function(k) {
    if (k.indexOf(suffix) !== k.length - suffix.length) return;
    const parts = k.split('::');
    const dayKey = parts[0];
    if (dayKey === sourceDayKey) {
      const newExId = remapExId(parts[1], sourceDayKey, otherDayKey);
      toMove.push({ oldKey: k, newKey: [otherDayKey, newExId, parts[2], parts[3]].join('::') });
    } else if (dayKey === otherDayKey) {
      const newExId = remapExId(parts[1], otherDayKey, sourceDayKey);
      toMove.push({ oldKey: k, newKey: [sourceDayKey, newExId, parts[2], parts[3]].join('::') });
    }
  });
  const savedValues = toMove.map(function(m) { return state.weights[m.oldKey]; });
  toMove.forEach(function(m) { delete state.weights[m.oldKey]; });
  toMove.forEach(function(m, i) { state.weights[m.newKey] = savedValues[i]; });

  const proteinSuffix = '::c' + cycle + '::w' + week;
  const proteinToMove = [];
  Object.keys(state.proteinEntries).forEach(function(k) {
    if (k.indexOf(proteinSuffix) !== k.length - proteinSuffix.length) return;
    const dayKey = k.split('::')[0];
    if (dayKey === sourceDayKey) proteinToMove.push({ oldKey: k, newKey: otherDayKey + proteinSuffix });
    else if (dayKey === otherDayKey) proteinToMove.push({ oldKey: k, newKey: sourceDayKey + proteinSuffix });
  });
  const savedProtein = proteinToMove.map(function(m) { return state.proteinEntries[m.oldKey]; });
  proteinToMove.forEach(function(m) { delete state.proteinEntries[m.oldKey]; });
  proteinToMove.forEach(function(m, i) { state.proteinEntries[m.newKey] = savedProtein[i]; });
}

function applyDaySwapThisWeekOnly(sourceDayKey, otherKey) {
  const dayKeyToName = { sun: 'Sun', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat' };
  const sourceOwnDayName = dayKeyToName[sourceDayKey];
  const otherOwnDayName = dayKeyToName[otherKey];
  const sourceCurrent = getEffectiveDay(sourceDayKey);
  const otherCurrent = getEffectiveDay(otherKey);
  const sourceType = splitDayLabel(sourceCurrent.label).typePart;
  const otherType = splitDayLabel(otherCurrent.label).typePart;

  const newSourceContent = Object.assign({}, otherCurrent);
  newSourceContent.label = sourceOwnDayName + ' ' + otherType;
  const newOtherContent = Object.assign({}, sourceCurrent);
  newOtherContent.label = otherOwnDayName + ' ' + sourceType;

  const ovKey = weekOverrideKey(state.viewingCycle, state.week);
  if (!state.weeklyOverrides) state.weeklyOverrides = {};
  if (!state.weeklyOverrides[ovKey]) state.weeklyOverrides[ovKey] = {};
  state.weeklyOverrides[ovKey][sourceDayKey] = newSourceContent;
  state.weeklyOverrides[ovKey][otherKey] = newOtherContent;

  swapWeekDataBetweenDays(sourceDayKey, otherKey, state.viewingCycle, state.week);

  state.day = sourceDayKey;
  saveState();
  render();
  toast('Swapped for this week only');
}

function applyDaySwapAllFutureWeeks(sourceDayKey, otherKey) {
  const dayKeyToName = { sun: 'Sun', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat' };
  const sourceOwnDayName = dayKeyToName[sourceDayKey];
  const otherOwnDayName = dayKeyToName[otherKey];
  const sourceOldContent = Object.assign({}, state.activePlan[sourceDayKey]);
  const otherOldContent = Object.assign({}, state.activePlan[otherKey]);
  const sourceOldType = splitDayLabel(sourceOldContent.label).typePart;
  const otherOldType = splitDayLabel(otherOldContent.label).typePart;
  const newSourceContent = Object.assign({}, otherOldContent);
  newSourceContent.label = sourceOwnDayName + ' ' + otherOldType;
  const newOtherContent = Object.assign({}, sourceOldContent);
  newOtherContent.label = otherOwnDayName + ' ' + sourceOldType;
  state.activePlan[sourceDayKey] = newSourceContent;
  state.activePlan[otherKey] = newOtherContent;

  swapWeekDataBetweenDays(sourceDayKey, otherKey, state.viewingCycle, state.week);

  state.day = sourceDayKey;
  saveState();
  render();
  toast('Workouts swapped going forward');
}
