  .tab-check { color: #4caf50; font-weight: 900; margin-left: 4px; }

  .progress-ex-card .no-data { font-size: 12px; color: #aaa; padding: 10px 0; text-align: center; }
  svg.chart { width: 100%; height: auto; display: block; }
  .chart-stats { display: flex; gap: 16px; margin-top: 8px; font-size: 11px; color: #888; }

  .goal-screen p { font-size: 14px; color: #777; margin-bottom: 24px; }

<body>

<div id="app"></div>
<div class="save-toast" id="toast">Saved</div>

<script>
const YT = (q) => `https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`;

let exerciseLibrary = {};
let programLibrary = {};

const substituteGroups = {};

const mobility = {
  items: [
    '10 bodyweight squats',
    '10 arm circles forward/backward',
    '10 band pull-aparts (or light cable rear delt pulls)',
    '10 cat-cow stretches',
    '30-second hamstring stretch'
  ]
};

const goalTemplates = {
  glute_and_strength: {
    label: 'Glute & Strength Focus',
    desc: 'Lower body A/B split with upper body and full body days, priority on hip thrust progression',
    subgoals: null
  },
  yoga: {
    label: 'Yoga',
    desc: 'A calming, flexibility-focused flow with guided how-to videos for every pose',
    subgoals: null
  },
  get_stronger: {
    label: 'Get Stronger',
    desc: 'Push/Pull/Legs split focused on building strength across major lifts',
    subgoals: ['total_body', 'arms', 'legs', 'core', 'sustain'],
    subgoalLabels: { total_body: 'Total Body', arms: 'Arms', legs: 'Legs', core: 'Core', sustain: 'Sustain What You Have' }
  },
  strengthen_core: {
    label: 'Strengthen Core',
    desc: 'Full-body training with extra core volume each session',
    subgoals: null
  },
  general_fitness: {
    label: 'General Fitness',
    desc: 'Well-rounded, sustainable training',
    subgoals: ['well_rounded', 'moderate_volume', 'sustain'],
    subgoalLabels: { well_rounded: 'Well-Rounded Full Body', moderate_volume: 'Moderate Volume', sustain: 'Sustain What You Have' }
  }
};

function buildPlanKey(length, goal, subgoal) {
  let key = length + '_' + goal;
  if (subgoal) key += '_' + subgoal;
  return key;
}
function isProgramAvailable(length, goal, subgoal) {
  return !!programLibrary[buildPlanKey(length, goal, subgoal)];
}
function getProgram(length, goal, subgoal) {
  return programLibrary[buildPlanKey(length, goal, subgoal)];
}

const DAY_ORDER = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

function getOrderedDayKeys() {
  const keys = Object.keys(state.activePlan);
  return DAY_ORDER.filter(function(d) { return keys.indexOf(d) !== -1; });
}

function weekOverrideKey(cycle, week) {
  return 'c' + cycle + '-w' + week;
}

function getEffectiveDay(dayKey, cycle, week) {
  const c = cycle !== undefined ? cycle : state.viewingCycle;
  const w = week !== undefined ? week : state.week;
  const ovKey = weekOverrideKey(c, w);
  if (state.weeklyOverrides && state.weeklyOverrides[ovKey] && state.weeklyOverrides[ovKey][dayKey]) {
    return state.weeklyOverrides[ovKey][dayKey];
  }
  return state.activePlan[dayKey];
}

let state = {
  screen: 'select_goal',
  disclaimerAccepted: false,
  disclaimerAcceptedDate: null,
  selectedLength: null,
  selectedGoal: null,
  selectedSubgoal: null,
  goal: null,
  activePlan: null,
  programLength: null,
  week: 1,
  cycle: 1,
  viewingCycle: 1,
  day: 'mon',
  weights: {},
  checkpoints: { start: {}, week4: {}, week8: {} },
  archivedCheckpoints: [],
  goalHistory: [],
  migratedToPerDay: false,
  shownDayTip: false,
  shownWeekTip: false,
  celebratedDays: [],
  celebratedWeeks: [],
  celebratedCycles: [],
  checkinAcks: [],
  proteinGoal: null,
  proteinPromptShown: false,
  proteinEntries: {},
  cycleStartDate: null,
  autoBackupHistory: [],
  tutorialShown: false,
  onboarding: null,
  programRecoveryPref: null,
  programPriority: null,
  weeklyOverrides: {}
};

const onboardingSteps = [
  {
    key: 'secondaryFocus',
    title: 'Any secondary focus areas?',
    sub: 'Choose up to two. These enhance your primary goal without replacing it.',
    multi: true,
    max: 2,
    options: [
      { value: 'bigger_arms', label: 'Bigger Arms' },
      { value: 'bigger_chest', label: 'Bigger Chest' },
      { value: 'bigger_shoulders', label: 'Bigger Shoulders' },
      { value: 'stronger_legs', label: 'Stronger Legs' },
      { value: 'stronger_core', label: 'Stronger Core' },
      { value: 'better_posture', label: 'Better Posture' },
      { value: 'shoulder_health', label: 'Improve Shoulder Health' },
      { value: 'grip_strength', label: 'Increase Grip Strength' },
      { value: 'mobility', label: 'Improve Mobility' },
      { value: 'cardio_endurance', label: 'Better Cardiovascular Endurance' }
    ]
  },
  {
    key: 'experience',
    title: 'What is your experience level?',
    sub: null,
    multi: false,
    max: 1,
    options: [
      { value: 'beginner', label: 'Beginner' },
      { value: 'intermediate', label: 'Intermediate' },
      { value: 'advanced', label: 'Advanced' }
    ]
  },
  {
    key: 'frequency',
    title: 'How many days per week can you work out?',
    sub: null,
    multi: false,
    max: 1,
    options: [
      { value: 2, label: '2 Days' },
      { value: 3, label: '3 Days' },
      { value: 4, label: '4 Days' },
      { value: 5, label: '5 Days' },
      { value: 6, label: '6 Days' }
    ]
  },
  {
    key: 'duration',
    title: 'How long should each workout be?',
    sub: 'This is a real time budget. It changes how many exercises fit in your session.',
    multi: false,
    max: 1,
    options: [
      { value: 30, label: '30 Minutes' },
      { value: 45, label: '45 Minutes' },
      { value: 60, label: '60 Minutes' },
      { value: 75, label: '75+ Minutes' }
    ]
  },
  {
    key: 'equipment',
    title: 'What equipment do you have access to?',
    sub: null,
    multi: false,
    max: 1,
    options: [
      { value: 'planet_fitness', label: 'Planet Fitness' },
      { value: 'full_gym', label: 'Full Commercial Gym' },
      { value: 'home_gym', label: 'Home Gym' },
      { value: 'dumbbells_only', label: 'Dumbbells Only' },
      { value: 'bodyweight_only', label: 'Bodyweight Only' }
    ]
  },
  {
    key: 'avoidExercises',
    title: 'Any exercises you want to avoid?',
    sub: 'Choose any that apply. We will substitute similar exercises whenever possible.',
    multi: true,
    max: 99,
    options: [
      { value: 'deadlifts', label: 'Deadlifts' },
      { value: 'squats', label: 'Squats' },
      { value: 'bench_press', label: 'Bench Press' },
      { value: 'pull_ups', label: 'Pull-Ups' },
      { value: 'overhead_press', label: 'Overhead Press' },
      { value: 'running', label: 'Running' }
    ]
  },
  {
    key: 'programLength',
    title: 'How many weeks should this program run?',
    sub: null,
    multi: false,
    max: 1,
    options: [
      { value: 4, label: '4 Weeks' },
      { value: 8, label: '8 Weeks' },
      { value: 12, label: '12 Weeks' }
    ]
  },
  {
    key: 'recovery',
    title: 'What is your recovery preference?',
    sub: 'This influences weekly volume and how fast you progress.',
    multi: false,
    max: 1,
    options: [
      { value: 'joint_friendly', label: 'Joint-Friendly' },
      { value: 'standard', label: 'Standard Recovery (Recommended)' },
      { value: 'aggressive', label: 'Aggressive Progression' }
    ]
  },
  {
    key: 'split',
    title: 'Do you have a preferred workout split?',
    sub: 'If your choice does not fit your selected frequency, we will recommend the closest fit and explain why.',
    multi: false,
    max: 1,
    options: [
      { value: 'no_preference', label: 'No Preference (Recommended)' },
      { value: 'full_body', label: 'Full Body' },
      { value: 'upper_lower', label: 'Upper / Lower' },
      { value: 'ppl', label: 'Push / Pull / Legs' }
    ]
  },
  {
    key: 'priority',
    title: 'What matters most to you in this program?',
    sub: null,
    multi: false,
    max: 1,
    options: [
      { value: 'fastest_results', label: 'Fastest Results' },
      { value: 'balanced', label: 'Balanced (Recommended)' },
      { value: 'best_recovery', label: 'Best Recovery' },
      { value: 'injury_prevention', label: 'Injury Prevention' },
      { value: 'enjoyable', label: 'Enjoyable Workouts' }
    ]
  }
];

function startGuidedOnboarding(goalKey, subgoalKey) {
  state.onboarding = { stepIndex: 0, answers: {}, goalKey: goalKey, subgoalKey: subgoalKey || null };
  state.screen = 'onboarding';
  saveState();
  render();
}

function onboardingSelectSingle(stepKey, value) {
  state.onboarding.answers[stepKey] = value;
  saveState();
}

function onboardingToggleMulti(stepKey, value, max) {
  const current = state.onboarding.answers[stepKey] || [];
  const idx = current.indexOf(value);
  if (idx !== -1) {
    current.splice(idx, 1);
  } else {
    if (current.length >= max) { toast('You can choose up to ' + max); return; }
    current.push(value);
  }
  state.onboarding.answers[stepKey] = current;
  saveState();
  render();
}

function onboardingNext() {
  const step = onboardingSteps[state.onboarding.stepIndex];
  const answer = state.onboarding.answers[step.key];
  const hasAnswer = step.multi ? (answer && answer.length > 0) : (answer !== undefined && answer !== null);
  if (!hasAnswer && step.key !== 'secondaryFocus' && step.key !== 'avoidExercises') {
    toast('Please make a selection to continue');
    return;
  }
  if (state.onboarding.stepIndex < onboardingSteps.length - 1) {
    state.onboarding.stepIndex += 1;
    saveState();
    render();
  } else {
    state.screen = 'onboarding_summary';
    saveState();
    render();
  }
}

function onboardingBack() {
  if (state.onboarding.stepIndex > 0) {
    state.onboarding.stepIndex -= 1;
    saveState();
    render();
  } else {
    const goalKey = state.onboarding.goalKey;
    state.onboarding = null;
    if (goalKey && goalTemplates[goalKey] && goalTemplates[goalKey].subgoals) {
      state.screen = 'select_subgoal';
    } else {
      state.screen = 'select_goal';
    }
    saveState();
    render();
  }
}

function resolveEffectiveSplit(frequency, splitPref) {
  if (splitPref !== 'no_preference') {
    if (splitPref === 'upper_lower' && frequency < 2) return { split: 'full_body', note: 'Upper/Lower needs at least 2 days, so we used Full Body instead.' };
    if (splitPref === 'ppl' && frequency < 3) return { split: 'upper_lower', note: 'Push/Pull/Legs needs at least 3 days, so we used Upper/Lower instead.' };
    return { split: splitPref, note: null };
  }
  if (frequency <= 3) return { split: 'full_body', note: null };
  if (frequency <= 5) return { split: 'upper_lower', note: null };
  return { split: 'ppl', note: null };
}

const optionLabelLookups = {};
onboardingSteps.forEach(function(step) {
  const map = {};
  step.options.forEach(function(opt) { map[opt.value] = opt.label; });
  optionLabelLookups[step.key] = map;
});

function renderOnboardingStep(container) {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const step = onboardingSteps[state.onboarding.stepIndex];
  const wrap = document.createElement('div');
  wrap.className = 'goal-screen';
  wrap.style.textAlign = 'left';

  const progress = document.createElement('div');
  progress.style.cssText = 'display:flex;gap:4px;margin-bottom:18px;';
  onboardingSteps.forEach(function(s, i) {
    const dot = document.createElement('div');
    dot.style.cssText = 'flex:1;height:4px;border-radius:2px;background:' + (i <= state.onboarding.stepIndex ? '#e8722c' : '#e6e4dc') + ';';
    progress.appendChild(dot);
  });
  wrap.appendChild(progress);

  const stepCount = document.createElement('div');
  stepCount.style.cssText = 'font-size:12px;color:#999;font-weight:600;margin-bottom:6px;';
  stepCount.textContent = 'Step ' + (state.onboarding.stepIndex + 1) + ' of ' + onboardingSteps.length;
  wrap.appendChild(stepCount);

  const h = document.createElement('h2');
  h.style.cssText = 'text-align:left;font-size:19px;';
  h.textContent = step.title;
  wrap.appendChild(h);

  if (step.sub) {
    const sub = document.createElement('p');
    sub.style.cssText = 'text-align:left;';
    sub.textContent = step.sub;
    wrap.appendChild(sub);
  }

  const currentAnswer = state.onboarding.answers[step.key];
  step.options.forEach(function(opt) {
    const btn = document.createElement('button');
    btn.className = 'goal-btn';
    const isSelected = step.multi ? (currentAnswer && currentAnswer.indexOf(opt.value) !== -1) : (currentAnswer === opt.value);
    if (isSelected) { btn.style.cssText = 'border-color:#e8722c;background:#fdf0e6;'; }
    btn.textContent = opt.label + (isSelected ? '  \u2713' : '');
    btn.onclick = function() {
      if (step.multi) {
        onboardingToggleMulti(step.key, opt.value, step.max);
      } else {
        onboardingSelectSingle(step.key, opt.value);
        render();
      }
    };
    wrap.appendChild(btn);
  });

  const navRow = document.createElement('div');
  navRow.style.cssText = 'display:flex;gap:8px;margin-top:16px;';
  const backBtn = document.createElement('button');
  backBtn.className = 'modal-close';
  backBtn.style.cssText = 'flex:1;margin-top:0;';
  backBtn.textContent = 'Back';
  backBtn.onclick = onboardingBack;
  navRow.appendChild(backBtn);
  const nextBtn = document.createElement('button');
  nextBtn.style.cssText = 'flex:2;padding:12px;background:#1c1c1a;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;';
  nextBtn.textContent = (state.onboarding.stepIndex === onboardingSteps.length - 1) ? 'Review My Answers' : 'Next';
  nextBtn.onclick = onboardingNext;
  navRow.appendChild(nextBtn);
  wrap.appendChild(navRow);

  app.appendChild(wrap);
}

function exercisesPerDayForDuration(duration) {
  const workMinutes = duration - 10;
  const perExercise = 7;
  const count = Math.max(2, Math.round(workMinutes / perExercise));
  return Math.min(count, 8);
}

function equipmentAllowsExercise(exId, equipment) {
  const ex = exerciseLibrary[exId];
  if (!ex) return false;
  const machineExercises = ['chest_press_machine', 'shoulder_press_machine', 'leg_press', 'lat_pulldown', 'chest_supported_row', 'seated_cable_row', 'cable_lateral_raise', 'cable_curl', 'triceps_pushdown', 'leg_extension', 'seated_leg_curl', 'calf_raise_machine', 'smith_rdl', 'smith_hip_thrust', 'hip_abductor', 'hip_adductor', 'rear_delt_pec_deck', 'torso_rotation', 'ab_crunch_machine', 'cable_woodchop', 'cable_chest_press', 'face_pull', 'straight_arm_pulldown'];
  const dumbbellExercises = ['incline_db_press', 'flat_db_press', 'db_shoulder_press', 'db_lateral_raise', 'hammer_curl', 'db_curl', 'goblet_squat', 'triceps_kickback', 'overhead_triceps_ext'];
  if (equipment === 'bodyweight_only') {
    return !!ex.noWeight && machineExercises.indexOf(exId) === -1 && dumbbellExercises.indexOf(exId) === -1;
  }
  if (equipment === 'dumbbells_only') {
    return ex.noWeight || dumbbellExercises.indexOf(exId) !== -1;
  }
  if (equipment === 'home_gym') {
    return machineExercises.indexOf(exId) === -1;
  }
  return true;
}

function getMusclePoolForTemplate(goalKey, subgoalKey) {
  const key = buildPlanKey(8, goalKey, subgoalKey) || buildPlanKey(8, goalKey, null);
  const template = programLibrary[key] || programLibrary[buildPlanKey(4, goalKey, subgoalKey)] || programLibrary[buildPlanKey(12, goalKey, subgoalKey)];
  const muscles = {};
  if (!template) return muscles;
  Object.keys(template.days).forEach(function(dk) {
    const day = template.days[dk];
    if (day.rest || !day.exerciseIds) return;
    day.exerciseIds.forEach(function(exId) {
      const m = exerciseLibrary[exId] ? exerciseLibrary[exId].muscle : null;
      if (!m) return;
      if (!muscles[m]) muscles[m] = [];
      if (muscles[m].indexOf(exId) === -1) muscles[m].push(exId);
    });
  });
  return muscles;
}

function substituteIfAvoided(exId, avoidList, equipment) {
  const nameKeyMap = { deadlifts: 'smith_rdl', squats: 'goblet_squat', bench_press: 'chest_press_machine', pull_ups: 'lat_pulldown', overhead_press: 'shoulder_press_machine', running: 'treadmill' };
  const avoidedIds = (avoidList || []).map(function(a) { return nameKeyMap[a]; }).filter(Boolean);
  if (avoidedIds.indexOf(exId) === -1 && equipmentAllowsExercise(exId, equipment)) return exId;
  const muscle = exerciseLibrary[exId] ? exerciseLibrary[exId].muscle : null;
  if (!muscle) return exId;
  const candidates = (substituteGroups[muscle] || []).filter(function(id) {
    return avoidedIds.indexOf(id) === -1 && equipmentAllowsExercise(id, equipment);
  });
  return candidates.length > 0 ? candidates[0] : exId;
}

function buildGeneratedDay(dayKey, dayLabelType, musclePool, exCount, avoidList, equipment, rotationOffset) {
  const muscleKeys = Object.keys(musclePool);
  const flatList = [];
  muscleKeys.forEach(function(m) { musclePool[m].forEach(function(exId) { flatList.push(exId); }); });
  const uniqueList = flatList.filter(function(v, i) { return flatList.indexOf(v) === i; });
  const rotated = uniqueList.slice(rotationOffset).concat(uniqueList.slice(0, rotationOffset));
  const chosen = [];
  for (let i = 0; i < rotated.length && chosen.length < exCount; i++) {
    const substituted = substituteIfAvoided(rotated[i], avoidList, equipment);
    if (chosen.indexOf(substituted) === -1) chosen.push(substituted);
  }
  const dayNameMap = { sun: 'Sun', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat' };
  return {
    label: dayNameMap[dayKey] + ' ' + dayLabelType,
    warmupId: equipment === 'bodyweight_only' ? 'bodyweight_squat' : 'treadmill',
    exerciseIds: chosen,
    finisherId: 'incline_walk'
  };
}

function assignWorkoutDayKeys(frequency, effectiveSplit) {
  const spreadPatterns = {
    2: ['mon', 'thu'],
    3: ['mon', 'wed', 'fri'],
    4: ['mon', 'tue', 'thu', 'fri'],
    5: ['mon', 'tue', 'wed', 'thu', 'fri'],
    6: ['mon', 'tue', 'wed', 'thu', 'fri', 'sat']
  };
  return spreadPatterns[frequency] || spreadPatterns[3];
}

function dayTypeLabelsForSplit(effectiveSplit, frequency) {
  if (effectiveSplit === 'full_body') {
    const labels = [];
    for (let i = 0; i < frequency; i++) labels.push('Full Body');
    return labels;
  }
  if (effectiveSplit === 'upper_lower') {
    const labels = [];
    for (let i = 0; i < frequency; i++) labels.push(i % 2 === 0 ? 'Upper' : 'Lower');
    return labels;
  }
  const pplCycle = ['Push', 'Pull', 'Legs'];
  const labels = [];
  for (let i = 0; i < frequency; i++) labels.push(pplCycle[i % 3]);
  return labels;
}

function generatePersonalizedProgram() {
  const answers = state.onboarding.answers;
  const goalKey = state.onboarding.goalKey;
  const subgoalKey = state.onboarding.subgoalKey;
  const effective = resolveEffectiveSplit(answers.frequency, answers.split);
  const workoutDayKeys = assignWorkoutDayKeys(answers.frequency, effective.split);
  const dayTypeLabels = dayTypeLabelsForSplit(effective.split, answers.frequency);
  const musclePool = getMusclePoolForTemplate(goalKey, subgoalKey);
  const exCount = exercisesPerDayForDuration(answers.duration);

  const newActivePlan = {};
  DAY_ORDER.forEach(function(dk) {
    const idxInWorkout = workoutDayKeys.indexOf(dk);
    if (idxInWorkout === -1) {
      const dayNameMap = { sun: 'Sun', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat' };
      newActivePlan[dk] = {
        label: dayNameMap[dk] + ' Rest',
        rest: true,
        items: ['Rest', 'Stretch', 'Walk if desired'],
        stepsGoal: '8,000+'
      };
    } else {
      newActivePlan[dk] = buildGeneratedDay(dk, dayTypeLabels[idxInWorkout], musclePool, exCount, answers.avoidExercises, answers.equipment, idxInWorkout);
    }
  });

  state.goal = goalKey;
  state.selectedGoal = goalKey;
  state.selectedSubgoal = subgoalKey;
  state.activePlan = newActivePlan;
  state.programLength = answers.programLength;
  state.programRecoveryPref = answers.recovery;
  state.programPriority = answers.priority;
  state.cycleStartDate = todayStr();
  state.screen = 'day';
  state.week = 1;
  state.day = workoutDayKeys[0] || 'mon';
  saveState();
  showFireworksCelebration('Your personalized program is ready! Time to get started.');
  render();
}

function estimateWorkoutCount(frequency, weeks) {
  return frequency * weeks;
}

function estimateCompletionDate(weeks) {
  const d = new Date();
  d.setDate(d.getDate() + weeks * 7);
  return d.toISOString().split('T')[0];
}

function buildProgramHighlights(answers) {
  const highlights = [];

  highlights.push('Built around ' + goalLabel);
  if (answers.secondaryFocus && answers.secondaryFocus.length > 0) {
    const foci = answers.secondaryFocus.map(function(v) { return optionLabelLookups.secondaryFocus[v]; }).join(' and ');
    highlights.push('Extra attention on ' + foci);
  }
  const effective = resolveEffectiveSplit(answers.frequency, answers.split);
  const splitLabels = { full_body: 'Full Body', upper_lower: 'Upper/Lower', ppl: 'Push/Pull/Legs' };
  highlights.push(splitLabels[effective.split] + ' split, ' + answers.frequency + ' days a week');
  highlights.push(answers.duration + '-minute sessions');
  if (answers.avoidExercises && answers.avoidExercises.length > 0) {
    highlights.push('Avoiding: ' + answers.avoidExercises.map(function(v) { return optionLabelLookups.avoidExercises[v]; }).join(', '));
  }
  return highlights;
}

function todayStr() { return new Date().toISOString().split('T')[0]; }

function formatDateMDY(isoDateStr) {
  if (!isoDateStr) return '';
  const parts = isoDateStr.split('-');
  if (parts.length !== 3) return isoDateStr;
  return parts[1] + '-' + parts[2] + '-' + parts[0];
}

function getTargetDateForWeek(startDateStr, weekNumber) {
  const startDate = new Date(startDateStr + 'T00:00:00');
  const targetDate = new Date(startDate);
  targetDate.setDate(startDate.getDate() + (weekNumber - 1) * 7);
  return targetDate.toISOString().split('T')[0];
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 1400);
}

async function saveState() {
  try {
    localStorage.setItem('workout-state-v3', JSON.stringify(state));
    toast('Saved');
  } catch (e) {
    if (state.autoBackupHistory && state.autoBackupHistory.length > 0) {
      state.autoBackupHistory = [];
      try {
        localStorage.setItem('workout-state-v3', JSON.stringify(state));
        toast('Saved (cleared old snapshots to free space)');
        return;
      } catch (e2) {
        toast('Save failed, try again');
        return;
      }
    }
    toast('Save failed, try again');
  }
}

function migrateToPerDayKeys() {
  if (state.migratedToPerDay) return;
  if (!state.activePlan) return;
  const oldKeyPattern = /^([a-zA-Z0-9_]+)::c(\d+)::w(\d+)$/;
  const newWeights = {};
  let migratedCount = 0;
  Object.keys(state.weights).forEach(function(oldKey) {
    const alreadyNewFormat = oldKey.split('::').length === 4;
    if (alreadyNewFormat) { newWeights[oldKey] = state.weights[oldKey]; return; }
    const match = oldKey.match(oldKeyPattern);
    if (!match) { newWeights[oldKey] = state.weights[oldKey]; return; }
    const exId = match[1]; const cycle = match[2]; const week = match[3];
    let ownerDay = null;
    Object.keys(state.activePlan).forEach(function(dayKey) {
      const day = state.activePlan[dayKey];
      if (day.rest) return;
      if (day.exerciseIds && day.exerciseIds.indexOf(exId) !== -1) { if (!ownerDay) ownerDay = dayKey; }
    });
    if (ownerDay) {
      const newKey = ownerDay + '::' + exId + '::c' + cycle + '::w' + week;
      newWeights[newKey] = state.weights[oldKey];
      migratedCount++;
    } else { newWeights[oldKey] = state.weights[oldKey]; }
  });
  state.weights = newWeights;
  state.migratedToPerDay = true;
  saveState();
  if (migratedCount > 0) { toast('Data updated: ' + migratedCount + ' entries migrated'); }
}

function daysSince(isoDateStr) {
  if (!isoDateStr) return Infinity;
  const then = new Date(isoDateStr + 'T00:00:00');
  const now = new Date(todayStr() + 'T00:00:00');
  return Math.round((now - then) / (1000 * 60 * 60 * 24));
}

const AUTO_BACKUP_MAX = 5;

function takeAutoBackupIfDue() {
  if (!state.autoBackupHistory) state.autoBackupHistory = [];
  const lastAuto = state.autoBackupHistory.length > 0 ? state.autoBackupHistory[state.autoBackupHistory.length - 1].date : null;
  if (daysSince(lastAuto) < 1) return;
  const stateForSnapshot = Object.assign({}, state);
  stateForSnapshot.autoBackupHistory = [];
  const snapshot = {
    date: todayStr(),
    data: JSON.stringify(stateForSnapshot)
  };
  state.autoBackupHistory.push(snapshot);
  if (state.autoBackupHistory.length > AUTO_BACKUP_MAX) {
    state.autoBackupHistory = state.autoBackupHistory.slice(state.autoBackupHistory.length - AUTO_BACKUP_MAX);
  }
}

async function loadProgramData() {
  const bannerContainer = document.getElementById('app');
  try {
    const response = await fetch('programData.json');
    if (!response.ok) { throw new Error('status ' + response.status); }
    const data = await response.json();
    exerciseLibrary = data.exerciseLibrary;
    programLibrary = data.programLibrary;
    Object.keys(exerciseLibrary).forEach(function(id) {
      const m = exerciseLibrary[id].muscle;
      if (!substituteGroups[m]) substituteGroups[m] = [];
      substituteGroups[m].push(id);
    });
    return true;
  } catch (e) {
    bannerContainer.innerHTML = '<div style="padding:30px 20px;text-align:center;">' +
      '<h2 style="color:#b31942;">Could not load program data</h2>' +
      '<p style="font-size:14px;color:#666;">Failed to load programData.json (' + e.message + ')</p>' +
      '<p style="font-size:13px;color:#999;">Make sure programData.json is in the same folder as this page, then reload.</p>' +
      '</div>';
    return false;
  }
}

async function loadState() {
  const dataOk = await loadProgramData();
  if (!dataOk) return;
  try {
    const raw = localStorage.getItem('workout-state-v3');
    if (raw) {
      state = Object.assign({}, state, JSON.parse(raw));
      migrateToPerDayKeys();
    }
  } catch (e) {}
  if (!state.autoBackupHistory) state.autoBackupHistory = [];
  if (state.activePlan) {
    takeAutoBackupIfDue();
    saveState();
  }
  if (!state.disclaimerAccepted) { render(); return; }
  if (!state.proteinGoal && !state.proteinPromptShown) { render(); return; }
  if (!state.goal || !state.activePlan) { state.screen = 'select_goal'; }
  render();
}

function getEntry(dayKey, exId, week, cycle) {
  const c = cycle !== undefined ? cycle : state.viewingCycle;
  const k = dayKey + '::' + exId + '::c' + c + '::w' + week;
  return state.weights[k] || null;
}
function setEntry(dayKey, exId, week, field, val) {
  const k = dayKey + '::' + exId + '::c' + state.viewingCycle + '::w' + week;
  if (!state.weights[k]) state.weights[k] = {};
  state.weights[k][field] = val;
  saveState();
}
function clearEntry(dayKey, exId, week) {
  const k = dayKey + '::' + exId + '::c' + state.viewingCycle + '::w' + week;
  delete state.weights[k];
  saveState();
}
function getPrevEntry(dayKey, exId, week) {
  for (let w = week - 1; w >= 1; w--) {
    const e = getEntry(dayKey, exId, w);
    if (e && (e.weight || e.done)) return { week: w, entry: e };
  }
  if (state.viewingCycle > 1) {
    for (let c = state.viewingCycle - 1; c >= 1; c--) {
      for (let w = 8; w >= 1; w--) {
        const e = getEntry(dayKey, exId, w, c);
        if (e && (e.weight || e.done)) return { week: w, entry: e, cycle: c };
      }
    }
  }
  return null;
}
function getLastKnownWeightAnyDay(exId, excludeDayKey, week, cycle) {
  const c = cycle !== undefined ? cycle : state.viewingCycle;
  let best = null;
  Object.keys(state.activePlan).forEach(function(dayKey) {
    const day = state.activePlan[dayKey];
    if (day.rest && exId !== '__steps__') return;
    if (exId !== '__steps__' && (!day.exerciseIds || day.exerciseIds.indexOf(exId) === -1)) return;
    for (let w = week; w >= 1; w--) {
      if (dayKey === excludeDayKey && w === week) continue;
      const e = getEntry(dayKey, exId, w, c);
      if (e && e.weight) {
        if (!best || w > best.week || (w === best.week && dayKey > best.dayKey)) { best = { week: w, entry: e, dayKey: dayKey }; }
      }
    }
  });
  return best;
}
function getAllEntriesForExercise(exId) {
  const results = [];
  Object.keys(state.activePlan).forEach(function(dayKey) {
    for (let c = 1; c <= state.cycle; c++) {
      for (let w = 1; w <= (state.programLength || 8); w++) {
        const e = getEntry(dayKey, exId, w, c);
        if (e && e.weight) results.push({ week: w, cycle: c, dayKey: dayKey, weight: parseFloat(e.weight), date: e.date });
      }
    }
  });
  return results;
}

function isDayComplete(dayKey, week) {
  const day = getEffectiveDay(dayKey, undefined, week);
  if (!day) return false;
  if (day.rest) {
    const e = getEntry(dayKey, '__rest_' + dayKey + '__', week);
    const restDone = !!(e && e.done);
    if (day.stepsGoal) {
      const stepsE = getEntry(dayKey, '__steps__', week);
      return restDone && !!(stepsE && stepsE.weight);
    }
    return restDone;
  }
  const mob = getEntry(dayKey, '__mobility_' + dayKey + '__', week);
  if (!mob || !mob.done) return false;
  const cardio = getEntry(dayKey, '__cardio_' + dayKey + '__', week);
  if (!cardio || !cardio.done) return false;
  for (let i = 0; i < day.exerciseIds.length; i++) {
    const exId = day.exerciseIds[i];
    const ex = exerciseLibrary[exId];
    const e = getEntry(dayKey, exId, week);
    if (ex.noWeight) { if (!e || !e.done) return false; }
    else { if (!e || !e.weight) return false; }
  }
  if (day.finisherId) {
    const fin = getEntry(dayKey, '__finisher_' + dayKey + '__', week);
    if (!fin || !fin.done) return false;
  }
  return true;
}

function isWeekComplete(week) {
  const keys = Object.keys(state.activePlan);
  for (let i = 0; i < keys.length; i++) { if (!isDayComplete(keys[i], week)) return false; }
  return true;
}

function splitDayLabel(label) {
  const dayPrefixes = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  for (let i = 0; i < dayPrefixes.length; i++) {
    const prefix = dayPrefixes[i];
    if (label.indexOf(prefix + ' ') === 0) {
      return { dayPart: prefix, typePart: label.substring(prefix.length + 1) };
    }
  }
  return { dayPart: '', typePart: label };
}

function applyDaySwapThisWeekOnly(sourceDayKey, otherKey) {
  const dayKeyToName = { sun: 'Sun', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat' };
  const sourceOwnDayName = dayKeyToName[sourceDayKey];
  const otherOwnDayName = dayKeyToName[otherKey];
  const sourceCurrent = getEffectiveDay(sourceDayKey);
  const otherCurrent = getEffectiveDay(otherKey);
  const sourceType = splitDayLabel(sourceCurrent.label).typePart;
  const otherType = splitDayLabel(otherCurrent.label).typePart;

  const newSourceContent = Object.assign({}, otherCurrent);
  newSourceContent.label = sourceOwnDayName + ' ' + otherType;
  const newOtherContent = Object.assign({}, sourceCurrent);
  newOtherContent.label = otherOwnDayName + ' ' + sourceType;

  const ovKey = weekOverrideKey(state.viewingCycle, state.week);
  if (!state.weeklyOverrides) state.weeklyOverrides = {};
  if (!state.weeklyOverrides[ovKey]) state.weeklyOverrides[ovKey] = {};
  state.weeklyOverrides[ovKey][sourceDayKey] = newSourceContent;
  state.weeklyOverrides[ovKey][otherKey] = newOtherContent;
  state.day = sourceDayKey;
  saveState();
  render();
  toast('Swapped for this week only');
}

function applyDaySwapAllFutureWeeks(sourceDayKey, otherKey) {
  const dayKeyToName = { sun: 'Sun', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat' };
  const sourceOwnDayName = dayKeyToName[sourceDayKey];
  const otherOwnDayName = dayKeyToName[otherKey];

  const otherOldContent = Object.assign({}, state.activePlan[otherKey]);
  const sourceOldType = splitDayLabel(sourceOldContent.label).typePart;
  const otherOldType = splitDayLabel(otherOldContent.label).typePart;
  const newSourceContent = Object.assign({}, otherOldContent);
  newSourceContent.label = sourceOwnDayName + ' ' + otherOldType;
  const newOtherContent = Object.assign({}, sourceOldContent);
  newOtherContent.label = otherOwnDayName + ' ' + sourceOldType;
  state.activePlan[sourceDayKey] = newSourceContent;
  state.activePlan[otherKey] = newOtherContent;

  render();
  toast('Workouts swapped going forward');
}

function checkAndCelebrate(dayKey, week) {
  const dayCelebrationKey = 'c' + state.cycle + '-w' + week + '-' + dayKey;
  if (isDayComplete(dayKey, week) && state.celebratedDays.indexOf(dayCelebrationKey) === -1) {
    state.celebratedDays.push(dayCelebrationKey);
    const dayKeys = getOrderedDayKeys();
    const currentIndex = dayKeys.indexOf(dayKey);
    if (currentIndex !== -1 && currentIndex < dayKeys.length - 1) {
      state.day = dayKeys[currentIndex + 1];
    }
    saveState();
    setTimeout(function() { showEncouragementModal('day'); render(); }, 350);
    return;
  }
  const weekCelebrationKey = 'c' + state.cycle + '-w' + week;
  if (isWeekComplete(week) && state.celebratedWeeks.indexOf(weekCelebrationKey) === -1) {
    state.celebratedWeeks.push(weekCelebrationKey);
    const totalWeeksForAdvance = state.programLength || 8;
    if (week < totalWeeksForAdvance) { state.week = week + 1; }
    const shouldShowTip = !state.shownWeekTip;
    if (shouldShowTip) state.shownWeekTip = true;
    saveState();
    setTimeout(function() {
      showEncouragementModal('week');
      if (shouldShowTip) {
        setTimeout(function() { showTipModal('week'); }, 900);
      }
      render();
    }, 350);
    return;
  }
  const totalWeeks = state.programLength || 8;
  let allWeeksDone = true;
  for (let w = 1; w <= totalWeeks; w++) { if (!isWeekComplete(w)) { allWeeksDone = false; break; } }
  const cycleCelebrationKey = 'c' + state.cycle;
  if (allWeeksDone && state.celebratedCycles.indexOf(cycleCelebrationKey) === -1) {
    state.celebratedCycles.push(cycleCelebrationKey);
    saveState();
    setTimeout(function() { showFireworksCelebration('You completed the whole program! Time to start your next cycle.'); }, 350);
  }
}

function isCheckinWeek(week) {
  const totalWeeks = state.programLength || 8;
  const midpoint = Math.round(totalWeeks / 2);
  return week === midpoint || week === totalWeeks;
}

    a.href = url;
    a.download = 'workout-backup-' + dateTag + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);

    toast('Backup failed: ' + e.message);
  }
}

function deleteCycle(cycleNum) {
  if (state.cycle === 1 && (state.archivedCheckpoints || []).length === 0) {
    toast('Cannot delete the only cycle');
    return;
  }
  if (!confirm('Delete Cycle ' + cycleNum + '? This permanently removes all weights, protein logs, checkpoints, and history for that cycle only. This cannot be undone.')) return;
  if (!confirm('Are you sure? Cycle ' + cycleNum + ' data will be gone for good.')) return;

  const cyclePrefix = '::c' + cycleNum + '::';
  const newWeights = {};
  Object.keys(state.weights).forEach(function(k) {
    if (k.indexOf(cyclePrefix) === -1) newWeights[k] = state.weights[k];
  });
  state.weights = newWeights;

  const newProteinEntries = {};
  Object.keys(state.proteinEntries).forEach(function(k) {
    if (k.indexOf('::c' + cycleNum + '::') === -1) newProteinEntries[k] = state.proteinEntries[k];
  });
  state.proteinEntries = newProteinEntries;

  state.archivedCheckpoints = (state.archivedCheckpoints || []).filter(function(a) { return a.cycle !== cycleNum; });
  state.goalHistory = (state.goalHistory || []).filter(function(g) { return g.cycle !== cycleNum; });

  const cycleTag = 'c' + cycleNum + '-';
  state.celebratedDays = (state.celebratedDays || []).filter(function(k) { return k.indexOf(cycleTag) !== 0; });
  state.celebratedWeeks = (state.celebratedWeeks || []).filter(function(k) { return k.indexOf(cycleTag) !== 0; });
  state.celebratedCycles = (state.celebratedCycles || []).filter(function(k) { return k !== ('c' + cycleNum); });

  const cycleStillHasArchive = state.archivedCheckpoints.some(function(a) { return a.cycle === cycleNum; });
  if (cycleNum === state.cycle && !cycleStillHasArchive) {
    state.checkpoints = { start: {}, week4: {}, week8: {} };
  }

  const remainingCycles = [];
  for (let c = 1; c <= state.cycle; c++) {
    if (c === cycleNum) continue;
    const hasWeights = Object.keys(state.weights).some(function(k) { return k.indexOf('::c' + c + '::') !== -1; });
    const hasProtein = Object.keys(state.proteinEntries).some(function(k) { return k.indexOf('::c' + c + '::') !== -1; });
    const hasArchive = state.archivedCheckpoints.some(function(a) { return a.cycle === c; });
    if (hasWeights || hasProtein || hasArchive || c === 1) remainingCycles.push(c);
  }
  const newHighestCycle = remainingCycles.length > 0 ? Math.max.apply(null, remainingCycles) : 1;

  if (cycleNum === state.cycle) {
    state.cycle = newHighestCycle;
    state.viewingCycle = newHighestCycle;
    state.week = 1;
  } else if (state.viewingCycle === cycleNum) {
    state.viewingCycle = newHighestCycle;
    state.week = 1;
  }

  saveState();
  render();
  toast('Cycle ' + cycleNum + ' deleted');
}

function getProgressionSuggestion(scheme, week, recoveryPref, mostRecentLoggedWeight) {
  const match = scheme.match(/(\d+)\s*x\s*(\d+)/);
  if (!match) return null;
  const sets = parseInt(match[1], 10);
  const baseReps = parseInt(match[2], 10);
  const weightStep = 5;

  function weightSuggestion() {
    if (!mostRecentLoggedWeight) return 'Log a weight this week to get a suggestion next week';
    return 'Try ' + (parseFloat(mostRecentLoggedWeight) + weightStep) + ' lbs (up from your last logged ' + mostRecentLoggedWeight + ' lbs)';
  }

  if (recoveryPref === 'aggressive') {
    return { type: 'weight', text: weightSuggestion() };
  }
  if (recoveryPref === 'joint_friendly') {
    const cyclePosition = ((week - 1) % 5);
    if (cyclePosition >= 4) {
      return { type: 'weight', text: 'Rep ceiling reached \u2014 ' + weightSuggestion() };
    }
    return { type: 'reps', text: sets + ' x ' + (baseReps + cyclePosition + 1) + ' this week' };
  }
  if (week % 2 === 1) {
    return { type: 'reps', text: sets + ' x ' + (baseReps + 2) + ' this week' };
  }
  return { type: 'weight', text: weightSuggestion() };
}

function isRecoveryWeek(week) {
  return week > 1 && (week - 1) % 4 === 0;
}

function buildLineChart(title, points, color) {
  const wrap = document.createElement('div');
  wrap.className = 'progress-ex-card';
  if (title) { const h = document.createElement('h4'); h.textContent = title; wrap.appendChild(h); }
  const valid = points.filter(function(p) { return p.val !== null && !isNaN(p.val); });
  if (valid.length < 2) {
    const nd = document.createElement('div');
    nd.className = 'no-data';
    nd.textContent = valid.length === 0 ? 'No data entered yet' : 'Need at least 2 data points to graph';
    wrap.appendChild(nd);
    return wrap;
  }
  const W = 320, H = 140, pad = 30;
  const vals = valid.map(function(p) { return p.val; });
  const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  const range = max - min || 1;
  const stepX = (W - pad * 2) / (points.length - 1);
  let pathD = '', dots = '', labels = '';
  points.forEach(function(p, i) {
    if (p.val === null || isNaN(p.val)) return;
    const x = pad + i * stepX;
    const y = H - pad - ((p.val - min) / range) * (H - pad * 2);
    pathD += (pathD ? 'L' : 'M') + x + ',' + y + ' ';
    dots += '<circle cx="' + x + '" cy="' + y + '" r="4" fill="' + color + '"/>';
    labels += '<text x="' + x + '" y="' + (H - 6) + '" font-size="10" fill="#999" text-anchor="middle">' + p.label + '</text>';
    labels += '<text x="' + x + '" y="' + (y - 10) + '" font-size="11" fill="#333" text-anchor="middle" font-weight="600">' + p.val + '</text>';
  });
  wrap.innerHTML += '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '"><path d="' + pathD + '" fill="none" stroke="' + color + '" stroke-width="2.5"/>' + dots + labels + '</svg>';
  const first = valid[0].val, last = valid[valid.length - 1].val;
  const diff = (last - first).toFixed(1);
  const stats = document.createElement('div');
  stats.className = 'chart-stats';
  stats.innerHTML = '<div>Start: <strong>' + first + '</strong></div><div>Latest: <strong>' + last + '</strong></div><div>Change: <strong>' + (diff > 0 ? '+' : '') + diff + '</strong></div>';
  wrap.appendChild(stats);
  return wrap;
}

  const newProgramBtn = document.createElement('button');
  newProgramBtn.textContent = 'Create New Program';
  newProgramBtn.style.cssText = 'width:100%;padding:12px;background:#eef3fb;color:#1c3a7a;border:1px solid #b9cdf0;border-radius:10px;font-size:14px;font-weight:600;';
  newProgramBtn.onclick = function() {
    if (confirm('Start a brand new program now? Your current cycle data stays saved for progress tracking, and you will choose a new program length and goal.')) {
      const hasData = state.checkpoints && ((state.checkpoints.start && state.checkpoints.start.weight) || (state.checkpoints.week4 && state.checkpoints.week4.weight) || (state.checkpoints.week8 && state.checkpoints.week8.weight));
      if (hasData) { state.archivedCheckpoints.push({ cycle: state.cycle, start: state.checkpoints.start, week4: state.checkpoints.week4, week8: state.checkpoints.week8 }); }
      state.goalHistory.push({ cycle: state.cycle, goal: state.goal, length: state.programLength });
      state.checkpoints = { start: {}, week4: {}, week8: {} };
      state.cycle += 1;
      state.viewingCycle = state.cycle;
      state.week = 1;
      state.screen = 'select_goal';
      saveState();
      render();
    }
  };
  newProgramWrap.appendChild(newProgramBtn);
  content.appendChild(newProgramWrap);
  const stepsEntries = [];
  Object.keys(state.activePlan).forEach(function(dayKey) {
    for (let c = 1; c <= state.cycle; c++) {
      for (let w = 1; w <= (state.programLength || 8); w++) {
        const e = getEntry(dayKey, '__steps__', w, c);
        if (e && e.weight) stepsEntries.push({ week: w, cycle: c, dayKey: dayKey, weight: parseFloat(e.weight) });
      }
    }
  });
  if (stepsEntries.length >= 2) {
    stepsEntries.sort(function(a, b) { return (a.cycle - b.cycle) || (a.week - b.week); });
    const stepPoints = stepsEntries.map(function(e) {
      const dayLabel = state.activePlan[e.dayKey] ? state.activePlan[e.dayKey].label.split(' ')[0] : e.dayKey;
      return { label: (state.cycle > 1 ? ('C' + e.cycle + 'W' + e.week) : ('Wk' + e.week)) + ' ' + dayLabel, val: e.weight };
    });
    content.appendChild(buildLineChart('Daily Steps', stepPoints, '#3a7ae8'));
  }
  const seen = {};
  Object.keys(exerciseLibrary).forEach(function(exId) {
    const entries = getAllEntriesForExercise(exId);
    if (entries.length === 0) return;
    seen[exId] = true;
    const card = document.createElement('div');
    card.className = 'progress-ex-card';
    const h = document.createElement('h4');
    h.textContent = exerciseLibrary[exId].name;
    card.appendChild(h);
    if (entries.length < 2) {
      const nd = document.createElement('div');
      nd.className = 'no-data';
      nd.textContent = '1 entry logged (Week ' + entries[0].week + ': ' + entries[0].weight + ' lbs) - need 2+ to graph';
      card.appendChild(nd);
      content.appendChild(card);
      return;
    }
    entries.sort(function(a, b) { return (a.cycle - b.cycle) || (a.week - b.week); });
    const points = entries.map(function(e) {
      const dayLabel = state.activePlan[e.dayKey] ? state.activePlan[e.dayKey].label.split(' ')[0] : e.dayKey;
      return { label: (state.cycle > 1 ? ('C' + e.cycle + 'W' + e.week) : ('Wk' + e.week)) + ' ' + dayLabel, val: e.weight };
    });
    const chart = buildLineChart('', points, '#e8722c');
    card.innerHTML += chart.innerHTML;
    content.appendChild(card);
  });
  if (Object.keys(seen).length === 0) {
    const nd = document.createElement('div');
    nd.className = 'rest-note';
    nd.textContent = 'No weighted exercises logged yet.';
    content.appendChild(nd);
  }
  const legalLink = document.createElement('button');
  legalLink.textContent = 'View medical disclaimer';
  legalLink.style.cssText = 'width:100%;padding:10px;background:none;border:none;color:#999;font-size:12px;text-decoration:underline;margin-top:16px;';
  legalLink.onclick = function() { state.disclaimerAccepted = false; saveState(); render(); };
  content.appendChild(legalLink);
  renderTipLink(content);
  container.appendChild(content);
}

function renderProteinScreen(container) {
  const content = document.createElement('div');
  content.className = 'content';

  if (!state.proteinGoal) {
    const optInCard = document.createElement('div');
    optInCard.className = 'card';
    optInCard.innerHTML = '<p class="ex-name" style="margin-bottom:6px;">Track your protein intake?</p><p class="ex-scheme" style="margin-bottom:12px;">Set a daily goal to start logging food and tracking progress toward it.</p>';
    const input = document.createElement('input');
    input.type = 'number';
    input.inputMode = 'numeric';
    input.placeholder = 'e.g. 160';
    input.style.cssText = 'width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px;font-weight:600;text-align:center;margin-bottom:10px;';
    optInCard.appendChild(input);
    const setBtn = document.createElement('button');
    setBtn.textContent = 'Set Daily Goal';
    setBtn.style.cssText = 'width:100%;padding:12px;background:#e8722c;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;';
    setBtn.onclick = function() {
      const parsed = parseInt(input.value, 10);
      if (!parsed || parsed <= 0) { toast('Enter a valid number'); return; }
      state.proteinGoal = parsed;
      state.proteinPromptShown = true;
      saveState();
      render();
    };
    optInCard.appendChild(setBtn);
    content.appendChild(optInCard);
    container.appendChild(content);
    return;
  }

  if (!state.proteinViewDay) state.proteinViewDay = state.day;
  const viewDay = state.proteinViewDay;

  const dayPickerWrap = document.createElement('div');
  dayPickerWrap.style.cssText = 'margin-bottom:14px;';
  const dayPickerLabel = document.createElement('div');
  dayPickerLabel.className = 'section-label';
  dayPickerLabel.textContent = 'Viewing protein for';
  dayPickerWrap.appendChild(dayPickerLabel);
  const daySelect = document.createElement('select');
  daySelect.style.cssText = 'width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ddd;background:#f7f6f2;font-size:14px;font-weight:600;color:#1c1c1a;';
  getOrderedDayKeys().forEach(function(key) {
    const opt = document.createElement('option');
    opt.value = key;
    const total = getDailyProteinTotal(key, state.viewingCycle, state.week);
    opt.textContent = state.activePlan[key].label + (total > 0 ? ' (' + total + 'g logged)' : '');
    if (key === viewDay) opt.selected = true;
    daySelect.appendChild(opt);
  });
  daySelect.onchange = function() { state.proteinViewDay = daySelect.value; render(); };
  dayPickerWrap.appendChild(daySelect);
  content.appendChild(dayPickerWrap);

  const total = getDailyProteinTotal(viewDay, state.viewingCycle, state.week);
  const remaining = Math.max(0, state.proteinGoal - total);
  const pct = Math.min(100, Math.round((total / state.proteinGoal) * 100));

  const summaryCard = document.createElement('div');
  summaryCard.className = 'card';
  summaryCard.innerHTML =
    '<p class="ex-name" style="font-size:16px;">' + (state.activePlan[viewDay] ? state.activePlan[viewDay].label : viewDay) + ' protein</p>' +
    '<div style="font-size:32px;font-weight:800;margin:8px 0;">' + total + '<span style="font-size:16px;color:#999;font-weight:600;"> / ' + state.proteinGoal + 'g</span></div>' +
    '<div style="background:#f0efe9;border-radius:20px;height:10px;overflow:hidden;margin-bottom:8px;"><div style="background:#e8722c;height:100%;width:' + pct + '%;"></div></div>' +
    '<div style="font-size:13px;color:#777;">' + (remaining > 0 ? (remaining + 'g to go') : 'Goal reached!') + '</div>';
  content.appendChild(summaryCard);

  const editGoalBtn = document.createElement('button');
  editGoalBtn.textContent = 'Edit daily goal';
  editGoalBtn.style.cssText = 'width:100%;padding:8px;background:none;border:none;color:#999;font-size:12px;text-decoration:underline;margin-bottom:16px;';
  editGoalBtn.onclick = function() {
    const newGoal = prompt('Enter new daily protein goal (grams):', state.proteinGoal);
    if (newGoal) {
      const parsed = parseInt(newGoal, 10);
      if (parsed > 0) { state.proteinGoal = parsed; saveState(); render(); }
    }
  };
  content.appendChild(editGoalBtn);

  const quickLabel = document.createElement('div');
  quickLabel.className = 'section-label';
  quickLabel.textContent = 'Quick Add to ' + (state.activePlan[viewDay] ? state.activePlan[viewDay].label : viewDay);
  content.appendChild(quickLabel);

  const quickWrap = document.createElement('div');
  quickWrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;';
  proteinPresets.forEach(function(preset) {
    const btn = document.createElement('button');
    btn.textContent = preset.name + ' \u00b7 ' + preset.grams + 'g';
    btn.style.cssText = 'padding:10px 14px;background:#fff;border:1px solid #e6e4dc;border-radius:20px;font-size:13px;font-weight:600;color:#1c1c1a;';
    btn.onclick = function() {
      addProteinEntry(viewDay, preset.name, preset.grams);
      render();
      toast('Added ' + preset.grams + 'g');
    };
    quickWrap.appendChild(btn);
  });
  content.appendChild(quickWrap);

  const customLabel = document.createElement('div');
  customLabel.className = 'section-label';
  customLabel.textContent = 'Add Custom Food';
  content.appendChild(customLabel);

  const customCard = document.createElement('div');
  customCard.className = 'card';
  customCard.innerHTML =
    '<div style="display:flex;gap:8px;">' +
    '<input id="custom-food-name" type="text" placeholder="Food name" style="flex:2;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;">' +
    '<input id="custom-food-grams" type="number" inputmode="numeric" placeholder="Grams" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;">' +
    '</div>';
  const addBtn = document.createElement('button');
  addBtn.textContent = 'Add';
  addBtn.style.cssText = 'width:100%;padding:10px;margin-top:10px;background:#e8722c;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;';
  addBtn.onclick = function() {
    const nameInput = document.getElementById('custom-food-name');
    const gramsInput = document.getElementById('custom-food-grams');
    const grams = parseFloat(gramsInput.value);
    if (!nameInput.value || !grams || grams <= 0) { toast('Enter a food name and grams'); return; }
    addProteinEntry(viewDay, nameInput.value, grams);
    render();
    toast('Added ' + grams + 'g');
  };
  customCard.appendChild(addBtn);
  content.appendChild(customCard);

  const entries = getProteinEntries(viewDay, state.viewingCycle, state.week);
  if (entries.length > 0) {
    const loggedLabel = document.createElement('div');
    loggedLabel.className = 'section-label';
    loggedLabel.textContent = 'Logged for ' + (state.activePlan[viewDay] ? state.activePlan[viewDay].label : viewDay);
    content.appendChild(loggedLabel);
    entries.forEach(function(entry, idx) {
      const row = document.createElement('div');
      row.className = 'card';
      row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:10px 14px;';
      row.innerHTML = '<span style="font-size:14px;">' + entry.name + '</span><span style="font-size:14px;font-weight:700;">' + entry.grams + 'g</span>';
      const delBtn = document.createElement('button');
      delBtn.textContent = 'Remove';
      delBtn.style.cssText = 'font-size:11px;color:#b31942;background:none;border:none;font-weight:600;margin-left:10px;';
      delBtn.onclick = function() {
        removeProteinEntry(viewDay, idx);
        render();
      };
      row.appendChild(delBtn);
      content.appendChild(row);
    });
  } else {
    const nd0 = document.createElement('div');
    nd0.className = 'rest-note';
    nd0.textContent = 'Nothing logged yet for this day.';
    content.appendChild(nd0);
  }

  const graphLabel = document.createElement('div');
  graphLabel.className = 'section-label';
  graphLabel.textContent = 'Protein Trend';
  content.appendChild(graphLabel);

  const allTotals = getAllProteinTotals();
  if (allTotals.length >= 2) {
    allTotals.sort(function(a, b) { return (a.cycle - b.cycle) || (a.week - b.week); });
    const points = allTotals.map(function(e) {
      const dayLabel = state.activePlan[e.dayKey] ? state.activePlan[e.dayKey].label.split(' ')[0] : e.dayKey;
      return { label: (state.cycle > 1 ? ('C' + e.cycle + 'W' + e.week) : ('Wk' + e.week)) + ' ' + dayLabel, val: e.total };
    });
    content.appendChild(buildLineChart('Daily Protein (g)', points, '#e8722c'));
  } else {
    const nd = document.createElement('div');
    nd.className = 'rest-note';
    nd.textContent = 'Log protein on 2 or more days to see your trend graph.';
    content.appendChild(nd);
  }

  container.appendChild(content);
}

function renderDayTabs(container) {
  const dt = document.createElement('div');
  dt.className = 'day-tabs';
  dt.style.cssText = 'flex-wrap:nowrap;overflow-x:visible;';
  const daySelectWrap = document.createElement('div');
  daySelectWrap.style.cssText = 'flex:1;min-width:0;';
  const keys = getOrderedDayKeys();
  const daySelect = document.createElement('select');
  daySelect.style.cssText = 'width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ddd;background:#f7f6f2;font-size:14px;font-weight:600;color:#1c1c1a;';
  keys.forEach(function(key) {
    const opt = document.createElement('option');
    opt.value = key;
    const check = isDayComplete(key, state.week) ? ' (Done)' : '';
    opt.textContent = getEffectiveDay(key).label + check;
    if (state.day === key && state.screen === 'day') opt.selected = true;
    daySelect.appendChild(opt);
  });
  daySelect.onchange = function() { state.day = daySelect.value; state.screen = 'day'; saveState(); render(); };
  daySelectWrap.appendChild(daySelect);
  dt.appendChild(daySelectWrap);
  const cb = document.createElement('button');
  cb.className = 'day-tab' + (state.screen === 'checkpoints' ? ' active' : '');
  cb.textContent = 'Checkpoints';
  cb.onclick = function() {
    state.screen = state.screen === 'checkpoints' ? 'day' : 'checkpoints';
    saveState();
    render();
  };
  dt.appendChild(cb);
  const pb = document.createElement('button');
  pb.className = 'day-tab' + (state.screen === 'progress' ? ' active' : '');
  pb.textContent = 'Progress';
  pb.onclick = function() {
    state.screen = state.screen === 'progress' ? 'day' : 'progress';
    saveState();
    render();
  };
  dt.appendChild(pb);
  const tb = document.createElement('button');
  tb.className = 'day-tab' + (state.screen === 'tutorial' ? ' active' : '');
  tb.textContent = 'Tutorial';
  tb.onclick = function() {
    state.screen = state.screen === 'tutorial' ? 'day' : 'tutorial';
    saveState();
    render();
  };
  dt.appendChild(tb);
  container.appendChild(dt);
}

function renderWeekPicker(container) {
  const header = document.createElement('div');
  header.className = 'header';
  const cycleOptions = [];
  for (let c = 1; c <= state.cycle; c++) cycleOptions.push(c);
  let cycleSelectHtml = '';
  if (cycleOptions.length > 1) {
    cycleSelectHtml = '<select id="cycle-select" style="margin-top:8px;padding:8px 10px;border-radius:8px;border:1px solid #444;background:#2a2a27;color:#d5d4cd;font-size:13px;width:100%;">' +
      cycleOptions.map(function(c) { return '<option value="' + c + '"' + (c === state.viewingCycle ? ' selected' : '') + '>Cycle ' + c + (c === state.cycle ? ' (current)' : '') + '</option>'; }).join('') +
      '</select>';
  }
  header.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:flex-start;">' +
    '<div><h1>' + goalTemplates[state.goal].label + '</h1><div class="sub" id="week-sub"></div></div>' +
    '<button id="protein-toggle-btn" style="flex-shrink:0;padding:8px 14px;background:' + (state.screen === 'protein' ? '#e8722c' : '#2a2a27') + ';color:#fff;border:1px solid ' + (state.screen === 'protein' ? '#e8722c' : '#444') + ';border-radius:8px;font-size:13px;font-weight:600;">Protein</button>' +
    '</div>' +
    cycleSelectHtml + '<div id="week-select-wrap" style="margin-top:10px;"></div>';
  container.appendChild(header);

  const proteinToggleBtn = header.querySelector('#protein-toggle-btn');
  proteinToggleBtn.onclick = function() {
    state.screen = state.screen === 'protein' ? 'day' : 'protein';
    saveState();
    render();
  };

  if (cycleOptions.length > 1) {
    const sel = header.querySelector('#cycle-select');
    sel.onchange = function() { state.viewingCycle = parseInt(sel.value, 10); state.week = 1; saveState(); render(); };
  }
  const weekWrap = header.querySelector('#week-select-wrap');
  const totalWeeks = state.programLength || 8;
  const weekSelect = document.createElement('select');
  weekSelect.style.cssText = 'width:100%;padding:10px 12px;border-radius:8px;border:1px solid #444;background:#2a2a27;color:#d5d4cd;font-size:14px;font-weight:600;';
  for (let i = 1; i <= totalWeeks; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    const check = isWeekComplete(i) ? ' (Done)' : '';
    opt.textContent = 'Week ' + i + check;
    if (state.week === i) opt.selected = true;
    weekSelect.appendChild(opt);
  }
  weekSelect.onchange = function() { state.week = parseInt(weekSelect.value, 10); saveState(); render(); };
  weekWrap.appendChild(weekSelect);
  const viewingLabel = state.viewingCycle !== state.cycle ? ' - viewing past cycle' : '';
  header.querySelector('#week-sub').textContent = 'Cycle ' + state.viewingCycle + ' - Week ' + state.week + ' of ' + totalWeeks + viewingLabel;
  if (state.viewingCycle !== state.cycle) {
    const backBtn = document.createElement('button');
    backBtn.textContent = 'Return to current cycle';
    backBtn.style.cssText = 'margin-top:8px;padding:8px 12px;background:#e8722c;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;';
    backBtn.onclick = function() { state.viewingCycle = state.cycle; state.week = 1; saveState(); render(); };
    header.appendChild(backBtn);
  }
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (!state.disclaimerAccepted) { renderDisclaimer(); return; }
  if (!state.proteinGoal && !state.proteinPromptShown) { renderProteinGoalSetup(); return; }
  if (state.screen === 'onboarding') { renderOnboardingStep(app); return; }
  if (state.screen === 'onboarding_summary') { renderOnboardingSummary(); return; }
  if (state.screen === 'select_goal') { renderGoalSelect(); return; }
  if (state.screen === 'select_subgoal') { renderSubgoalSelect(); return; }
  if (state.screen === 'select_length') { renderLengthSelect(); return; }
  renderDayTabs(app);
  renderWeekPicker(app);
  if (state.screen === 'checkpoints') { renderCheckpointsScreen(app); }
  else if (state.screen === 'progress') { renderProgressScreen(app); }
  else if (state.screen === 'protein') { renderProteinScreen(app); }
  else if (state.screen === 'tutorial') { renderTutorialTab(app); }
  else { renderDayContent(app); }
}

loadState();
</script>

</body>
</html>
