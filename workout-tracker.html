function checkAndCelebrate(dayKey, week) {
  const dayCelebrationKey = 'c' + state.cycle + '-w' + week + '-' + dayKey;
  if (isDayComplete(dayKey, week) && state.celebratedDays.indexOf(dayCelebrationKey) === -1) {
    state.celebratedDays.push(dayCelebrationKey);
    const dayKeys = getOrderedDayKeys();
    const currentIndex = dayKeys.indexOf(dayKey);
    if (currentIndex !== -1 && currentIndex < dayKeys.length - 1) {
      state.day = dayKeys[currentIndex + 1];
    }
    saveState();
    setTimeout(function() { showEncouragementModal('day'); render(); }, 350);
    return;
  }
  const weekCelebrationKey = 'c' + state.cycle + '-w' + week;
  if (isWeekComplete(week) && state.celebratedWeeks.indexOf(weekCelebrationKey) === -1) {
    state.celebratedWeeks.push(weekCelebrationKey);
    const totalWeeksForAdvance = state.programLength || 8;
    if (week < totalWeeksForAdvance) { state.week = week + 1; }
    const shouldShowTip = !state.shownWeekTip;
    if (shouldShowTip) state.shownWeekTip = true;
    saveState();
    setTimeout(function() {
      showEncouragementModal('week');
      if (shouldShowTip) {
        setTimeout(function() { showTipModal('week'); }, 900);
      }
      render();
    }, 350);
    return;
  }
  const totalWeeks = state.programLength || 8;
  let allWeeksDone = true;
  for (let w = 1; w <= totalWeeks; w++) { if (!isWeekComplete(w)) { allWeeksDone = false; break; } }
  const cycleCelebrationKey = 'c' + state.cycle;
  if (allWeeksDone && state.celebratedCycles.indexOf(cycleCelebrationKey) === -1) {
    state.celebratedCycles.push(cycleCelebrationKey);
    saveState();
    setTimeout(function() { showFireworksCelebration('You completed the whole program! Program Complete!', true); }, 350);
  }
}

function isCheckinWeek(week) {
  const totalWeeks = state.programLength || 8;

function downloadBackupFile() {

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'workout-backup-' + dateTag + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    toast('Backup downloaded');
  } catch (e) {
    toast('Backup failed: ' + e.message);
  }
}

function deleteCycle(cycleNum) {
  if (state.cycle === 1 && (state.archivedCheckpoints || []).length === 0) {
    toast('Cannot delete the only cycle');
    return;
  }
  if (!confirm('Delete Cycle ' + cycleNum + '? This permanently removes all weights, protein logs, checkpoints, and history for that cycle only. This cannot be undone.')) return;
  if (!confirm('Are you sure? Cycle ' + cycleNum + ' data will be gone for good.')) return;

  const cyclePrefix = '::c' + cycleNum + '::';
  const newWeights = {};
  Object.keys(state.weights).forEach(function(k) {
    if (k.indexOf(cyclePrefix) === -1) newWeights[k] = state.weights[k];
  });
  state.weights = newWeights;

  const newProteinEntries = {};
  Object.keys(state.proteinEntries).forEach(function(k) {
    if (k.indexOf('::c' + cycleNum + '::') === -1) newProteinEntries[k] = state.proteinEntries[k];
  });
  state.proteinEntries = newProteinEntries;

  state.archivedCheckpoints = (state.archivedCheckpoints || []).filter(function(a) { return a.cycle !== cycleNum; });
  state.goalHistory = (state.goalHistory || []).filter(function(g) { return g.cycle !== cycleNum; });

  const cycleTag = 'c' + cycleNum + '-';
  state.celebratedDays = (state.celebratedDays || []).filter(function(k) { return k.indexOf(cycleTag) !== 0; });
  state.celebratedWeeks = (state.celebratedWeeks || []).filter(function(k) { return k.indexOf(cycleTag) !== 0; });
  state.celebratedCycles = (state.celebratedCycles || []).filter(function(k) { return k !== ('c' + cycleNum); });

  const cycleStillHasArchive = state.archivedCheckpoints.some(function(a) { return a.cycle === cycleNum; });
  if (cycleNum === state.cycle && !cycleStillHasArchive) {
    state.checkpoints = { start: {}, week4: {}, week8: {} };
  }

  const remainingCycles = [];
  for (let c = 1; c <= state.cycle; c++) {
    if (c === cycleNum) continue;
    const hasWeights = Object.keys(state.weights).some(function(k) { return k.indexOf('::c' + c + '::') !== -1; });
    const hasProtein = Object.keys(state.proteinEntries).some(function(k) { return k.indexOf('::c' + c + '::') !== -1; });
    const hasArchive = state.archivedCheckpoints.some(function(a) { return a.cycle === c; });
    if (hasWeights || hasProtein || hasArchive || c === 1) remainingCycles.push(c);
  }
  const newHighestCycle = remainingCycles.length > 0 ? Math.max.apply(null, remainingCycles) : 1;

  if (cycleNum === state.cycle) {
    state.cycle = newHighestCycle;
    state.viewingCycle = newHighestCycle;
    state.week = 1;
  } else if (state.viewingCycle === cycleNum) {
    state.viewingCycle = newHighestCycle;
    state.week = 1;
  }

  saveState();
  render();
  toast('Cycle ' + cycleNum + ' deleted');
}

function cycleActuallyExists(c) {
  if (c === state.cycle) return true;
  const hasWeights = Object.keys(state.weights).some(function(k) { return k.indexOf('::c' + c + '::') !== -1; });
  const hasProtein = Object.keys(state.proteinEntries).some(function(k) { return k.indexOf('::c' + c + '::') !== -1; });
  const hasArchive = (state.archivedCheckpoints || []).some(function(a) { return a.cycle === c; });
  return hasWeights || hasProtein || hasArchive;
}

function isRecoveryWeek(week) {
  return week > 1 && (week - 1) % 4 === 0;
}

/* =========================================================
   BATCH 3: Corrected progression logic
   Root cause of the "too aggressive" bug: the original
   getProgressionSuggestion had no concept of session-success history at
   all. On 'standard' recovery (the default for most programs), it
   alternated a rep-increase suggestion on odd weeks and a weight-increase
   suggestion on even weeks purely by WEEK PARITY - meaning a single
   logged session at an odd week number could trigger a suggested
   increase with zero prior consistency behind it. 'aggressive' recovery
   suggested a weight increase on literally every single session,
   unconditionally.

   Fix: PROGRESSION_SUCCESS_THRESHOLD consecutive successful sessions at
   the SAME weight are now required before ANY increase (rep or weight)
   is suggested, for every recovery preference. "Successful session" is
   defined using the only performance signal this app actually stores -
   a logged weight for that exercise/day/week - since there is no
   per-set/per-rep logging system to draw on, and the spec explicitly
   says not to invent one. A run of consecutive sessions at the same
   logged weight, with no gaps, counts as consistent successful
   performance at that weight.

   This constant is defined here, isolated, so it can be tuned later
   without touching the surrounding logic.
   ========================================================= */
const PROGRESSION_SUCCESS_THRESHOLD = 3;

/**
 * Returns the length of the most recent unbroken run of sessions logged at
 * the exact same weight, using the exercise's own date-sorted history for
 * this specific dayKey (so different days of the same exercise are judged
 * independently, matching how suggestions are already shown per-day).
 * Entries are sorted by entry.date when available (matching the Batch 1
 * fix's chronological approach), falling back to week/cycle order for
 * legacy entries with no stored date.
 */
function getConsecutiveSameWeightStreak(dayKey, exId) {
  const entries = getAllEntriesForExercise(exId)
    .filter(function(e) { return e.dayKey === dayKey; })
    .sort(function(a, b) {
      if (a.date && b.date) return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0);
      return (a.cycle - b.cycle) || (a.week - b.week);
    });
  if (entries.length === 0) return 0;
  let streak = 1;
  for (let i = entries.length - 1; i > 0; i--) {
    if (entries[i].weight === entries[i - 1].weight) streak++;
    else break;
  }
  return streak;
}

function getProgressionSuggestion(scheme, week, recoveryPref, mostRecentLoggedWeight, streakCount) {
  const match = scheme.match(/(\d+)\s*x\s*(\d+)/);
  if (!match) return null;
  const sets = parseInt(match[1], 10);
  const baseReps = parseInt(match[2], 10);
  const weightStep = 5;

  function weightSuggestion() {
    if (!mostRecentLoggedWeight) return 'Log a weight this week to get a suggestion next week';
    return 'Try ' + (parseFloat(mostRecentLoggedWeight) + weightStep) + ' lbs (up from your last logged ' + mostRecentLoggedWeight + ' lbs)';
  }

  // BATCH 3 FIX: no increase of any kind (weight or reps) is suggested until
  // PROGRESSION_SUCCESS_THRESHOLD consecutive same-weight sessions have been
  // logged. Below that threshold, either there isn't enough history yet, or
  // performance hasn't been consistent enough yet to recommend more - in
  // both cases, no suggestion is the correct, conservative behavior.
  const streak = streakCount || 0;
  if (streak < PROGRESSION_SUCCESS_THRESHOLD) {
    return null;
  }

  if (recoveryPref === 'aggressive') {
    return { type: 'weight', text: 'You\u2019re showing consistent progress at ' + mostRecentLoggedWeight + ' lbs. Consider increasing slightly next session. ' + weightSuggestion() };
  }
  if (recoveryPref === 'joint_friendly') {
    const cyclePosition = ((week - 1) % 5);
    if (cyclePosition >= 4) {
      return { type: 'weight', text: 'Rep ceiling reached \u2014 ' + weightSuggestion() };
    }
    return { type: 'reps', text: 'You\u2019re showing consistent progress at this weight. Consider ' + sets + ' x ' + (baseReps + cyclePosition + 1) + ' next session.' };
  }
  if (week % 2 === 1) {
    return { type: 'reps', text: 'You\u2019re showing consistent progress at this weight. Consider ' + sets + ' x ' + (baseReps + 2) + ' next session.' };
  }
  return { type: 'weight', text: 'You\u2019re showing consistent progress at ' + mostRecentLoggedWeight + ' lbs. Consider increasing slightly next session. ' + weightSuggestion() };
}

function detectWeightStall(entries) {
  if (!entries || entries.length < 3) return null;
  const lastThree = entries.slice(-3);
  const netChange = lastThree[2].weight - lastThree[0].weight;
  if (netChange <= 0) return { last3: lastThree.map(function(e) { return e.weight; }) };
  return null;
}

function getIntelligentSuggestion(dayKey, exId, week, baseSuggestion) {
  const entries = getAllEntriesForExercise(exId)
    .filter(function(e) { return e.dayKey === dayKey; })
    .sort(function(a, b) { return (a.cycle - b.cycle) || (a.week - b.week); });
  const stall = detectWeightStall(entries);
  if (stall) {
    return {
      type: 'deload',
      text: 'No progress the last 3 sessions (' + stall.last3.join(' \u2192 ') + ' lbs). Consider a deload \u2014 drop 10\u201315% and rebuild, or take extra rest before this lift.'
    };
  }
  return baseSuggestion;
}

function getRecentWorkoutCompletions(n) {
  const results = [];
  const orderedDays = getOrderedDayKeys();
  let cycle = state.viewingCycle;
  let week = state.week;
  let dayIdx = orderedDays.length - 1;
  let safetyCounter = 0;
  while (results.length < n && safetyCounter < 500) {
    safetyCounter++;
    if (dayIdx < 0) {
      week -= 1;
      dayIdx = orderedDays.length - 1;
      if (week < 1) {
        cycle -= 1;
        week = state.programLength || 8;
        if (cycle < 1) break;
      }
    }
    const dayKey = orderedDays[dayIdx];
    const dayDef = getEffectiveDay(dayKey, cycle, week);
    if (dayDef && !dayDef.rest) {
      const hasAnyEntry = (dayDef.exerciseIds || []).some(function(exId) { return !!getEntry(dayKey, exId, week, cycle); });
      if (hasAnyEntry || cycle < state.cycle || week < state.week) {
        results.push(isDayComplete(dayKey, week));
      }
    }
    dayIdx -= 1;
  }
  return results.reverse();
}

function getRecentStepsEntries(n) {
  const all = [];
  Object.keys(state.activePlan).forEach(function(dayKey) {
    for (let c = 1; c <= state.cycle; c++) {
      for (let w = 1; w <= (state.programLength || 8); w++) {
        const e = getEntry(dayKey, '__steps__', w, c);
        if (e && e.weight) all.push({ cycle: c, week: w, dayKey: dayKey, steps: parseFloat(e.weight) });
      }
    }
  });
  all.sort(function(a, b) { return (a.cycle - b.cycle) || (a.week - b.week); });
  return all.slice(-n).map(function(e) { return e.steps; });
}

function generateRecoveryRecommendations() {
  const recommendations = [];
  const completions = getRecentWorkoutCompletions(5);
  const missedCount = completions.filter(function(c) { return !c; }).length;
  if (completions.length >= 4 && missedCount >= 2) {
    recommendations.push('You\u2019ve missed ' + missedCount + ' of your last ' + completions.length + ' scheduled workouts. Consider an easier session today, or use the time options above to fit in a shorter one.');
  }
  const recentSteps = getRecentStepsEntries(5);
  if (recentSteps.length >= 3) {
    const avg = recentSteps.reduce(function(a, b) { return a + b; }, 0) / recentSteps.length;
    const latest = recentSteps[recentSteps.length - 1];
    if (latest < avg * 0.5) {
      recommendations.push('Your recent step count has dropped well below your average \u2014 this can be a sign of fatigue. Prioritize rest today if you\u2019re feeling run down.');
    }
  }
  return recommendations;
}

function computeProgramProgress() {
  const totalWeeks = state.programLength || 8;
  const orderedDays = getOrderedDayKeys();

  let completedWorkouts = 0;
  let totalScheduledWorkouts = 0;

  for (let w = 1; w <= totalWeeks; w++) {
    orderedDays.forEach(function(dayKey) {
      const dayDef = state.activePlan[dayKey];
      if (dayDef.rest) return;
      totalScheduledWorkouts++;
      if (w <= state.week) {
        if (isDayComplete(dayKey, w)) completedWorkouts++;
      }
    });
  }

  const percentComplete = totalScheduledWorkouts > 0
    ? Math.round((completedWorkouts / totalScheduledWorkouts) * 100)
    : 0;
  const remainingWorkouts = Math.max(0, totalScheduledWorkouts - completedWorkouts);
  const estimatedCompletionDate = state.cycleStartDate ? getTargetDateForWeek(state.cycleStartDate, totalWeeks + 1) : null;

  return {
    percentComplete: percentComplete,
    currentWeek: state.week,
    totalWeeks: totalWeeks,
    completedWorkouts: completedWorkouts,
    remainingWorkouts: remainingWorkouts,
    estimatedCompletionDate: estimatedCompletionDate
  };
}

function parseSchemeForVolume(scheme) {
  const rangeMatch = (scheme || '').match(/(\d+)\s*x\s*(\d+)\s*-\s*(\d+)/);
  if (rangeMatch) {
    return { sets: parseInt(rangeMatch[1], 10), reps: (parseInt(rangeMatch[2], 10) + parseInt(rangeMatch[3], 10)) / 2 };
  }
  const match = (scheme || '').match(/(\d+)\s*x\s*(\d+)/);
  if (!match) return null;
  return { sets: parseInt(match[1], 10), reps: parseInt(match[2], 10) };
}

function computeWeeklySummary() {
  const week = state.week;
  const cycle = state.viewingCycle;
  const orderedDays = getOrderedDayKeys();

  let scheduledCount = 0;
  let completedCount = 0;
  let totalVolume = 0;
  const stepsThisWeek = [];
  const personalRecords = [];

  orderedDays.forEach(function(dayKey) {
    const day = state.activePlan[dayKey];
    const stepsE = getEntry(dayKey, '__steps__', week, cycle);
    if (stepsE && stepsE.weight) stepsThisWeek.push(parseFloat(stepsE.weight));
    if (day.rest) return;

    scheduledCount++;
    if (isDayComplete(dayKey, week)) completedCount++;

    (day.exerciseIds || []).forEach(function(exId) {
      const ex = exerciseLibrary[exId];
      if (!ex || ex.noWeight) return;
      const entry = getEntry(dayKey, exId, week, cycle);
      if (entry && entry.weight) {
        const parsed = parseSchemeForVolume(ex.scheme);
        if (parsed) totalVolume += parseFloat(entry.weight) * parsed.sets * parsed.reps;
        const allEntries = getAllEntriesForExercise(exId);
        const maxEver = allEntries.reduce(function(m, e) { return Math.max(m, e.weight); }, -Infinity);
        if (maxEver > -Infinity && parseFloat(entry.weight) >= maxEver) {
          personalRecords.push({ exId: exId, name: ex.name, weight: parseFloat(entry.weight) });
        }
      }
    });
  });

  const consistency = scheduledCount > 0 ? Math.round((completedCount / scheduledCount) * 100) : null;
  const avgSteps = stepsThisWeek.length > 0
    ? Math.round(stepsThisWeek.reduce(function(a, b) { return a + b; }, 0) / stepsThisWeek.length)
    : null;

  return {
    workoutsCompleted: completedCount,
    scheduledCount: scheduledCount,
    consistency: consistency,
    totalVolume: Math.round(totalVolume),
    avgSteps: avgSteps,
    personalRecords: personalRecords
  };
}

const DAILY_ADAPT_KEY = 'workout-daily-adapt-v1';

function loadDailyAdaptState() {
  try {
    const raw = localStorage.getItem(DAILY_ADAPT_KEY);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    return (parsed && typeof parsed === 'object') ? parsed : {};
  } catch (e) {
    return {};
  }
}

function saveDailyAdaptState(obj) {
  try {
    localStorage.setItem(DAILY_ADAPT_KEY, JSON.stringify(obj));
  } catch (e) {}
}

function dailyAdaptKeyFor(dayKey) {
  return todayStr() + '::' + state.viewingCycle + '::' + state.week + '::' + dayKey;
}

function getTodaysAdaptChoice(dayKey) {
  const all = loadDailyAdaptState();
  return all[dailyAdaptKeyFor(dayKey)] || null;
}

function setTodaysAdaptChoice(dayKey, choice) {
  const all = loadDailyAdaptState();
  const key = dailyAdaptKeyFor(dayKey);
  if (!choice || choice === 'planned') {
    delete all[key];
  } else {
    all[key] = choice;
  }
  saveDailyAdaptState(all);
  const today = todayStr();
  Object.keys(all).forEach(function(k) {
    if (k.indexOf(today + '::') !== 0) delete all[k];
  });
  saveDailyAdaptState(all);
}

const ADAPT_TIME_BUDGETS = { '15min': 15, '30min': 30, '45min': 45 };

const compoundPatterns = [
  'squat', 'deadlift', 'rdl', 'press', 'row', 'pulldown', 'pull_up', 'pullup',
  'hip_thrust', 'lunge', 'chin_up', 'chinup', 'clean', 'thrust'
];
const accessoryPatterns = [
  'curl', 'raise', 'extension', 'kickback', 'fly', 'flye', 'crunch',
  'plank', 'lateral_raise', 'rear_delt', 'face_pull',
  'woodchop', 'rotation', 'shrug', 'abductor', 'adductor'
];

function classifyExerciseForAdaptation(exId) {
  const ex = exerciseLibrary[exId];
  if (!ex) return 'accessory';
  const combined = (exId + ' ' + (ex.name || '')).toLowerCase();
  for (let i = 0; i < compoundPatterns.length; i++) { if (combined.indexOf(compoundPatterns[i]) !== -1) return 'compound'; }
  for (let i = 0; i < accessoryPatterns.length; i++) { if (combined.indexOf(accessoryPatterns[i]) !== -1) return 'accessory'; }
  return 'accessory';
}

function estimateExerciseMinutes(exId) {
  const ex = exerciseLibrary[exId];
  const scheme = ex ? ex.scheme : null;
  const match = (scheme || '').match(/(\d+)\s*x\s*(\d+)/);
  const sets = match ? parseInt(match[1], 10) : 3;
  return 1 + (sets * 1.5);
}

const DAILY_ADAPT_FIXED_OVERHEAD_MINUTES = 10;

function adaptWorkoutToTime(day, budgetMinutes) {
  if (!day.exerciseIds || day.exerciseIds.length === 0) {
    return { includedIds: [], cutIds: [], estimatedMinutes: DAILY_ADAPT_FIXED_OVERHEAD_MINUTES };
  }
  const items = day.exerciseIds.map(function(exId, idx) {
    return { exId: exId, idx: idx, minutes: estimateExerciseMinutes(exId), type: classifyExerciseForAdaptation(exId) };
  });
  const totalNeeded = DAILY_ADAPT_FIXED_OVERHEAD_MINUTES + items.reduce(function(a, i) { return a + i.minutes; }, 0);
  if (totalNeeded <= budgetMinutes) {
    return { includedIds: day.exerciseIds.slice(), cutIds: [], estimatedMinutes: totalNeeded };
  }
  const accessoryIndices = items.filter(function(i) { return i.type === 'accessory'; }).map(function(i) { return i.idx; }).sort(function(a, b) { return b - a; });
  const compoundIndices = items.filter(function(i) { return i.type === 'compound'; }).map(function(i) { return i.idx; }).sort(function(a, b) { return b - a; });
  const cutOrder = accessoryIndices.concat(compoundIndices);
  const cutSet = {};
  let cutCount = 0;
  let runningMinutes = totalNeeded;
  for (let i = 0; i < cutOrder.length; i++) {
    const idx = cutOrder[i];
    if (runningMinutes <= budgetMinutes) break;
    if (items.length - cutCount <= 1) break;
    cutSet[idx] = true;
    cutCount++;
    runningMinutes -= items[idx].minutes;
  }
  const includedIds = items.filter(function(i) { return !cutSet[i.idx]; }).map(function(i) { return i.exId; });
  const cutIds = items.filter(function(i) { return !!cutSet[i.idx]; }).map(function(i) { return i.exId; });
  return { includedIds: includedIds, cutIds: cutIds, estimatedMinutes: runningMinutes };
}

function getAdaptedDay(dayKey) {
  const baseDay = getEffectiveDay(dayKey);
  if (!baseDay || baseDay.rest) return { day: baseDay, cutIds: [], choice: null };
  const choice = getTodaysAdaptChoice(dayKey);
  if (!choice || !ADAPT_TIME_BUDGETS[choice]) {
    return { day: baseDay, cutIds: [], choice: null };
  }
  const budget = ADAPT_TIME_BUDGETS[choice];
  const result = adaptWorkoutToTime(baseDay, budget);
  const adaptedDay = Object.assign({}, baseDay, { exerciseIds: result.includedIds });
  return { day: adaptedDay, cutIds: result.cutIds, choice: choice, estimatedMinutes: result.estimatedMinutes };
}

const CUSTOM_EXERCISES_KEY = 'workout-custom-exercises-v1';
const OPTIONAL_HISTORY_KEY = 'workout-optional-history-v1';
const OPTIONAL_PREFS_KEY = 'workout-optional-prefs-v1';

function loadCustomExercises() {
  try {
    const raw = localStorage.getItem(CUSTOM_EXERCISES_KEY);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    return (parsed && typeof parsed === 'object') ? parsed : {};
  } catch (e) { return {}; }
}
function saveCustomExercises(obj) {
  try { localStorage.setItem(CUSTOM_EXERCISES_KEY, JSON.stringify(obj)); } catch (e) {}
}

function loadOptionalHistory() {
  try {
    const raw = localStorage.getItem(OPTIONAL_HISTORY_KEY);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    return (parsed && typeof parsed === 'object') ? parsed : {};
  } catch (e) { return {}; }
}
function saveOptionalHistory(obj) {
  try { localStorage.setItem(OPTIONAL_HISTORY_KEY, JSON.stringify(obj)); } catch (e) {}
}

function optionalDayKey(dayKey, cycle, week) {
  return dayKey + '::c' + cycle + '::w' + week;
}

function loadOptionalPrefs() {
  try {
    const raw = localStorage.getItem(OPTIONAL_PREFS_KEY);
    if (!raw) return { favorites: [], recentlyUsed: [] };
    const parsed = JSON.parse(raw);
    return {
      favorites: Array.isArray(parsed.favorites) ? parsed.favorites : [],
      recentlyUsed: Array.isArray(parsed.recentlyUsed) ? parsed.recentlyUsed : []
    };
  } catch (e) { return { favorites: [], recentlyUsed: [] }; }
}
function saveOptionalPrefs(prefs) {
  try { localStorage.setItem(OPTIONAL_PREFS_KEY, JSON.stringify(prefs)); } catch (e) {}
}

function generateCustomExerciseId(name, existingIds) {
  const base = 'custom_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  let candidate = base || 'custom_exercise';
  let suffix = 1;
  while (existingIds.indexOf(candidate) !== -1) {
    candidate = base + '_' + suffix;
    suffix++;
  }
  return candidate;
}

function generateSearchKeywords(exerciseName) {
  return exerciseName.trim() + ' proper form';
}

function normalizeNameForDuplicateCheck(name) {
  return (name || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

function findDuplicateExercise(name) {
  const normalized = normalizeNameForDuplicateCheck(name);
  if (!normalized) return null;
  const customLib = loadCustomExercises();
  const builtInMatch = Object.keys(exerciseLibrary).find(function(id) {
    return normalizeNameForDuplicateCheck(exerciseLibrary[id].name) === normalized;
  });
  if (builtInMatch) return { id: builtInMatch, isCustom: false, name: exerciseLibrary[builtInMatch].name };
  const customMatch = Object.keys(customLib).find(function(id) {
    return !customLib[id].archived && normalizeNameForDuplicateCheck(customLib[id].name) === normalized;
  });
  if (customMatch) return { id: customMatch, isCustom: true, name: customLib[customMatch].name };
  return null;
}

function getAnyExerciseDef(exId) {
  if (exerciseLibrary[exId]) return exerciseLibrary[exId];
  const customLib = loadCustomExercises();
  if (customLib[exId]) {
    const c = customLib[exId];
    return { name: c.name, muscle: c.muscle, scheme: '3 x 10', link: YT(c.searchKeywords || generateSearchKeywords(c.name)), noWeight: false, isCustom: true };
  }
  return null;
}

function createCustomExercise(name, muscle, equipment, searchOverride, notes) {
  const customLib = loadCustomExercises();
  const existingIds = Object.keys(exerciseLibrary).concat(Object.keys(customLib));
  const id = generateCustomExerciseId(name, existingIds);
  customLib[id] = {
    name: name.trim(),
    muscle: muscle,
    equipment: equipment || null,
    searchKeywords: (searchOverride && searchOverride.trim()) ? searchOverride.trim() : generateSearchKeywords(name),
    notes: notes || '',
    favorite: false,
    archived: false,
    dateCreated: todayStr()
  };
  saveCustomExercises(customLib);
  return id;
}

function archiveCustomExercise(exId) {
  const customLib = loadCustomExercises();
  if (customLib[exId]) { customLib[exId].archived = true; saveCustomExercises(customLib); }
}
function restoreCustomExercise(exId) {
  const customLib = loadCustomExercises();
  if (customLib[exId]) { customLib[exId].archived = false; saveCustomExercises(customLib); }
}
function toggleFavorite(exId) {
  const prefs = loadOptionalPrefs();
  const idx = prefs.favorites.indexOf(exId);
  if (idx !== -1) prefs.favorites.splice(idx, 1);
  else prefs.favorites.unshift(exId);
  saveOptionalPrefs(prefs);
}
function markRecentlyUsed(exId) {
  const prefs = loadOptionalPrefs();
  const idx = prefs.recentlyUsed.indexOf(exId);
  if (idx !== -1) prefs.recentlyUsed.splice(idx, 1);
  prefs.recentlyUsed.unshift(exId);
  prefs.recentlyUsed = prefs.recentlyUsed.slice(0, 10);
  saveOptionalPrefs(prefs);
}

function buildSortedExerciseList(searchQuery, todaysExerciseIds) {
  const customLib = loadCustomExercises();
  const prefs = loadOptionalPrefs();
  const favSet = {}; prefs.favorites.forEach(function(id) { favSet[id] = true; });
  const todaySet = {}; (todaysExerciseIds || []).forEach(function(id) { todaySet[id] = true; });

  const query = (searchQuery || '').trim().toLowerCase();
  function matches(id) {
    if (!query) return true;
    const def = getAnyExerciseDef(id);
    return def && def.name.toLowerCase().indexOf(query) !== -1;
  }

  const seen = {};
  const ordered = [];
  prefs.favorites.forEach(function(id) {
    if (!seen[id] && getAnyExerciseDef(id) && matches(id)) { ordered.push(id); seen[id] = true; }
  });
  prefs.recentlyUsed.forEach(function(id) {
    if (!seen[id] && getAnyExerciseDef(id) && matches(id)) { ordered.push(id); seen[id] = true; }
  });
  (todaysExerciseIds || []).forEach(function(id) {
    if (!seen[id] && matches(id)) { ordered.push(id); seen[id] = true; }
  });
  Object.keys(exerciseLibrary).filter(function(id) { return !seen[id] && matches(id); })
    .sort(function(a, b) { return exerciseLibrary[a].name.localeCompare(exerciseLibrary[b].name); })
    .forEach(function(id) { ordered.push(id); seen[id] = true; });
  Object.keys(customLib).filter(function(id) { return !customLib[id].archived && !seen[id] && matches(id); })
    .sort(function(a, b) { return customLib[a].name.localeCompare(customLib[b].name); })
    .forEach(function(id) { ordered.push(id); seen[id] = true; });

  return ordered;
}

function getOptionalEntriesForExercise(exId) {
  const history = loadOptionalHistory();
  const results = [];
  Object.keys(history).forEach(function(dayKeyCombo) {
    const parts = dayKeyCombo.split('::');
    const dayKey = parts[0];
    const cycle = parts[1] ? parseInt(parts[1].replace('c', ''), 10) : 1;
    const week = parts[2] ? parseInt(parts[2].replace('w', ''), 10) : 1;
    (history[dayKeyCombo] || []).forEach(function(entry) {
      if (entry.exId === exId) results.push({ dayKey: dayKey, cycle: cycle, week: week, weight: parseFloat(entry.weight), date: entry.date });
    });
  });
  results.sort(function(a, b) { return (a.cycle - b.cycle) || (a.week - b.week) || (dayOrderIndex(a.dayKey) - dayOrderIndex(b.dayKey)); });
  return results;
}

function logOptionalExercise(dayKey, exId, weight) {
  const history = loadOptionalHistory();
  const key = optionalDayKey(dayKey, state.viewingCycle, state.week);
  if (!history[key]) history[key] = [];
  const existing = history[key].filter(function(e) { return e.exId === exId; });
  if (existing.length > 0) {
    existing[0].weight = weight;
    existing[0].date = todayStr();
  } else {
    const entry = { id: 'opt_' + Date.now() + '_' + Math.floor(Math.random() * 100000), exId: exId, weight: weight, date: todayStr() };
    history[key].push(entry);
  }
  saveOptionalHistory(history);
  markRecentlyUsed(exId);
}

function updateOptionalExerciseWeight(entryId, dayKey, weight) {
  const history = loadOptionalHistory();
  const key = optionalDayKey(dayKey, state.viewingCycle, state.week);
  if (history[key]) {
    const entry = history[key].filter(function(e) { return e.id === entryId; })[0];
    if (entry) { entry.weight = weight; entry.date = todayStr(); saveOptionalHistory(history); }
  }
}

function removeOptionalExerciseLogById(entryId, dayKey) {
  const key = optionalDayKey(dayKey, state.viewingCycle, state.week);
  const history = loadOptionalHistory();
  if (history[key]) {
    history[key] = history[key].filter(function(e) { return e.id !== entryId; });
    if (history[key].length === 0) delete history[key];
    saveOptionalHistory(history);
  }
}

function getTodaysOptionalEntries(dayKey) {
  const history = loadOptionalHistory();
  const key = optionalDayKey(dayKey, state.viewingCycle, state.week);
  const list = history[key] || [];
  let needsSave = false;
  list.forEach(function(e, i) {
    if (!e.id) { e.id = 'legacy_' + key + '_' + i; needsSave = true; }
  });
  if (needsSave) { history[key] = list; saveOptionalHistory(history); }
  return list;
}

function isExerciseAlreadyLoggedToday(dayKey, exId) {
  const entries = getTodaysOptionalEntries(dayKey);
  return entries.some(function(e) { return e.exId === exId; });
}

function getOptionalSuggestion(exId) {
  const entries = getOptionalEntriesForExercise(exId);
  if (entries.length === 0) return 'Log a weight to get a suggestion next time';
  const last = entries[entries.length - 1];
  return 'Try ' + (last.weight + 5) + ' lbs (up from your last logged ' + last.weight + ' lbs)';
}

  ['chest','back','shoulders','biceps','triceps','legs_quad','legs_posterior','legs_general','calves','core'].forEach(function(m) {

function openOptionalExerciseSelector(dayKey) {

  overlay.style.alignItems = 'center';
  const sheet = document.createElement('div');
  sheet.className = 'modal-sheet';
  sheet.style.cssText = 'border-radius:20px;max-width:440px;margin:0 auto;max-height:80vh;';
  sheet.innerHTML = '<h3>Add Optional Exercise</h3><div class="modal-sub">Search every exercise in the app, or create your own. Already-added exercises for this day are marked.</div>';

  const searchInput = document.createElement('input');
  searchInput.type = 'text';
  searchInput.placeholder = 'Search exercises...';
  searchInput.style.cssText = 'width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:10px;';
  sheet.appendChild(searchInput);

  const createNewBtn = document.createElement('button');
  createNewBtn.textContent = '+ Create New Exercise';
  createNewBtn.style.cssText = 'width:100%;padding:10px;background:#eef3fb;border:1px solid #b9cdf0;color:#1c3a7a;border-radius:8px;font-size:13px;font-weight:700;margin-bottom:12px;';
  createNewBtn.onclick = function() {
    document.body.removeChild(overlay);
    openCreateExerciseModal(function(newId) {
      addOptionalExerciseToToday(dayKey, newId);
    });
  };
  sheet.appendChild(createNewBtn);

  const listWrap = document.createElement('div');

  sheet.appendChild(listWrap);

  function renderList() {
    listWrap.innerHTML = '';
    const todaysDay = getAdaptedDay(dayKey).day;
    const todaysIds = (todaysDay && !todaysDay.rest) ? (todaysDay.exerciseIds || []) : [];
    const ids = buildSortedExerciseList(searchInput.value, todaysIds).slice(0, 40);
    if (ids.length === 0) {
      const nd = document.createElement('div');
      nd.style.cssText = 'font-size:13px;color:#999;text-align:center;padding:16px 0;';

      const nameEl = document.createElement('div');
      nameEl.className = 'swap-option-name';
      nameEl.textContent = def.name + (prefs.favorites.indexOf(exId) !== -1 ? ' \u2b50' : '');
      row.appendChild(nameEl);

  renderList();

  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close';
  closeBtn.textContent = 'Cancel';
  closeBtn.onclick = function() { document.body.removeChild(overlay); };
  sheet.appendChild(closeBtn);

  overlay.appendChild(sheet);
  overlay.onclick = function(e) { if (e.target === overlay) document.body.removeChild(overlay); };
  document.body.appendChild(overlay);
}

function addOptionalExerciseToToday(dayKey, exId) {
  if (isExerciseAlreadyLoggedToday(dayKey, exId)) { render(); return; }

  logOptionalExercise(dayKey, exId, startingWeight);

}

function linearRegression(xs, ys) {
  const n = xs.length;
  const sumX = xs.reduce(function(a, b) { return a + b; }, 0);
  const sumY = ys.reduce(function(a, b) { return a + b; }, 0);
  const sumXY = xs.reduce(function(a, x, i) { return a + x * ys[i]; }, 0);
  const sumXX = xs.reduce(function(a, x) { return a + x * x; }, 0);
  const denom = (n * sumXX - sumX * sumX) || 1;
  const slope = (n * sumXY - sumX * sumY) / denom;
  const intercept = (sumY - slope * sumX) / n;
  return { slope: slope, intercept: intercept };
}

function buildStreakAndPRInsights(points, higherIsBetter) {
  const valid = points.filter(function(p) { return p.val !== null && !isNaN(p.val); });
  if (valid.length < 2) return [];
  const insights = [];

  let streak = 0;
  for (let i = points.length - 1; i >= 0; i--) {
    if (points[i].val !== null && !isNaN(points[i].val)) streak++;
    else break;
  }
  insights.push('Current logging streak: ' + streak + ' consecutive week' + (streak === 1 ? '' : 's'));

  let biggestChange = 0;
  let biggestChangeLabel = '';
  for (let i = 1; i < valid.length; i++) {
    const delta = valid[i].val - valid[i - 1].val;
    if (Math.abs(delta) > Math.abs(biggestChange)) {
      biggestChange = delta;
      biggestChangeLabel = valid[i - 1].label + ' \u2192 ' + valid[i].label;
    }
  }
  if (biggestChange !== 0) {
    if (higherIsBetter === null || higherIsBetter === undefined) {
      insights.push('Biggest single change: ' + (biggestChange > 0 ? '+' : '') + biggestChange.toFixed(1) + ' (' + biggestChangeLabel + ')');
    } else {
      const magnitude = higherIsBetter ? biggestChange : -biggestChange;
      if (magnitude > 0) {
        insights.push('Biggest single jump: +' + magnitude.toFixed(1) + ' (' + biggestChangeLabel + ')');
      }
    }
  }

  if (higherIsBetter === true) {
    let bestVal = -Infinity, bestIdx = -1;
    valid.forEach(function(p, i) { if (p.val > bestVal) { bestVal = p.val; bestIdx = i; } });
    const weeksSincePR = (valid.length - 1) - bestIdx;
    if (weeksSincePR === 0) {
      insights.push('Your latest entry is a new personal best!');
    } else {
      insights.push('Weeks since personal best: ' + weeksSincePR);
    }
  }

  const avg = valid.reduce(function(a, p) { return a + p.val; }, 0) / valid.length;
  insights.push('Average over this range: ' + avg.toFixed(1));

  return insights;
}

    h.textContent = title;
    headerRow.appendChild(h);
    const btnGroup = document.createElement('div');
    btnGroup.style.cssText = 'display:flex;gap:6px;';
    const trendBtn = document.createElement('button');
    trendBtn.textContent = isTrendLineOn(baseChartId) ? 'Trend: On' : 'Trend: Off';
    trendBtn.style.cssText = 'font-size:11px;font-weight:600;padding:5px 9px;border-radius:8px;border:1px solid ' + (isTrendLineOn(baseChartId) ? '#b9cdf0' : '#ddd') + ';background:' + (isTrendLineOn(baseChartId) ? '#eef3fb' : '#fff') + ';color:' + (isTrendLineOn(baseChartId) ? '#1c3a7a' : '#1c1c1a') + ';';
    trendBtn.onclick = function() { toggleTrendLine(baseChartId); };
    btnGroup.appendChild(trendBtn);
    if (!isFullscreen) {
      const expandBtn = document.createElement('button');
      expandBtn.textContent = 'Expand';
      expandBtn.style.cssText = 'font-size:11px;font-weight:600;padding:5px 9px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#1c1c1a;';
      expandBtn.onclick = function() {
        const insightsFn = function() { return buildStreakAndPRInsights(filterPointsByRange(points, graphPrefs.range), showPB === true ? true : (showPB === false ? null : showPB)); };
        openFullscreenChart(title, points, color, showPB, insightsFn);
      };
      btnGroup.appendChild(expandBtn);
    }
    headerRow.appendChild(btnGroup);
    wrap.appendChild(headerRow);
  }

  const filteredPoints = filterPointsByRange(points, graphPrefs.range);

  const valid = filteredPoints.filter(function(p) { return p.val !== null && !isNaN(p.val); });
  if (valid.length < 2) {
    const nd = document.createElement('div');
    nd.className = 'no-data';
    if (points.length > 0 && filteredPoints.length === 0) {
      nd.textContent = 'No data in this time range \u2014 try All Time';
    } else {
      nd.textContent = valid.length === 0 ? 'No data entered yet' : 'Need at least 2 data points to graph';
    }
    wrap.appendChild(nd);
    return wrap;
  }

  const W = isFullscreen ? (isLandscape ? 640 : 380) : 320;
  const H = isFullscreen ? (isLandscape ? 320 : 260) : 140;
  const pad = isFullscreen ? 40 : 30;
  const vals = valid.map(function(p) { return p.val; });
  const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  const range = max - min || 1;
  const stepX = (W - pad * 2) / (filteredPoints.length - 1);

  let pbIndex = -1;
  if (showPB) {
    let bestVal = -Infinity;
    filteredPoints.forEach(function(p, i) {
      if (p.val !== null && !isNaN(p.val) && p.val > bestVal) { bestVal = p.val; pbIndex = i; }
    });
  }

  let pathD = '', dots = '', labels = '';
  filteredPoints.forEach(function(p, i) {
    if (p.val === null || isNaN(p.val)) return;
    const x = pad + i * stepX;
    const y = H - pad - ((p.val - min) / range) * (H - pad * 2);
    pathD += (pathD ? 'L' : 'M') + x + ',' + y + ' ';
    const isPB = showPB && i === pbIndex;
    dots += '<circle class="chart-dot" data-idx="' + i + '" cx="' + x + '" cy="' + y + '" r="' + (isPB ? 6 : 4) + '" fill="' + (isPB ? '#ffd700' : color) + '" stroke="' + (isPB ? '#a1780a' : 'none') + '" stroke-width="' + (isPB ? 2 : 0) + '" style="cursor:pointer;"/>';
    if (isPB) {
      labels += '<text x="' + x + '" y="' + (y - 18) + '" font-size="12" text-anchor="middle">\u2b50</text>';
    }
    labels += '<text x="' + x + '" y="' + (H - 6) + '" font-size="10" fill="#999" text-anchor="middle">' + p.label + '</text>';
    labels += '<text x="' + x + '" y="' + (y - 10) + '" font-size="11" fill="#333" text-anchor="middle" font-weight="600">' + p.val + '</text>';
  });

  let trendPath = '';
  if (isTrendLineOn(baseChartId)) {
    const xs = [];
    const ys = [];
    filteredPoints.forEach(function(p, i) { if (p.val !== null && !isNaN(p.val)) { xs.push(i); ys.push(p.val); } });
    if (xs.length >= 2) {
      const reg = linearRegression(xs, ys);
      const firstIdx = xs[0], lastIdx = xs[xs.length - 1];
      const yStart = reg.slope * firstIdx + reg.intercept;
      const yEnd = reg.slope * lastIdx + reg.intercept;
      const xStart = pad + firstIdx * stepX;
      const xEnd = pad + lastIdx * stepX;
      const plotY = function(v) { return H - pad - ((v - min) / range) * (H - pad * 2); };
      trendPath = '<line x1="' + xStart + '" y1="' + plotY(yStart) + '" x2="' + xEnd + '" y2="' + plotY(yEnd) + '" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4"/>';
    }
  }

  const svgId = chartId + '_svg';
  const svgWrapper = document.createElement('div');
  svgWrapper.innerHTML = '<svg class="chart" id="' + svgId + '" viewBox="0 0 ' + W + ' ' + H + '">' + trendPath + '<path d="' + pathD + '" fill="none" stroke="' + color + '" stroke-width="2.5"/>' + dots + labels + '</svg>';
  wrap.appendChild(svgWrapper.firstChild);
  const first = valid[0].val, last = valid[valid.length - 1].val;
  const diff = (last - first).toFixed(1);
  const pctChange = first !== 0 ? (((last - first) / Math.abs(first)) * 100).toFixed(1) : null;
  const isUp = last > first, isDown = last < first;
  const arrow = isUp ? '\u2191' : (isDown ? '\u2193' : '\u2192');
  const changeColor = isUp ? '#256029' : (isDown ? '#a11c56' : '#888');
  const stats = document.createElement('div');
  stats.className = 'chart-stats';
  stats.innerHTML = '<div>Start: <strong>' + first + '</strong></div><div>Latest: <strong>' + last + '</strong></div>' +
    '<div style="color:' + changeColor + ';">Change: <strong>' + arrow + ' ' + (diff > 0 ? '+' : '') + diff + (pctChange !== null ? ' (' + (pctChange > 0 ? '+' : '') + pctChange + '%)' : '') + '</strong></div>';
  wrap.appendChild(stats);

  const detailBox = document.createElement('div');
  detailBox.style.cssText = 'font-size:12px;color:#1c3a7a;background:#eef3fb;border-radius:8px;padding:0;margin-top:0;max-height:0;overflow:hidden;transition:all 0.15s ease;';
  wrap.appendChild(detailBox);

  setTimeout(function() {
    const svgEl = wrap.querySelector('#' + svgId);
    if (!svgEl) return;
    svgEl.querySelectorAll('.chart-dot').forEach(function(dotEl) {
      dotEl.addEventListener('click', function() {
        const idx = parseInt(dotEl.getAttribute('data-idx'), 10);
        const p = filteredPoints[idx];
        if (!p) return;
        const isPBHere = showPB && idx === pbIndex;
        detailBox.innerHTML = '<div style="padding:8px 10px;">' + p.label + ': <strong>' + p.val + '</strong>' + (isPBHere ? ' \u2b50 Personal Best' : '') + '</div>';
        detailBox.style.maxHeight = '60px';
        detailBox.style.marginTop = '8px';
      });
    });
  }, 0);

  return wrap;
}

function deleteCheckpoint(cpKey) {
  const step1 = confirm('Remove this checkpoint entry? This cannot be undone.');
  if (!step1) return;

  state.checkpoints[cpKey] = {};
  saveState();
  render();
  toast('Checkpoint removed');
}

  graphLabel0.className = 'section-label';
  graphLabel0.textContent = 'Graphs';
  content.appendChild(graphLabel0);
  renderGraphControls(content);

  const stepsEntries = [];
  Object.keys(state.activePlan).forEach(function(dayKey) {
    for (let c = 1; c <= state.cycle; c++) {
      for (let w = 1; w <= (state.programLength || 8); w++) {
        const e = getEntry(dayKey, '__steps__', w, c);
        if (e && e.weight) stepsEntries.push({ week: w, cycle: c, dayKey: dayKey, weight: parseFloat(e.weight) });
      }
    }
  });
  if (stepsEntries.length >= 2) {
    stepsEntries.sort(function(a, b) { return (a.cycle - b.cycle) || (a.week - b.week) || (dayOrderIndex(a.dayKey) - dayOrderIndex(b.dayKey)); });
    const stepPoints = stepsEntries.map(function(e) {
      const dayLabel = state.activePlan[e.dayKey] ? state.activePlan[e.dayKey].label.split(' ')[0] : e.dayKey;
      return { label: (state.cycle > 1 ? ('C' + e.cycle + 'W' + e.week) : ('Wk' + e.week)) + ' ' + dayLabel, val: e.weight, cycle: e.cycle, week: e.week };
    });
    content.appendChild(buildLineChart('Daily Steps', stepPoints, '#3a7ae8', true));
  }
  const seen = {};
  Object.keys(exerciseLibrary).forEach(function(exId) {
    const entries = getAllEntriesForExercise(exId);

    seen[exId] = true;

      content.appendChild(card);

    entries.sort(function(a, b) { return (a.cycle - b.cycle) || (a.week - b.week) || (dayOrderIndex(a.dayKey) - dayOrderIndex(b.dayKey)); });
    const points = entries.map(function(e) {
      const dayLabel = state.activePlan[e.dayKey] ? state.activePlan[e.dayKey].label.split(' ')[0] : e.dayKey;
      return { label: (state.cycle > 1 ? ('C' + e.cycle + 'W' + e.week) : ('Wk' + e.week)) + ' ' + dayLabel, val: e.weight, cycle: e.cycle, week: e.week };
    });
    content.appendChild(buildLineChart(exerciseLibrary[exId].name, points, '#e8722c', true));
  });
  if (Object.keys(seen).length === 0) {
    const nd = document.createElement('div');
    nd.className = 'rest-note';
    nd.textContent = 'No weighted exercises logged yet.';
    content.appendChild(nd);
  }

  const customExerciseIds = computeAllCustomExerciseIds();

      card.className = 'progress-ex-card';
      const h = document.createElement('h4');
      h.textContent = def.name + ' (custom)';

      nd.className = 'no-data';
      nd.textContent = '1 entry logged (' + entries[0].date + ': ' + entries[0].weight + ' lbs) - need 2+ to graph';
      card.appendChild(nd);
      content.appendChild(card);
      return;
    }
    const points = entries.map(function(e, i) {
      return { label: e.date.slice(5), val: e.weight, cycle: 1, week: i + 1 };
    });
    content.appendChild(buildLineChart(def.name + ' (custom)', points, '#c2427a', true));
  });

  const allOptionalIds = getAllOptionallyLoggedExerciseIds();
  allOptionalIds.forEach(function(exId) {

    if (entries.length === 0) return;

    if (entries.length < 2) {
      const card = document.createElement('div');
      card.className = 'progress-ex-card';
      const h = document.createElement('h4');
      h.textContent = def.name + ' (optional)';
      card.appendChild(h);
      const nd = document.createElement('div');
      nd.className = 'no-data';
      nd.textContent = '1 entry logged (' + entries[0].date + ': ' + entries[0].weight + ' lbs) - need 2+ to graph';
      card.appendChild(nd);
      content.appendChild(card);
      return;
    }
    const points = entries.map(function(e, i) {
      return { label: e.date.slice(5), val: e.weight, cycle: 1, week: i + 1 };
    });
    content.appendChild(buildLineChart(def.name + ' (optional)', points, '#3a7ae8', true));
  });
  container.appendChild(content);
}

  const quickLabel = document.createElement('div');
  quickLabel.className = 'section-label';
  quickLabel.textContent = 'Quick Add to ' + (state.activePlan[viewDay] ? state.activePlan[viewDay].label : viewDay);
  content.appendChild(quickLabel);

  const quickWrap = document.createElement('div');
  quickWrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;';
  proteinPresets.forEach(function(preset) {
    const btn = document.createElement('button');
    btn.textContent = preset.name + ' \u00b7 ' + preset.grams + 'g';
    btn.style.cssText = 'padding:10px 14px;background:#fff;border:1px solid #e6e4dc;border-radius:20px;font-size:13px;font-weight:600;color:#1c1c1a;';
    btn.onclick = function() {
      addProteinEntry(viewDay, preset.name, preset.grams);
      render();
      toast('Added ' + preset.grams + 'g');
    };
    quickWrap.appendChild(btn);
  });
  content.appendChild(quickWrap);

  const customLabel = document.createElement('div');
  customLabel.className = 'section-label';
  customLabel.textContent = 'Add Custom Food';
  content.appendChild(customLabel);

  const customCard = document.createElement('div');
  customCard.className = 'card';
  customCard.innerHTML =
    '<div style="display:flex;gap:8px;">' +
    '<input id="custom-food-name" type="text" placeholder="Food name" style="flex:2;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;">' +
    '<input id="custom-food-grams" type="number" inputmode="numeric" placeholder="Grams" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;">' +
    '</div>';
  const addBtn = document.createElement('button');
  addBtn.textContent = 'Add';
  addBtn.style.cssText = 'width:100%;padding:10px;margin-top:10px;background:#e8722c;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;';
  addBtn.onclick = function() {
    const nameInput = document.getElementById('custom-food-name');
    const gramsInput = document.getElementById('custom-food-grams');
    const grams = parseFloat(gramsInput.value);
    if (!nameInput.value || !grams || grams <= 0) { toast('Enter a food name and grams'); return; }
    addProteinEntry(viewDay, nameInput.value, grams);
    render();
    toast('Added ' + grams + 'g');
  };
  customCard.appendChild(addBtn);
  content.appendChild(customCard);

  const entries = getProteinEntries(viewDay, state.viewingCycle, state.week);
  if (entries.length > 0) {
    const loggedLabel = document.createElement('div');
    loggedLabel.className = 'section-label';
    loggedLabel.textContent = 'Logged for ' + (state.activePlan[viewDay] ? state.activePlan[viewDay].label : viewDay);
    content.appendChild(loggedLabel);
    entries.forEach(function(entry, idx) {
      const row = document.createElement('div');
      row.className = 'card';
      row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:10px 14px;';
      row.innerHTML = '<span style="font-size:14px;">' + entry.name + '</span><span style="font-size:14px;font-weight:700;">' + entry.grams + 'g</span>';
      const delBtn = document.createElement('button');
      delBtn.textContent = 'Remove';
      delBtn.style.cssText = 'font-size:11px;color:#b31942;background:none;border:none;font-weight:600;margin-left:10px;';
      delBtn.onclick = function() {
        removeProteinEntry(viewDay, idx);
        render();
      };
      row.appendChild(delBtn);
      content.appendChild(row);
    });
  } else {
    const nd0 = document.createElement('div');
    nd0.className = 'rest-note';
    nd0.textContent = 'Nothing logged yet for this day.';
    content.appendChild(nd0);
  }

  const graphLabel = document.createElement('div');
  graphLabel.className = 'section-label';
  graphLabel.textContent = 'Protein Trend';
  content.appendChild(graphLabel);
  renderGraphControls(content);

  const allTotals = getAllProteinTotals();
  if (allTotals.length >= 2) {
    allTotals.sort(function(a, b) { return (a.cycle - b.cycle) || (a.week - b.week) || (dayOrderIndex(a.dayKey) - dayOrderIndex(b.dayKey)); });
    const points = allTotals.map(function(e) {
      const dayLabel = state.activePlan[e.dayKey] ? state.activePlan[e.dayKey].label.split(' ')[0] : e.dayKey;
      return { label: (state.cycle > 1 ? ('C' + e.cycle + 'W' + e.week) : ('Wk' + e.week)) + ' ' + dayLabel, val: e.total, cycle: e.cycle, week: e.week };
    });
    content.appendChild(buildLineChart('Daily Protein (g)', points, '#e8722c', true));
  } else {
    const nd = document.createElement('div');
    nd.className = 'rest-note';
    nd.textContent = 'Log protein on 2 or more days to see your trend graph.';
    content.appendChild(nd);
  }

  container.appendChild(content);
}

function renderDayTabs(container) {
  const dt = document.createElement('div');
  dt.className = 'day-tabs';
  dt.style.cssText = 'flex-wrap:nowrap;overflow-x:visible;';
  const daySelectWrap = document.createElement('div');
  daySelectWrap.style.cssText = 'flex:1;min-width:0;';
  const keys = getOrderedDayKeys();
  const daySelect = document.createElement('select');
  daySelect.style.cssText = 'width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ddd;background:#f7f6f2;font-size:14px;font-weight:600;color:#1c1c1a;';
  keys.forEach(function(key) {
    const opt = document.createElement('option');
    opt.value = key;
    const check = isDayComplete(key, state.week) ? ' (Done)' : '';
    opt.textContent = getEffectiveDay(key).label + check;
    if (state.day === key && state.screen === 'day') opt.selected = true;
    daySelect.appendChild(opt);
  });
  daySelect.onchange = function() { state.day = daySelect.value; state.screen = 'day'; saveState(); render(); };
  daySelectWrap.appendChild(daySelect);
  dt.appendChild(daySelectWrap);
  const cb = document.createElement('button');
  cb.className = 'day-tab' + (state.screen === 'checkpoints' ? ' active' : '');
  cb.textContent = 'Checkpoints';
  cb.onclick = function() {
    state.screen = state.screen === 'checkpoints' ? 'day' : 'checkpoints';
    saveState();
    render();
  };
  dt.appendChild(cb);
  const pb = document.createElement('button');
  pb.className = 'day-tab' + (state.screen === 'progress' ? ' active' : '');
  pb.textContent = 'Progress';
  pb.onclick = function() {
    state.screen = state.screen === 'progress' ? 'day' : 'progress';
    saveState();
    render();
  };
  dt.appendChild(pb);
  const tb = document.createElement('button');
  tb.className = 'day-tab' + (state.screen === 'admin' ? ' active' : '');
  tb.textContent = 'Admin';
  tb.onclick = function() {
    state.screen = state.screen === 'admin' ? 'day' : 'admin';
    saveState();
    render();
  };
  dt.appendChild(tb);
  container.appendChild(dt);
}

function renderWeekPicker(container) {
  const header = document.createElement('div');
  header.className = 'header';
  const cycleOptions = [];
  for (let c = 1; c <= state.cycle; c++) cycleOptions.push(c);
  let cycleSelectHtml = '';
  if (cycleOptions.length > 1) {
    cycleSelectHtml = '<select id="cycle-select" style="margin-top:8px;padding:8px 10px;border-radius:8px;border:1px solid #444;background:#2a2a27;color:#d5d4cd;font-size:13px;width:100%;">' +
      cycleOptions.map(function(c) { return '<option value="' + c + '"' + (c === state.viewingCycle ? ' selected' : '') + '>Cycle ' + c + (c === state.cycle ? ' (current)' : '') + '</option>'; }).join('') +
      '</select>';
  }
  header.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:flex-start;">' +
    '<div><h1>' + goalTemplates[state.goal].label + '</h1><div class="sub" id="week-sub"></div></div>' +
    '<button id="protein-toggle-btn" style="flex-shrink:0;padding:8px 14px;background:' + (state.screen === 'protein' ? '#e8722c' : '#2a2a27') + ';color:#fff;border:1px solid ' + (state.screen === 'protein' ? '#e8722c' : '#444') + ';border-radius:8px;font-size:13px;font-weight:600;">Protein</button>' +
    '</div>' +
    cycleSelectHtml + '<div id="week-select-wrap" style="margin-top:10px;"></div>';
  container.appendChild(header);

  const proteinToggleBtn = header.querySelector('#protein-toggle-btn');
  proteinToggleBtn.onclick = function() {
    state.screen = state.screen === 'protein' ? 'day' : 'protein';
    saveState();
    render();
  };

  if (cycleOptions.length > 1) {
    const sel = header.querySelector('#cycle-select');
    sel.onchange = function() { state.viewingCycle = parseInt(sel.value, 10); state.week = 1; saveState(); render(); };
  }
  const weekWrap = header.querySelector('#week-select-wrap');
  const totalWeeks = state.programLength || 8;
  const weekSelect = document.createElement('select');
  weekSelect.style.cssText = 'width:100%;padding:10px 12px;border-radius:8px;border:1px solid #444;background:#2a2a27;color:#d5d4cd;font-size:14px;font-weight:600;';
  for (let i = 1; i <= totalWeeks; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    const check = isWeekComplete(i) ? ' (Done)' : '';
    opt.textContent = 'Week ' + i + check;
    if (state.week === i) opt.selected = true;
    weekSelect.appendChild(opt);
  }
  weekSelect.onchange = function() { state.week = parseInt(weekSelect.value, 10); saveState(); render(); };
  weekWrap.appendChild(weekSelect);
  const viewingLabel = state.viewingCycle !== state.cycle ? ' - viewing past cycle' : '';
  header.querySelector('#week-sub').textContent = 'Cycle ' + state.viewingCycle + ' - Week ' + state.week + ' of ' + totalWeeks + viewingLabel;
  if (state.viewingCycle !== state.cycle) {
    const backBtn = document.createElement('button');
    backBtn.textContent = 'Return to current cycle';
    backBtn.style.cssText = 'margin-top:8px;padding:8px 12px;background:#e8722c;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;';
    backBtn.onclick = function() { state.viewingCycle = state.cycle; state.week = 1; saveState(); render(); };
    header.appendChild(backBtn);
  }
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (!state.disclaimerAccepted) { renderDisclaimer(); return; }
  if (!state.proteinGoal && !state.proteinPromptShown) { renderProteinGoalSetup(); return; }
  if (state.screen === 'onboarding') { renderOnboardingStep(app); return; }
  if (state.screen === 'onboarding_summary') { renderOnboardingSummary(); return; }
  if (state.screen === 'select_goal') { renderGoalSelect(); return; }
  if (state.screen === 'select_subgoal') { renderSubgoalSelect(); return; }
  if (state.screen === 'select_length') { renderLengthSelect(); return; }
  renderDayTabs(app);
  renderWeekPicker(app);
  if (state.screen === 'checkpoints') { renderCheckpointsScreen(app); }
  else if (state.screen === 'progress') { renderProgressScreen(app); }
  else if (state.screen === 'protein') { renderProteinScreen(app); }
  else if (state.screen === 'admin') { renderAdminScreen(app); }
  else if (state.screen === 'share') { renderShareScreen(app); }
  else { renderDayContent(app); }
}

loadState();
</script>

</body>
</html>
