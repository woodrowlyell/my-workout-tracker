* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

.cp-row input { flex: 1; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
.save-toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1c1c1a; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; transition: transform 0.25s ease; z-index: 20; }
.save-toast.show { transform: translateX(-50%) translateY(0); }

svg.chart { width: 100%; height: auto; display: block; }
.chart-stats { display: flex; gap: 16px; margin-top: 8px; font-size: 11px; color: #888; }
.chart-stats strong { color: #1c1c1a; font-size: 13px; }
.goal-screen { padding: 30px 20px; text-align: center; }
.goal-screen h2 { font-size: 20px; margin-bottom: 8px; }
.goal-screen p { font-size: 14px; color: #777; margin-bottom: 24px; }
.goal-btn { display: block; width: 100%; padding: 16px; margin-bottom: 12px; background: #fff; border: 2px solid #e6e4dc; border-radius: 12px; font-size: 15px; font-weight: 600; color: #1c1c1a; text-align: left; }
.goal-btn .desc { font-size: 12px; color: #888; font-weight: 400; margin-top: 4px; }

.modal-sheet { background: #fff; width: 100%; border-radius: 20px 20px 0 0; padding: 20px; max-height: 70vh; overflow-y: auto; }

.cp-delete-btn { font-size: 11px; color: #b31942; background: none; border: none; font-weight: 600; }

function buildPlanKey(length, goal, subgoal) {
  var key = length + '_' + goal;
  if (subgoal) key += '_' + subgoal;
  return key;
}
function isProgramAvailable(length, goal, subgoal) {
  return !!programLibrary[buildPlanKey(length, goal, subgoal)];
}
function getProgram(length, goal, subgoal) {
  return programLibrary[buildPlanKey(length, goal, subgoal)];
}

var DAY_ORDER = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

function getOrderedDayKeys() {
  var keys = Object.keys(state.activePlan);
  return DAY_ORDER.filter(function(d) { return keys.indexOf(d) !== -1; });
}

function splitDayLabel(label) {
  var dayPrefixes = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  for (var i = 0; i < dayPrefixes.length; i++) {
    var prefix = dayPrefixes[i];
    if (label.indexOf(prefix + ' ') === 0) {
      return { dayPart: prefix, typePart: label.substring(prefix.length + 1) };
    }
  }
  return { dayPart: '', typePart: label };
}

function todayStr() { return new Date().toISOString().split('T')[0]; }

function formatDateMDY(isoDateStr) {
  if (!isoDateStr) return '';
  var parts = isoDateStr.split('-');
  if (parts.length !== 3) return isoDateStr;
  return parts[1] + '-' + parts[2] + '-' + parts[0];
}

function getMondayOfWeek(startDateStr, weekNumber) {
  var startDate = new Date(startDateStr + 'T00:00:00');
  var dayOfWeek = startDate.getDay();
  var daysToSubtract = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
  var firstMonday = new Date(startDate);
  firstMonday.setDate(startDate.getDate() - daysToSubtract);
  var targetMonday = new Date(firstMonday);
  targetMonday.setDate(firstMonday.getDate() + (weekNumber - 1) * 7);
  return targetMonday.toISOString().split('T')[0];
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 1400);
}

function saveState() {
  try {
    toast('Saved');
  } catch (e) {
    toast('Save failed, try again');
  }
}

function loadState() {
  render();

  saveState();

  else { state.selectedSubgoal = null; state.screen = 'select_length'; }

  render();
}

function chooseSubgoal(subgoalKey) {
  state.selectedSubgoal = subgoalKey;
  state.screen = 'select_length';
  saveState();
  render();
}

function chooseLength(len) {
  state.selectedLength = len;
  finalizeProgram(state.selectedGoal, state.selectedSubgoal);
}

function finalizeProgram(goalKey, subgoalKey) {
  if (!isProgramAvailable(state.selectedLength, goalKey, subgoalKey)) { toast('That combination is not ready yet'); return; }
  var program = getProgram(state.selectedLength, goalKey, subgoalKey);
  var isNewCycleTransition = state.cycle > 1 && state.activePlan;
  state.goal = goalKey;
  state.selectedSubgoal = subgoalKey;
  state.activePlan = JSON.parse(JSON.stringify(program.days));
  state.programLength = state.selectedLength;
  state.cycleStartDate = todayStr();
  state.screen = 'day';
  state.week = 1;
  saveState();
  if (isNewCycleTransition) {
    setTimeout(function() { showFireworksCelebration('New program locked in! Time to crush your next cycle.'); }, 300);
  }
  render();
}

function getEntry(dayKey, exId, week, cycle) {
  var c = cycle !== undefined ? cycle : state.viewingCycle;
  var k = dayKey + '::' + exId + '::c' + c + '::w' + week;
  return state.weights[k] || null;
}
function setEntry(dayKey, exId, week, field, val) {
  var k = dayKey + '::' + exId + '::c' + state.viewingCycle + '::w' + week;
  if (!state.weights[k]) state.weights[k] = {};
  state.weights[k][field] = val;
  saveState();
}
function clearEntry(dayKey, exId, week) {
  var k = dayKey + '::' + exId + '::c' + state.viewingCycle + '::w' + week;
  delete state.weights[k];
  saveState();
}
function getPrevEntry(dayKey, exId, week) {
  for (var w = week - 1; w >= 1; w--) {
    var e = getEntry(dayKey, exId, w);
    if (e && (e.weight || e.done)) return { week: w, entry: e };
  }
  if (state.viewingCycle > 1) {
    for (var c = state.viewingCycle - 1; c >= 1; c--) {
      for (var w2 = 8; w2 >= 1; w2--) {
        var e2 = getEntry(dayKey, exId, w2, c);
        if (e2 && (e2.weight || e2.done)) return { week: w2, entry: e2, cycle: c };
      }
    }
  }
  return null;
}
function getLastKnownWeightAnyDay(exId, excludeDayKey, week, cycle) {
  var c = cycle !== undefined ? cycle : state.viewingCycle;
  var best = null;
  Object.keys(state.activePlan).forEach(function(dayKey) {
    var day = state.activePlan[dayKey];
    if (day.rest && exId !== '__steps__') return;
    if (exId !== '__steps__' && (!day.exerciseIds || day.exerciseIds.indexOf(exId) === -1)) return;
    for (var w = week; w >= 1; w--) {
      if (dayKey === excludeDayKey && w === week) continue;
      var e = getEntry(dayKey, exId, w, c);
      if (e && e.weight) {
        if (!best || w > best.week || (w === best.week && dayKey > best.dayKey)) { best = { week: w, entry: e, dayKey: dayKey }; }
      }
    }
  });
  return best;
}
function getAllEntriesForExercise(exId) {
  var results = [];
  Object.keys(state.activePlan).forEach(function(dayKey) {
    for (var c = 1; c <= state.cycle; c++) {
      for (var w = 1; w <= (state.programLength || 8); w++) {
        var e = getEntry(dayKey, exId, w, c);
        if (e && e.weight) results.push({ week: w, cycle: c, dayKey: dayKey, weight: parseFloat(e.weight), date: e.date });
      }
    }
  });
  return results;
}

function isDayComplete(dayKey, week) {
  var day = state.activePlan[dayKey];
  if (!day) return false;
  if (day.rest) {
    var e = getEntry(dayKey, '__rest_' + dayKey + '__', week);
    var restDone = !!(e && e.done);
    if (day.stepsGoal) {
      var stepsE = getEntry(dayKey, '__steps__', week);
      return restDone && !!(stepsE && stepsE.weight);
    }
    return restDone;
  }
  var mob = getEntry(dayKey, '__mobility_' + dayKey + '__', week);
  if (!mob || !mob.done) return false;
  var cardio = getEntry(dayKey, '__cardio_' + dayKey + '__', week);
  if (!cardio || !cardio.done) return false;
  for (var i = 0; i < day.exerciseIds.length; i++) {
    var exId = day.exerciseIds[i];
    var ex = exerciseLibrary[exId];
    var e2 = getEntry(dayKey, exId, week);
    if (ex.noWeight) { if (!e2 || !e2.done) return false; }
    else { if (!e2 || !e2.weight) return false; }
  }
  if (day.finisherId) {
    var fin = getEntry(dayKey, '__finisher_' + dayKey + '__', week);
    if (!fin || !fin.done) return false;
  }
  return true;
}

function isWeekComplete(week) {
  var keys = Object.keys(state.activePlan);
  for (var i = 0; i < keys.length; i++) { if (!isDayComplete(keys[i], week)) return false; }
  return true;
}

function swapDayEntries(dayKeyA, dayKeyB) {
  var newWeights = {};
  Object.keys(state.weights).forEach(function(key) {
    var parts = key.split('::');
    var keyDay = parts[0];
    if (keyDay === dayKeyA) {
      var rest = parts.slice(1).join('::');
      newWeights[dayKeyB + '::' + rest] = state.weights[key];
    } else if (keyDay === dayKeyB) {
      var rest2 = parts.slice(1).join('::');
      newWeights[dayKeyA + '::' + rest2] = state.weights[key];
    } else {
      newWeights[key] = state.weights[key];
    }
  });
  state.weights = newWeights;

  var newProteinEntries = {};
  Object.keys(state.proteinEntries).forEach(function(key) {
    var parts = key.split('::');
    var keyDay = parts[0];
    if (keyDay === dayKeyA) {
      var rest = parts.slice(1).join('::');
      newProteinEntries[dayKeyB + '::' + rest] = state.proteinEntries[key];
    } else if (keyDay === dayKeyB) {
      var rest2 = parts.slice(1).join('::');
      newProteinEntries[dayKeyA + '::' + rest2] = state.proteinEntries[key];
    } else {
      newProteinEntries[key] = state.proteinEntries[key];
    }
  });
  state.proteinEntries = newProteinEntries;

  var regexA = new RegExp('-' + dayKeyA + '$');
  var regexB = new RegExp('-' + dayKeyB + '$');
  state.celebratedDays = state.celebratedDays.map(function(k) {
    if (regexA.test(k)) return k.replace(regexA, '-' + dayKeyB);
    if (regexB.test(k)) return k.replace(regexB, '-' + dayKeyA);
    return k;
  });
}

function openDaySwapModal(sourceDayKey) {
  var overlay = document.createElement('div');

      var sourceOldContent = Object.assign({}, state.activePlan[sourceDayKey]);

      var newSourceContent = Object.assign({}, otherOldContent);

function checkAndCelebrate(dayKey, week) {
  var dayCelebrationKey = 'c' + state.cycle + '-w' + week + '-' + dayKey;
  if (isDayComplete(dayKey, week) && state.celebratedDays.indexOf(dayCelebrationKey) === -1) {
    state.celebratedDays.push(dayCelebrationKey);
    var dayKeys = getOrderedDayKeys();
    var currentIndex = dayKeys.indexOf(dayKey);
    if (currentIndex !== -1 && currentIndex < dayKeys.length - 1) {
      state.day = dayKeys[currentIndex + 1];
    }
    saveState();
    setTimeout(function() { showEncouragementModal('day'); render(); }, 350);
    return;
  }
  var weekCelebrationKey = 'c' + state.cycle + '-w' + week;
  if (isWeekComplete(week) && state.celebratedWeeks.indexOf(weekCelebrationKey) === -1) {
    state.celebratedWeeks.push(weekCelebrationKey);
    var totalWeeksForAdvance = state.programLength || 8;
    var shouldShowTip = !state.shownWeekTip;
    if (shouldShowTip) state.shownWeekTip = true;
    if (week < totalWeeksForAdvance) { state.week = week + 1; }
    saveState();
    setTimeout(function() {
      showEncouragementModal('week');
      if (shouldShowTip) { setTimeout(function() { showTipModal('week'); }, 900); }
      render();
    }, 350);
    return;
  }
  var totalWeeks = state.programLength || 8;
  var allWeeksDone = true;
  for (var w = 1; w <= totalWeeks; w++) { if (!isWeekComplete(w)) { allWeeksDone = false; break; } }
  var cycleCelebrationKey = 'c' + state.cycle;
  if (allWeeksDone && state.celebratedCycles.indexOf(cycleCelebrationKey) === -1) {
    state.celebratedCycles.push(cycleCelebrationKey);
    saveState();
    setTimeout(function() { showFireworksCelebration('You completed the whole program! Time to start your next cycle.'); }, 350);
  }
}

function proteinDayKey(dayKey, cycle, week) { return dayKey + '::c' + cycle + '::w' + week; }
function getProteinEntries(dayKey, cycle, week) {
  var c = cycle !== undefined ? cycle : state.viewingCycle;
  var w = week !== undefined ? week : state.week;
  var key = proteinDayKey(dayKey, c, w);
  return state.proteinEntries[key] || [];
}
function addProteinEntry(dayKey, name, grams) {
  var key = proteinDayKey(dayKey, state.viewingCycle, state.week);
  if (!state.proteinEntries[key]) state.proteinEntries[key] = [];
  state.proteinEntries[key].push({ name: name, grams: grams, time: todayStr() });
  saveState();
}
function removeProteinEntry(dayKey, index) {
  var key = proteinDayKey(dayKey, state.viewingCycle, state.week);
  if (state.proteinEntries[key]) { state.proteinEntries[key].splice(index, 1); saveState(); }
}
function getDailyProteinTotal(dayKey, cycle, week) {
  var entries = getProteinEntries(dayKey, cycle, week);
  var total = 0;
  entries.forEach(function(e) { total += (parseFloat(e.grams) || 0); });
  return total;
}
function getAllProteinTotals() {
  var results = [];
  Object.keys(state.activePlan).forEach(function(dayKey) {
    for (var c = 1; c <= state.cycle; c++) {
      for (var w = 1; w <= (state.programLength || 8); w++) {
        var total = getDailyProteinTotal(dayKey, c, w);
        if (total > 0) results.push({ week: w, cycle: c, dayKey: dayKey, total: total });
      }
    }
  });
  return results;
}

function buildLineChart(title, points, color) {
  var wrap = document.createElement('div');
  wrap.className = 'progress-ex-card';
  if (title) { var h = document.createElement('h4'); h.textContent = title; wrap.appendChild(h); }
  var valid = points.filter(function(p) { return p.val !== null && !isNaN(p.val); });
  if (valid.length < 2) {
    var nd = document.createElement('div');
    nd.className = 'no-data';
    nd.textContent = valid.length === 0 ? 'No data entered yet' : 'Need at least 2 data points to graph';
    wrap.appendChild(nd);
    return wrap;
  }
  var W = 320, H = 140, pad = 30;
  var vals = valid.map(function(p) { return p.val; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var range = max - min || 1;
  var stepX = (W - pad * 2) / (points.length - 1);
  var pathD = '', dots = '', labels = '';
  points.forEach(function(p, i) {
    if (p.val === null || isNaN(p.val)) return;
    var x = pad + i * stepX;
    var y = H - pad - ((p.val - min) / range) * (H - pad * 2);
    pathD += (pathD ? 'L' : 'M') + x + ',' + y + ' ';
    dots += '<circle cx="' + x + '" cy="' + y + '" r="4" fill="' + color + '"/>';
    labels += '<text x="' + x + '" y="' + (H - 6) + '" font-size="10" fill="#999" text-anchor="middle">' + p.label + '</text>';
    labels += '<text x="' + x + '" y="' + (y - 10) + '" font-size="11" fill="#333" text-anchor="middle" font-weight="600">' + p.val + '</text>';
  });
  wrap.innerHTML += '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '"><path d="' + pathD + '" fill="none" stroke="' + color + '" stroke-width="2.5"/>' + dots + labels + '</svg>';
  var first = valid[0].val, last = valid[valid.length - 1].val;
  var diff = (last - first).toFixed(1);
  var stats = document.createElement('div');
  stats.className = 'chart-stats';
  stats.innerHTML = '<div>Start: <strong>' + first + '</strong></div><div>Latest: <strong>' + last + '</strong></div><div>Change: <strong>' + (diff > 0 ? '+' : '') + diff + '</strong></div>';
  wrap.appendChild(stats);
  return wrap;
}

    container.appendChild(content);
    return;
  }
  var total = getDailyProteinTotal(state.day, state.viewingCycle, state.week);
  var remaining = Math.max(0, state.proteinGoal - total);
  var pct = Math.min(100, Math.round((total / state.proteinGoal) * 100));
  var summaryCard = document.createElement('div');
  summaryCard.className = 'card';
  summaryCard.innerHTML = '<p class="ex-name" style="font-size:16px;">' + (state.activePlan[state.day] ? state.activePlan[state.day].label : state.day) + ' protein</p>' +
    '<div style="font-size:32px;font-weight:800;margin:8px 0;">' + total + '<span style="font-size:16px;color:#999;font-weight:600;"> / ' + state.proteinGoal + 'g</span></div>' +
    '<div style="background:#f0efe9;border-radius:20px;height:10px;overflow:hidden;margin-bottom:8px;"><div style="background:#e8722c;height:100%;width:' + pct + '%;"></div></div>' +
    '<div style="font-size:13px;color:#777;">' + (remaining > 0 ? (remaining + 'g to go') : 'Goal reached!') + '</div>';
  content.appendChild(summaryCard);
  var editGoalBtn = document.createElement('button');
  editGoalBtn.textContent = 'Edit daily goal';
  editGoalBtn.style.cssText = 'width:100%;padding:8px;background:none;border:none;color:#999;font-size:12px;text-decoration:underline;margin-bottom:16px;';
  editGoalBtn.onclick = function() {
    var newGoal = prompt('Enter new daily protein goal (grams):', state.proteinGoal);
    if (newGoal) { var parsed = parseInt(newGoal, 10); if (parsed > 0) { state.proteinGoal = parsed; saveState(); render(); } }
  };
  content.appendChild(editGoalBtn);
  var quickLabel = document.createElement('div');
  quickLabel.className = 'section-label';
  quickLabel.textContent = 'Quick Add';
  content.appendChild(quickLabel);
  var quickWrap = document.createElement('div');
  quickWrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;';
  proteinPresets.forEach(function(preset) {
    var btn = document.createElement('button');
    btn.textContent = preset.name + ' - ' + preset.grams + 'g';
    btn.style.cssText = 'padding:10px 14px;background:#fff;border:1px solid #e6e4dc;border-radius:20px;font-size:13px;font-weight:600;color:#1c1c1a;';
    btn.onclick = function() { addProteinEntry(state.day, preset.name, preset.grams); render(); toast('Added ' + preset.grams + 'g'); };
    quickWrap.appendChild(btn);
  });
  content.appendChild(quickWrap);
  var customLabel = document.createElement('div');
  customLabel.className = 'section-label';
  customLabel.textContent = 'Add Custom Food';
  content.appendChild(customLabel);
  var customCard = document.createElement('div');
  customCard.className = 'card';
  customCard.innerHTML = '<div style="display:flex;gap:8px;"><input id="custom-food-name" type="text" placeholder="Food name" style="flex:2;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;"><input id="custom-food-grams" type="number" inputmode="numeric" placeholder="Grams" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;"></div>';
  var addBtn = document.createElement('button');
  addBtn.textContent = 'Add';
  addBtn.style.cssText = 'width:100%;padding:10px;margin-top:10px;background:#e8722c;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;';
  addBtn.onclick = function() {
    var nameInput = document.getElementById('custom-food-name');
    var gramsInput = document.getElementById('custom-food-grams');
    var grams = parseFloat(gramsInput.value);
    if (!nameInput.value || !grams || grams <= 0) { toast('Enter a food name and grams'); return; }
    addProteinEntry(state.day, nameInput.value, grams);
    render();
    toast('Added ' + grams + 'g');
  };
  customCard.appendChild(addBtn);
  content.appendChild(customCard);
  var entries = getProteinEntries(state.day, state.viewingCycle, state.week);
  if (entries.length > 0) {
    var loggedLabel = document.createElement('div');
    loggedLabel.className = 'section-label';
    loggedLabel.textContent = 'Logged Today';
    content.appendChild(loggedLabel);
    entries.forEach(function(entry, idx) {
      var row = document.createElement('div');
      row.className = 'card';
      row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:10px 14px;';
      row.innerHTML = '<span style="font-size:14px;">' + entry.name + '</span><span style="font-size:14px;font-weight:700;">' + entry.grams + 'g</span>';
      var delBtn = document.createElement('button');
      delBtn.textContent = 'Remove';
      delBtn.style.cssText = 'font-size:11px;color:#b31942;background:none;border:none;font-weight:600;margin-left:10px;';
      delBtn.onclick = function() { removeProteinEntry(state.day, idx); render(); };
      row.appendChild(delBtn);
      content.appendChild(row);
    });
  }
  var graphLabel = document.createElement('div');
  graphLabel.className = 'section-label';
  graphLabel.textContent = 'Protein Trend';
  content.appendChild(graphLabel);
  var allTotals = getAllProteinTotals();
  if (allTotals.length >= 2) {
    allTotals.sort(function(a, b) { return (a.cycle - b.cycle) || (a.week - b.week); });
    var points2 = allTotals.map(function(e) {
      var dayLabel = state.activePlan[e.dayKey] ? state.activePlan[e.dayKey].label.split(' ')[0] : e.dayKey;
      return { label: (state.cycle > 1 ? ('C' + e.cycle + 'W' + e.week) : ('Wk' + e.week)) + ' ' + dayLabel, val: e.total };
    });
    content.appendChild(buildLineChart('Daily Protein (g)', points2, '#e8722c'));
  } else {
    var nd3 = document.createElement('div');
    nd3.className = 'rest-note';
    nd3.textContent = 'Log protein on 2 or more days to see your trend graph.';
    content.appendChild(nd3);
  }
  container.appendChild(content);
}

function renderDayTabs(container) {
  var dt = document.createElement('div');
  dt.className = 'day-tabs';
  dt.style.cssText = 'flex-wrap:nowrap;overflow-x:visible;';
  var daySelectWrap = document.createElement('div');
  daySelectWrap.style.cssText = 'flex:1;min-width:0;';
  var keys = getOrderedDayKeys();
  var daySelect = document.createElement('select');
  daySelect.style.cssText = 'width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ddd;background:#f7f6f2;font-size:14px;font-weight:600;color:#1c1c1a;';
  keys.forEach(function(key) {
    var opt = document.createElement('option');
    opt.value = key;
    var check = isDayComplete(key, state.week) ? ' (Done)' : '';
    opt.textContent = state.activePlan[key].label + check;
    if (state.day === key && state.screen === 'day') opt.selected = true;
    daySelect.appendChild(opt);
  });
  daySelect.onchange = function() { state.day = daySelect.value; state.screen = 'day'; saveState(); render(); };
  daySelectWrap.appendChild(daySelect);
  dt.appendChild(daySelectWrap);
  var cb = document.createElement('button');
  cb.className = 'day-tab' + (state.screen === 'checkpoints' ? ' active' : '');
  cb.textContent = 'Checkpoints';
  cb.onclick = function() { state.screen = state.screen === 'checkpoints' ? 'day' : 'checkpoints'; saveState(); render(); };
  dt.appendChild(cb);
  var pb = document.createElement('button');
  pb.className = 'day-tab' + (state.screen === 'progress' ? ' active' : '');
  pb.textContent = 'Progress';
  pb.onclick = function() { state.screen = state.screen === 'progress' ? 'day' : 'progress'; saveState(); render(); };
  dt.appendChild(pb);
  container.appendChild(dt);
}

function renderWeekPicker(container) {
  var header = document.createElement('div');
  header.className = 'header';
  var cycleOptions = [];
  for (var c = 1; c <= state.cycle; c++) cycleOptions.push(c);
  var cycleSelectHtml = '';
  if (cycleOptions.length > 1) {
    cycleSelectHtml = '<select id="cycle-select" style="margin-top:8px;padding:8px 10px;border-radius:8px;border:1px solid #444;background:#2a2a27;color:#d5d4cd;font-size:13px;width:100%;">' +
      cycleOptions.map(function(cc) { return '<option value="' + cc + '"' + (cc === state.viewingCycle ? ' selected' : '') + '>Cycle ' + cc + (cc === state.cycle ? ' (current)' : '') + '</option>'; }).join('') +
      '</select>';
  }
  header.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:flex-start;">' +
    '<div><h1>' + goalTemplates[state.goal].label + '</h1><div class="sub" id="week-sub"></div></div>' +
    '<button id="protein-toggle-btn" style="flex-shrink:0;padding:8px 14px;background:' + (state.screen === 'protein' ? '#e8722c' : '#2a2a27') + ';color:#fff;border:1px solid ' + (state.screen === 'protein' ? '#e8722c' : '#444') + ';border-radius:8px;font-size:13px;font-weight:600;">Protein</button>' +
    '</div>' +
    cycleSelectHtml + '<div id="week-select-wrap" style="margin-top:10px;"></div>';
  container.appendChild(header);
  var proteinToggleBtn = header.querySelector('#protein-toggle-btn');
  proteinToggleBtn.onclick = function() { state.screen = state.screen === 'protein' ? 'day' : 'protein'; saveState(); render(); };
  if (cycleOptions.length > 1) {
    var sel = header.querySelector('#cycle-select');
    sel.onchange = function() { state.viewingCycle = parseInt(sel.value, 10); state.week = 1; saveState(); render(); };
  }
  var weekWrap = header.querySelector('#week-select-wrap');
  var totalWeeks = state.programLength || 8;
  var weekSelect = document.createElement('select');
  weekSelect.style.cssText = 'width:100%;padding:10px 12px;border-radius:8px;border:1px solid #444;background:#2a2a27;color:#d5d4cd;font-size:14px;font-weight:600;';
  for (var i = 1; i <= totalWeeks; i++) {
    var opt = document.createElement('option');
    opt.value = i;
    var check = isWeekComplete(i) ? ' (Done)' : '';
    opt.textContent = 'Week ' + i + check;
    if (state.week === i) opt.selected = true;
    weekSelect.appendChild(opt);
  }
  weekSelect.onchange = function() { state.week = parseInt(weekSelect.value, 10); saveState(); render(); };
  weekWrap.appendChild(weekSelect);
  var viewingLabel = state.viewingCycle !== state.cycle ? ' - viewing past cycle' : '';
  header.querySelector('#week-sub').textContent = 'Cycle ' + state.viewingCycle + ' - Week ' + state.week + ' of ' + totalWeeks + viewingLabel;
  if (state.viewingCycle !== state.cycle) {
    var backBtn = document.createElement('button');
    backBtn.textContent = 'Return to current cycle';
    backBtn.style.cssText = 'margin-top:8px;padding:8px 12px;background:#e8722c;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;';
    backBtn.onclick = function() { state.viewingCycle = state.cycle; state.week = 1; saveState(); render(); };
    header.appendChild(backBtn);
  }
}

function render() {
  var app = document.getElementById('app');
  app.innerHTML = '';
  if (!state.disclaimerAccepted) { renderDisclaimer(); return; }
  if (!state.proteinGoal && !state.proteinPromptShown) { renderProteinGoalSetup(); return; }
  if (state.screen === 'select_goal') { renderGoalSelect(); return; }
  if (state.screen === 'select_subgoal') { renderSubgoalSelect(); return; }
  if (state.screen === 'select_length') { renderLengthSelect(); return; }
  renderDayTabs(app);
  renderWeekPicker(app);
  if (state.screen === 'checkpoints') { renderCheckpointsScreen(app); }
  else if (state.screen === 'progress') { renderProgressScreen(app); }
  else if (state.screen === 'protein') { renderProteinScreen(app); }
  else { renderDayContent(app); }
}

loadState();
</script>
</body>
</html>
