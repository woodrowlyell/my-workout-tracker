<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Check</title>
<style>
body { font-family: -apple-system, sans-serif; background: #f4f3ef; color: #1c1c1a; padding: 20px; line-height: 1.5; }
h1 { font-size: 18px; }
.box { background: #fff; border: 2px solid #e6e4dc; border-radius: 12px; padding: 16px; margin-bottom: 16px; word-break: break-all; white-space: pre-wrap; font-size: 12px; font-family: monospace; }
.found { border-color: #4caf50; background: rgba(76,175,80,0.08); }
.notfound { border-color: #b31942; background: rgba(179,25,66,0.08); }
.status { font-weight: 700; font-size: 16px; margin-bottom: 10px; font-family: -apple-system, sans-serif; }
.info { font-size: 13px; color: #666; margin-bottom: 16px; }
</style>
</head>
<body>
<h1>Checking for saved workout data</h1>
<div class="info">This page only reads from storage. It does not write, modify, or delete anything.</div>
<div id="result"></div>
<script>
function safeStringify(val) {
  try {
    var s = JSON.stringify(val);
    return (s === undefined) ? 'undefined' : s;
  } catch (e) {
    return '(could not stringify: ' + e.message + ')';
  }
}

function addBox(className, text) {
  var box = document.createElement('div');
  box.className = 'box ' + className;
  box.textContent = String(text);
  document.getElementById('result').appendChild(box);
}

try {
  var raw = localStorage.getItem('workout-state-v3');
  if (raw) {
    var sizeKB = (new Blob([raw]).size / 1024).toFixed(1);
    addBox('found', 'FOUND: workout-state-v3 exists (' + sizeKB + ' KB)');

    try {
      var parsed = JSON.parse(raw);
      var summaryLines = [
        'Goal: ' + (parsed.goal || 'none'),
        'Cycle: ' + (parsed.cycle || 'unknown'),
        'Week: ' + (parsed.week || 'unknown'),
        'Program length: ' + (parsed.programLength || 'unknown'),
        'Weight entries stored: ' + (parsed.weights ? Object.keys(parsed.weights).length : 0),
        'Protein entries stored: ' + (parsed.proteinEntries ? Object.keys(parsed.proteinEntries).length : 0),
        'Checkpoints - start: ' + safeStringify(parsed.checkpoints && parsed.checkpoints.start),
        'Checkpoints - week4: ' + safeStringify(parsed.checkpoints && parsed.checkpoints.week4),
        'Checkpoints - week8: ' + safeStringify(parsed.checkpoints && parsed.checkpoints.week8)
      ];
      addBox('found', summaryLines.join('\n'));
    } catch (parseErr) {
      addBox('notfound', 'Data exists but could not be parsed as JSON. Raw error: ' + parseErr.message);
    }

    addBox('found', 'RAW DATA (copy this text somewhere safe as a backup):\n\n' + raw);
  } else {
    addBox('notfound', 'NOT FOUND: no data under key "workout-state-v3" at this origin');
  }

  var allKeysText = 'All localStorage keys at this origin (' + localStorage.length + ' total):\n\n';
  if (localStorage.length === 0) {
    allKeysText += '(none)';
  } else {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      var v = localStorage.getItem(k);
      allKeysText += k + ' (' + (v ? v.length : 0) + ' characters)\n';
    }
  }
  addBox('', allKeysText);

  addBox('', 'Current page origin: ' + window.location.origin + '\nFull URL: ' + window.location.href);
} catch (e) {
  addBox('notfound', 'Error while checking storage: ' + e.message);
}
</script>
</body>
</html>
